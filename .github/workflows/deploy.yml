name: GitHub Pages — redirect to moreyderech.com

# The site lives at moreyderech.com (Cloudflare, with the paywall). GitHub Pages used to serve a full, free
# copy of it; now it serves only a redirect that keeps the path, so old links still land (owner, 19.11).
# One file stays: the route map's tiles (embeds/map/data/israel.pmtiles, 95MB), which is too big for
# Cloudflare's static assets and is loaded from here (public/embeds/map/index.html, MAP_PMTILES_URL).
on:
  push:
    branches: [main]
    paths: [".github/workflows/deploy.yml", "public/embeds/map/data/israel.pmtiles"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  redirect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: public/embeds/map/data/israel.pmtiles
          sparse-checkout-cone-mode: false

      - name: Build the redirect
        run: |
          mkdir -p out
          cat > out/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="he" dir="rtl"><head><meta charset="utf-8">
          <meta name="robots" content="noindex">
          <link rel="canonical" href="https://moreyderech.com/">
          <title>אבן דרך למורי דרך עבר לכתובת חדשה</title>
          <script>
            var p = location.pathname.replace(/^\/moreh-derech/, "") || "/";
            location.replace("https://moreyderech.com" + p + location.search + location.hash);
          </script>
          <meta http-equiv="refresh" content="0; url=https://moreyderech.com/">
          </head><body><p>האתר עבר ל-<a href="https://moreyderech.com/">moreyderech.com</a>.</p></body></html>
          HTML
          cp out/index.html out/404.html
          touch out/.nojekyll
          mkdir -p out/embeds/map/data
          cp public/embeds/map/data/israel.pmtiles out/embeds/map/data/israel.pmtiles

      - name: Replace the gh-pages branch with the redirect
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          force_orphan: true
