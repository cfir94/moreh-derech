name: Fetch architecture photos

# upload.wikimedia.org throttles some build networks outright, so the field
# photos of the classical architecture studio are downloaded here, on
# GitHub's runners, and committed back to the branch that changed the list.
on:
  push:
    paths:
      - "tools/architecture_photos.json"
      - "tools/fetch_architecture_photos.py"
      - ".github/workflows/fetch-architecture-photos.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: architecture-photos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python3 tools/fetch_architecture_photos.py
      - name: Commit the photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public/architecture/photos src/data/classical-architecture/photos.ts
          if git diff --cached --quiet; then echo "photos already up to date"; exit 0; fi
          git commit -m "Fetch architecture photos from Wikimedia Commons"
          git push
