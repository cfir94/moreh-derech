name: Collect Herodian companion images
on:
  push:
    branches: [roman-portraits-20261023]
    paths: [tools/collect-roman-portraits.py, .github/workflows/collect-roman-portraits.yml]
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - run: python tools/collect-roman-portraits.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/herodian-image-sources.json public/images/roman-people/companions
          git commit -m 'Download three identified Herodian companion images'
          git push origin HEAD:roman-portraits-20261023
