name: Fetch learning map photos

# Like fetch-architecture-photos.yml: upload.wikimedia.org throttles the build
# containers, so the learning map's photos are downloaded on GitHub's runners
# whenever the manifest changes, and committed back to the same branch.
on:
  push:
    paths:
      - "tools/learning_map_photos.json"
      - "tools/fetch_learning_map_photos.py"
      - ".github/workflows/fetch-learning-map-photos.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: learning-map-photos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python3 tools/fetch_learning_map_photos.py
      - name: Commit the photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public/learning-map/photos src/data/learning-map/photos.ts tools/learning_map_photos.lock.json
          if git diff --cached --quiet; then echo "photos already up to date"; exit 0; fi
          git commit -m "Fetch learning map photos from Wikimedia Commons"
          git push
