name: Fetch clergy-identification photos

# Like fetch-learning-map-photos.yml: upload.wikimedia.org throttles the build
# containers, so the photos of "גלימות ירושלים" are downloaded on GitHub's
# runners whenever the manifest changes, and committed back to the same branch.
on:
  push:
    paths:
      - "tools/christian_dress_photos.json"
      - "tools/fetch_christian_dress_photos.py"
      - ".github/workflows/fetch-christian-dress-photos.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: christian-dress-photos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python3 tools/fetch_christian_dress_photos.py
      - name: Commit the photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A public/images/christian-dress src/data/christian-dress/photos.json tools/christian_dress_photos.report.txt
          if git diff --cached --quiet; then echo "photos already up to date"; exit 0; fi
          git commit -m "Fetch clergy-identification photos from Wikimedia Commons"
          git pull --rebase
          git push
