name: Collect faith study portraits
on:
  push:
    branches: [who-am-i-faith-20261023]
    paths: ['scripts/faith-media.py', 'scripts/faith-media.json', '.github/workflows/faith-media.yml']
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - run: python scripts/faith-media.py
