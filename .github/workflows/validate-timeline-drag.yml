name: Validate course timeline sorting
on:
  push:
    branches: [main, timeline-drag-periods-20261025]
    paths: ['src/data/timelines/drag-sets.ts', 'src/data/timelines/types.ts', 'src/components/timeline/TimelineDrag.tsx', 'tests/timeline-drag-periods-ui.mjs', '.github/workflows/validate-timeline-drag.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx eslint src/data/timelines/drag-sets.ts src/data/timelines/types.ts src/components/timeline/TimelineDrag.tsx
      - run: npm run build
      - run: npm install --no-save --package-lock=false @playwright/test@1.64.1
      - run: node --experimental-strip-types tests/timeline-drag-periods-ui.mjs
