\"text\":\"היעדר קשר לממצא המטבעי\",\"correct\":false}],\"explanation\":\"השיעור מציג מעבר מחלוקה טיפולוגית שנתפסה ככרונולוגית בלבד להבנת הבדלים אזוריים. סגנון לבדו אינו תאריך ודאי.\",\"topic\":\"roman-byzantine\",\"source\":\"חומר הקורס — התקופה הרומית המאוחרת והביזנטית — יחידה B — השינויים האדריכליים — רגיונליות\"},{\"id\":50,\"question\":\"איזה ממצא מסייע לקבוע מועד מוקדם ביותר להנחת רצפת בית כנסת?\",\"category\":\"בתי כנסת ואוכלוסייה\",\"answers\":[{\"text\":\"מטבע שנמצא על פניה\",\"correct\":false},{\"text\":\"מטבע בשכבה חתומה מתחתיה\",\"correct\":true},{\"text\":\"חרס מהשביל שמחוץ למבנה\",\"correct\":false},{\"text\":\"כתובת מודרנית בכניסה\",\"correct\":false}],\"explanation\":\"מטבע מהקשר חתום מתחת לרצפה מעיד שלא הונחה לפני מועד טביעתו. השיעור מדגים את חשיבות המטבעות בדיון על תיארוך בתי הכנסת.\",\"topic\":\"roman-byzantine\",\"source\":\"חומר הקורס — התקופה הרומית המאוחרת והביזנטית — יחידה B — כפר נחום וברעם — מטבעות מתחת לרצפות\"},{\"id\":51,\"question\":\"איזו אוכלוסייה נפגעה קשות מדיכוי מרידות במאות החמישית והשישית?\",\"category\":\"בתי כנסת ואוכלוסייה\",\"answers\":[{\"text\":\"הנבטים\",\"correct\":false},{\"text\":\"האדומים\",\"correct\":false},{\"text\":\"השומרונים\",\"correct\":true},{\"text\":\"היטורים\",\"correct\":false}],\"explanation\":\"מרידות השומרונים נגד השלטון הביזנטי ודיכוין פגעו מאוד ביישוב השומרוני בארץ.\",\"topic\":\"roman-byzantine\",\"source\":\"חומר הקורס — התקופה הרומית המאוחרת והביזנטית — יחידה B — מרידות גדולות של השומרונים\"},{\"id\":52,\"question\":\"איזה רצף מתאר את חילופי השלטון בירושלים במאה השביעית?\",\"category\":\"סיום התקופה\",\"answers\":[{\"text\":\"ביזנטים, מוסלמים, פרסים, ביזנטים\",\"correct\":false},{\"text\":\"פרסים, ביזנטים, מוסלמים, פרסים\",\"correct\":false},{\"text\":\"ביזנטים, פרסים, מוסלמים, ביזנטים\",\"correct\":false},{\"text\":\"ביזנטים, פרסים, ביזנטים, מוסלמים\",\"correct\":true}],\"explanation\":\"הכיבוש הפרסי בשנת 614 היה זמני. לאחר חזרת השלטון הביזנטי בא הכיבוש המוסלמי, המסיים את התקופה הביזנטית בארץ.\",\"topic\":\"roman-byzantine\",\"source\":\"חומר הקורס — התקופה הרומית המאוחרת והביזנטית — יחידה B — המאבקים עם פרס — כיבוש קצר וסיום התקופה\"},{\"id\":53,\"question\":\"על פי המסורת, היכן סמך רבי יהודה בן בבא חכמים בימי גזירות השמד?\",\"category\":\"מרד בר כוכבא ואיליה קפיטולינה\",\"answers\":[{\"text\":\"בין אושא לשפרעם\",\"correct\":true},{\"text\":\"בין ציפורי לטבריה\",\"correct\":false},{\"text\":\"בין ביתר לירושלים\",\"correct\":false},{\"text\":\"בין יבנה ללוד\",\"correct\":false}],\"explanation\":\"לפי הסיפור המובא בהרצאה, הסמיכה נעשתה בין תחומי שתי ערים כדי שלא להביא לענישה של עיר מסוימת. זו מסורת חז״לית, ולא תיעוד מנהלי רומי.\",\"topic\":\"roman-byzantine\",\"source\":\"חומר הקורס — התקופה הרומית המאוחרת והביזנטית — יחידה M — רבי יהודה בן בבה, בין שטח השיפוט של אושא ושפרעם\"},{\"id\":54,\"question\":\"איזה מבנה מתואר על מטבעות של מרד בר כוכבא?\",\"category\":\"מרד בר כוכבא ואיליה קפיטולינה\",\"answers\":[{\"text\":\"ארמון הנציב\",\"correct\":false},{\"text\":\"חזית המקדש\",\"correct\":true},{\"text\":\"תיאטרון רומי\",\"correct\":false},{\"text\":\"שער ניצחון\",\"correct\":false}],\"explanation\":\"חזית המבנה בעל העמודים מזוהה במחקר עם המקדש ומבטאת את זיקת המרד לירושלים ולחידוש המקדש. אין פירוש הדבר שהמקדש נבנה מחדש בפועל.\",\"topic\":\"roman-byzantine\",\"source\":\"חומר הקורס — התקופה הרומית המאוחרת והביזנטית — יחידה M — בחזית המטבעה, בית המקדש\"},{\"id\":55,\"question\":\"איזה זיהוי הציע יזהר הירשפלד לבסיליקה שחפר בטבריה?\",\"category\":\"משנה, תלמוד והנהגה יהודית\",\"answers\":[{\"text\":\"כנסיית המרטיריון\",\"correct\":false},{\"text\":\"ארמון אגריפס השני\",\"correct\":false},{\"text\":\"מושב הסנהדרין\",\"correct\":true},{\"text\":\"בית מרחץ צבאי\",\"correct\":false}],\"explanation\":\"הירשפלד הציע לזהות את הבסיליקה עם מבנה של ההנהגה היהודית או הסנהדרין. זהו זיהוי מחקרי מוצע שיש להציג כהשערה.\",\"topic\":\"roman-byzantine\",\"source\":\"חומר הקורס — התקופה הרומית המאוחרת והביזנטית — יחידה M — בסיליקה שלדעת הירשד, מבנה הסנהדרין\"},{\"id\":56,\"question\":\"מה הייתה משמעות עריכת המשנה בידי רבי יהודה הנשיא?\",\"category\":\"משנה, תלמוד והנהגה יהודית\",\"answers\":[{\"text\":\"תרגום המקרא ליוונית מדוברת\",\"correct\":false},{\"text\":\"כתיבת פירוש לתלמוד הירושלמי\",\"correct\":false},{\"text\":\"החלפת התורה שבכתב בספר חדש\",\"correct\":false},{\"text\":\"גיבוש מסורות הלכה לקובץ מחייב\",\"correct\":true}],\"explanation\":\"עריכת המשנה כללה איסוף, בחירה וסידור של מסורות הלכה. זהו גיבוש של קובץ בעל מעמד מרכזי בתורה שבעל פה.\",\"topic\":\"roman-byzantine\",\"source\":\"חומר הקורס — התקופה הרומית המאוחרת והביזנטית — יחידה M — קודפיקציה, קנוניזציה\"},{\"id\":57,\"question\":\"לאיזה יעד הועבר מס היהודים שהוטל לאחר חורבן המקדש?\",\"category\":\"שלטון, צבא ועיור\",\"answers\":[{\"text\":\"מקדש יופיטר ברומא\",\"correct\":true},{\"text\":\"קופת הנציב בקיסריה\",\"correct\":false},{\"text\":\"אוצר הלגיון בירושלים\",\"correct\":false},{\"text\":\"מקדש זאוס באולימפיה\",\"correct\":false}],\"explanation\":\"כחלק מהשפלת העם המנוצח, הפכו הרומאים את מס מחצית השקל שניתן בעבר למקדש בירושלים למס כפוי שהועבר למקדש יופיטר ברומא.\",\"topic\":\"roman-byzantine\",\"source\":\"חומר הקורס — התקופה הרומית המאוחרת והביזנטית — יחידה J — מס היהודים, מקדש יופיטר ברומא\"},{\"id\":58,\"question\":\"כיצד נקראה הדרך שסלל טריאנוס מבצרה לאיילה?\",\"category\":\"שלטון, צבא ועיור\",\"answers\":[{\"text\":\"ויה אפיה אנטיקה\",\"correct\":false},{\"text\":\"ויה טריאנה נובה\",\"correct\":true},{\"text\":\"ויה איגנטיה\",\"correct\":false},{\"text\":\"ויה מריס\",\"correct\":false}],\"explanation\":\"בעקבות סיפוח הממלכה הנבטית והפיכתה לפרובינקיה ערביה בשנת 106, סלל הקיסר טריאנוס דרך סלולה מרכזית מבצרה לאקבה שנקראה ויה טריאנה נובה.\",\"topic\":\"roman-byzantine\",\"source\":\"חומר הקורס — התקופה הרומית המאוחרת והביזנטית — יחידה J — דרך מבשרה לאקבה, יה טרינה נובה\"},{\"id\":59,\"question\":\"היכן הוצב מחנה הלגיון השישי בצפון הארץ?\",\"category\":\"שלטון, צבא ועיור\",\"answers\":[{\"text\":\"בקיסריה, לחוף הים\",\"correct\":false},{\"text\":\"בבית שאן, בבקעה\",\"correct\":false},{\"text\":\"בלגיו, ליד מגידו\",\"correct\":true},{\"text\":\"באיילה, ליד ים סוף\",\"correct\":false}],\"explanation\":\"לגיו סמוכה לתל מגידו ונקשרה לשם הלגיון. היא מזוהה במרחב כפר עותנאי ולג׳ון, בצומת דרכים מרכזי.\",\"topic\":\"roman-byzantine\",\"source\":\"חומר הקורס — התקופה הרומית המאוחרת והביזנטית — יחידה J — הלגיון השישי, לגיו, למרגלות מגידו\"},{\"id\":60,\"question\":\"איזו עיר נודעה בשם דיוקיסריה בתקופה הרומית?\",\"category\":\"שלטון, צבא ועיור\",\"answers\":[{\"text\":\"לוד\",\"correct\":false},{\"text\":\"בית גוברין\",\"correct\":false},{\"text\":\"שכם\",\"correct\":false},{\"text\":\"ציפורי\",\"correct\":true}],\"explanation\":\"דיוקיסריה היא שמה הרומי של ציפורי. דיוספוליס מזוהה עם לוד, אלאותרופוליס עם בית גוברין וניאפוליס עם שכם.\",\"topic\":\"roman-byzantine\",\"source\":\"חומר הקורס — התקופה הרומית המאוחרת והביזנטית — יחידה J — ציפורי, דיוקייסריה\"},{\"id\":61,\"question\":\"מה היה תפקיד המצודות בעין בוקק, בחצבה ובעבדת במערך הרומי?\",\"category\":\"שלטון, צבא ועיור\",\"answers\":[{\"text\":\"הגנת המרחב הדרומי\",\"correct\":true},{\"text\":\"מצור על ערים מורדות\",\"correct\":false},{\"text\":\"אימון מגויסים לצבא\",\"correct\":false},{\"text\":\"אבטחת חצר הקיסר\",\"correct\":false}],\"explanation\":\"המצודות בעין בוקק, בחצבה ובעבדת מובאות בהרצאה כחלק מהגנת דרום הארץ. מדובר בהיערכות להגנת המרחב, ולא במחנות מצור, בבסיסי טירונים או במגורי משמר הקיסר. אין להסיק שכל המצודות נבנו יחד או שהיה קו חומה רציף.\",\"topic\":\"roman-byzantine\",\"source\":\"חומר הקורס — התקופה הרומית המאוחרת והביזנטית — יחידה B — לימס פלסטיני, עין בוקק, בחצבה, בעובדת\"},{\"id\":62,\"question\":\"אילו אותיות יווניות מרכיבות את סמל הכריסטוגרם?\",\"category\":\"התנצרות האימפריה\",\"answers\":[{\"text\":\"אלפא ואומגה\",\"correct\":false},{\"text\":\"כי ורו\",\"correct\":true},{\"text\":\"יוטא ואיפסילון\",\"correct\":false},{\"text\":\"תטא וזטא\",\"correct\":false}],\"explanation\":\"כי ורו הן האותיות הראשונות בכתיב היווני של כריסטוס. הסמל קשור במסורת לחזונו של קונסטנטינוס ומופיע באמנות נוצרית.\",\"topic\":\"roman-byzantine\",\"source\":\"חומר הקורס — התקופה הרומית המאוחרת והביזנטית — יחידה B — כריסטוגרם, חי ורו\"},{\"id\":63,\"question\":\"באיזה שלב בחייו הוטבל קונסטנטינוס לנצרות?\",\"category\":\"התנצרות האימפריה\",\"answers\":[{\"text\":\"בעת הכתרתו\",\"correct\":false},{\"text\":\"לפני קרב מילביוס\",\"correct\":false},{\"text\":\"סמוך למותו\",\"correct\":true},{\"text\":\"בעת ועידת ניקיה\",\"correct\":false}],\"explanation\":\"קונסטנטינוס תמך בנצרות שנים רבות לפני טבילתו, שנערכה סמוך למותו. יש להבחין בין תמיכה בדת לבין טקס הטבילה.\",\"topic\":\"roman-byzantine\",\"source\":\"חומר הקורס — התקופה הרומית המאוחרת והביזנטית — יחידה B — התנצר רק על ארס דואי\"},{\"id\":64,\"question\":\"מה משמעות התואר תיאוטוקוס שניתן למרים?\",\"category\":\"התנצרות האימפריה\",\"answers\":[{\"text\":\"יולדת המשיח בלבד\",\"correct\":false},{\"text\":\"אם השליחים\",\"correct\":false},{\"text\":\"מלכת השמים בלבד\",\"correct\":false},{\"text\":\"יולדת האל\",\"correct\":true}],\"explanation\":\"בוועידת אפסוס הוכרע הוויכוח על מעמד מרים ונקבע התואר תיאוטוקוס (יולדת האל), בניגוד לתואר כריסטוטוקוס (יולדת המשיח בלבד).\",\"topic\":\"roman-byzantine\",\"source\":\"חומר הקורס — התקופה הרומית המאוחרת והביזנטית — יחידה B — תאטוקוס, יולדת האל\"},{\"id\":65,\"question\":\"באיזו סוגיה עוסקת המחלוקת המונופיזיטית?\",\"category\":\"התנצרות האימפריה\",\"answers\":[{\"text\":\"הטבע האנושי והאלוהי בישו\",\"correct\":true},{\"text\":\"השימוש באיקונות בכנסייה\",\"correct\":false},{\"text\":\"מועד ציון חג הפסחא\",\"correct\":false},{\"text\":\"חלוקת סמכות בין פטריארכים\",\"correct\":false}],\"explanation\":\"המחלוקת עוסקת בהבנת טבעו של ישו וביחס בין האנושי לאלוהי. יש להבחין בינה לבין המחלוקת האריאנית ומחלוקות על איקונות.\",\"topic\":\"roman-byzantine\",\"source\":\"חומר הקורס — התקופה הרומית המאוחרת והביזנטית — יחידה B — המחלוקת המונופיזיטית, הטבע האלוהי... והטבע האנושי\"},{\"id\":66,\"question\":\"איזה אתר באזור חברון נכלל במפעלי הבנייה הנוצריים הקונסטנטיניים?\",\"category\":\"כנסיות, צליינות ונזירות\",\"answers\":[{\"text\":\"תל רומיידה\",\"correct\":false},{\"text\":\"אלוני ממרא\",\"correct\":true},{\"text\":\"חורבת ענים\",\"correct\":false},{\"text\":\"חורבת אשתמוע\",\"correct\":false}],\"explanation\":\"אלוני ממרא קשור במסורת למפגש אברהם והמלאכים, ונמנה בהרצאה עם מפעלי הבנייה הנוצריים בראשית התקופה הביזנטית.\",\"topic\":\"roman-byzantine\",\"source\":\"חומר הקורס — התקופה הרומית המאוחרת והביזנטית — יחידה B — הלנה, אלוני ממרה\"},{\"id\":67,\"question\":\"היכן נחשף אולם תפילה נוצרי קדום במתחם בית כלא?\",\"category\":\"כנסיות, צליינות ונזירות\",\"answers\":[{\"text\":\"ליד קיסריה\",\"correct\":false},{\"text\":\"ליד ציפורי\",\"correct\":false},{\"text\":\"ליד מגידו\",\"correct\":true},{\"text\":\"ליד בית גוברין\",\"correct\":false}],\"explanation\":\"במתחם הכלא הסמוך למגידו וללגיו נחשף אולם תפילה נוצרי קדום. הוא מדגים את חיי הקהילות הנוצריות לפני הבנייה הכנסייתית המונומנטלית.\",\"topic\":\"roman-byzantine\",\"source\":\"חומר הקורס — התקופה הרומית המאוחרת והביזנטית — יחידה B — בלגיו, מתחם בית הכלא\"},{\"id\":68,\"question\":\"איזה צמד מנזרים במדבר יהודה נלמד בעיקר כאתרים ארכאולוגיים?\",\"category\":\"כנסיות, צליינות ונזירות\",\"answers\":[{\"text\":\"מר סבא וסנט ג׳ורג׳\",\"correct\":false},{\"text\":\"דיר חג׳לה וקרנטל\",\"correct\":false},{\"text\":\"תיאודוסיוס ומר סבא\",\"correct\":false},{\"text\":\"אותימיוס ומרטיריוס\",\"correct\":true}],\"explanation\":\"המרצה מבחין בין מנזרים פעילים (כמו דיר חג׳לה, מר סבא וסנט ג׳ורג׳) לבין מנזר אבטימיוס (במישור אדומים) ומנזר מרטיריוס (במעלה אדומים) שהם אתרים ארכיאולוגיים.\",\"topic\":\"roman-byzantine\",\"source\":\"חומר הקורס — התקופה הרומית המאוחרת והביזנטית — יחידה B — מרטיריוס ואטימיוס שהם מנזרים שאינם אלא אתרים ארכיאולוגיים\"},{\"id\":69,\"question\":\"איזו כנסייה בנתה אודוקיה מצפון לשער שכם?\",\"category\":\"ירושלים ומפת מידבא\",\"answers\":[{\"text\":\"סטפנוס הקדוש\",\"correct\":true},{\"text\":\"הניאה של מרים\",\"correct\":false},{\"text\":\"אלאונה בהר הזיתים\",\"correct\":false},{\"text\":\"הגיה ציון\",\"correct\":false}],\"explanation\":\"אודוקיה הקימה מצפון לעיר כנסייה הקשורה לפולחן סטפנוס, המרטיר הראשון במסורת הנוצרית. המקום קשור למתחם סנט אטיין של ימינו.\",\"topic\":\"roman-byzantine\",\"source\":\"חומר הקורס — התקופה הרומית המאוחרת והביזנטית — יחידה B — אודוקיה, סטפנוס הקדוש, מצפון לשער שכם\"},{\"id\":70,\"question\":\"איזה ממצא בחמת גדר קשור לקיסרית אודוקיה?\",\"category\":\"שלטון, צבא ועיור\",\"answers\":[{\"text\":\"מפת פסיפס של ירושלים\",\"correct\":false},{\"text\":\"כתובת שיר למרחצאות\",\"correct\":true},{\"text\":\"פסל אודוקיה בשער העיר\",\"correct\":false},{\"text\":\"צו להקמת בית כנסת\",\"correct\":false}],\"explanation\":\"כתובת יוונית בחמת גדר משמרת שיר הלל של אודוקיה למרחצאות. זו דוגמה לחיבור בין מקור כתוב, פעילות קיסרית ואתר בשטח.\",\"topic\":\"roman-byzantine\",\"source\":\"חומר הקורס — התקופה הרומית המאוחרת והביזנטית — יחידה B — אודוקיה, שיר הלל, חמת גדר\"},{\"id\":71,\"question\":\"איזה גורם מסביר את קיומם של שני קרדינים בירושלים?\",\"category\":\"ירושלים ומפת מידבא\",\"answers\":[{\"text\":\"הפרדת יהודים מנוצרים\",\"correct\":false},{\"text\":\"חלוקת העיר לשני מחוזות\",\"correct\":false},{\"text\":\"הפרשי הגובה בתוך העיר\",\"correct\":true},{\"text\":\"הפרדת השוק מבתי הכנסת\",\"correct\":false}],\"explanation\":\"הטופוגרפיה של הגבעה המערבית ושל הגיא המרכזי הכתיבה צירי אורך במפלסים שונים. תכנון רומי אינו תמיד רשת אחידה המנותקת מן השטח.\",\"topic\":\"roman-byzantine\",\"source\":\"חומר הקורס — התקופה הרומית המאוחרת והביזנטית — יחידה B — שני רחובות מקבילים, תכתיב טופוגרפי\"},{\"id\":72,\"question\":\"באיזה אזור בירושלים עמדה כנסיית הגיה ציון הביזנטית?\",\"category\":\"ירושלים ומפת מידבא\",\"answers\":[{\"text\":\"הר הזיתים\",\"correct\":false},{\"text\":\"הר הבית\",\"correct\":false},{\"text\":\"גבעת הגולגולת\",\"correct\":false},{\"text\":\"הר ציון\",\"correct\":true}],\"explanation\":\"כנסיית ציון הקדושה עמדה בהר ציון, במרחב המזוהה כיום עם כנסיית הדורמיציון. אין לזהות כל חלק במבנה המודרני כשריד ביזנטי.\",\"topic\":\"roman-byzantine\",\"source\":\"חומר הקורס — התקופה הרומית המאוחרת והביזנטית — יחידה B — הגיה ציון, כנסיית הדור מציון\"},{\"id\":73,\"question\":\"איזו סצנה מקראית מתוארת בפסיפס בית הכנסת בבית אלפא?\",\"category\":\"בתי כנסת ואוכלוסייה\",\"answers\":[{\"text\":\"עקדת יצחק\",\"correct\":true},{\"text\":\"דניאל בגוב האריות\",\"correct\":false},{\"text\":\"דוד המנגן בכינור\",\"correct\":false},{\"text\":\"יוסף ואחיו במצרים\",\"correct\":false}],\"explanation\":\"עקדת יצחק מופיעה באחד מלוחות הפסיפס בבית אלפא. מרכז הרצפה כולל גלגל מזלות; אין לבלבל בין לוחות התוכנית האמנותית.\",\"topic\":\"roman-byzantine\",\"source\":\"חומר הקורס — התקופה הרומית המאוחרת והביזנטית — יחידה B — בית אלפה, עקדת יצחק\"},{\"id\":74,\"question\":\"איזו סיסמה מופיעה על מטבעות מרד בר כוכבא?\",\"category\":\"מרד בר כוכבא ואיליה קפיטולינה\",\"answers\":[{\"text\":\"יהודה השבויה\",\"correct\":false},{\"text\":\"לחירות ירושלים\",\"correct\":true},{\"text\":\"לשלום הקיסר\",\"correct\":false},{\"text\":\"רומא המנצחת\",\"correct\":false}],\"explanation\":\"הסיסמה לחירות ירושלים מעידה על יעד מדיני וסמלי של המרד. יש להבחין בינה לבין מסרי הניצחון הרומיים על מטבעות יהודה השבויה.\",\"topic\":\"roman-byzantine\",\"source\":\"חומר הקורס — התקופה הרומית המאוחרת והביזנטית — יחידה M — בר כוכבה טובע מטבעות מיוחדים לחירות ירושלים\"},{\"id\":75,\"question\":\"איזה דימוי אופייני לסדרת מטבעות ״יהודה השבויה״?\",\"category\":\"מרד בר כוכבא ואיליה קפיטולינה\",\"answers\":[{\"text\":\"מקדש וארבעת המינים\",\"correct\":false},{\"text\":\"מנורה ולוחות הברית\",\"correct\":false},{\"text\":\"אישה אבלה ליד עץ תמר\",\"correct\":true},{\"text\":\"אוניית מסחר וענף זית\",\"correct\":false}],\"explanation\":\"בסדרה הרומית שלאחר המרד הגדול מופיעים דימויים של יהודה המובסת, ובהם אישה אבלה ליד תמר. הדימויים הם תעמולת ניצחון רומית.\",\"topic\":\"roman-byzantine\",\"source\":\"חומר הקורס — התקופה הרומית המאוחרת והביזנטית — יחידה J — עץ תמר... חייל רומאי... אישה מכוננת, מהורהרת... יהודה קפטא\"},{\"id\":76,\"question\":\"באיזה מרחב התחולל בעיקר מרד התפוצות בימי טריא
