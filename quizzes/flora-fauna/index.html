,\"correct\":false},{\"text\":\"שלושתם אנדמיים לישראל בלבד\",\"correct\":false},{\"text\":\"שלושתם צמחי מדבר הגדלים רק בנגב\",\"correct\":false}],\"explanation\":\"הכרזתם כערכי טבע מוגנים באה בעקבות קטיף מסחרי שסיכן את אוכלוסיותיהם.\",\"topic\":\"flora-fauna\"},{\"id\":144,\"question\":\"מתי פורח החצב המצוי?\",\"category\":\"צמחים ובתי גידול\",\"answers\":[{\"text\":\"בסוף הקיץ, לפני הגשמים הראשונים\",\"correct\":true},{\"text\":\"באמצע החורף, אחרי הגשמים\",\"correct\":false},{\"text\":\"באביב, יחד עם הכלניות\",\"correct\":false},{\"text\":\"בסתיו המאוחר, אחרי היורה\",\"correct\":false}],\"explanation\":\"החצב פורח מהבצל על יבש, ורק אחר כך מוציא עלים — ולכן שימש סמן גבולות שדות בסוף הקיץ.\",\"topic\":\"flora-fauna\"},{\"id\":145,\"question\":\"\\\"דרום אדום\\\" — פריחת החורף בעוטף עזה — מבוססת בעיקר על:\",\"category\":\"צמחים ובתי גידול\",\"answers\":[{\"text\":\"כלנית מצויה\",\"correct\":true},{\"text\":\"נורית אסיה\",\"correct\":false},{\"text\":\"פרג נסתר\",\"correct\":false},{\"text\":\"דם המכבים האדום\",\"correct\":false}],\"explanation\":\"הכלנית פורחת בשיא החורף; הנורית והפרג פורחים אחריה באביב, ודם המכבים הוא מין אנדמי ונדיר.\",\"topic\":\"flora-fauna\"},{\"id\":146,\"question\":\"מה מייחד את דם המכבים האדום?\",\"category\":\"מינים: אנדמי, פולש, נכחד\",\"answers\":[{\"text\":\"הוא מין אנדמי הגדל בישראל בלבד\",\"correct\":true},{\"text\":\"הוא מין פולש שהגיע מאירופה\",\"correct\":false},{\"text\":\"הוא מין מדברי הגדל רק בערבה\",\"correct\":false},{\"text\":\"הוא מין שנכחד מן הטבע והושב אליו\",\"correct\":false}],\"explanation\":\"אנדמי = תפוצתו העולמית מוגבלת לאזור אחד. דוגמאות נוספות: אירוס הגלבוע ואזובית החרמון.\",\"topic\":\"second-temple\"},{\"id\":147,\"question\":\"מהי ההגדרה של מין פולש?\",\"category\":\"מינים: אנדמי, פולש, נכחד\",\"answers\":[{\"text\":\"מין שהובא בידי אדם, התבסס והתפשט על חשבון מינים מקומיים\",\"correct\":true},{\"text\":\"מין שחדר בכוחות עצמו מארץ שכנה ואינו מזיק\",\"correct\":false},{\"text\":\"מין הגדל רק בשטחים מופרים ואינו מתרבה בטבע\",\"correct\":false},{\"text\":\"מין שנכחד מן הטבע והושב אליו בידי האדם\",\"correct\":false}],\"explanation\":\"שלושת התנאים הם הבאה בידי אדם, התבססות עצמאית ופגיעה במערכת המקומית — ולא עצם היותו זר.\",\"topic\":\"geography\"},{\"id\":148,\"question\":\"מי מבין הבאים הוא מין פולש שהתבסס בערי ישראל?\",\"category\":\"מינים: אנדמי, פולש, נכחד\",\"answers\":[{\"text\":\"מיינה מצויה\",\"correct\":true},{\"text\":\"דוכיפת\",\"correct\":false},{\"text\":\"בולבול\",\"correct\":false},{\"text\":\"זרזיר מצוי\",\"correct\":false}],\"explanation\":\"המיינה נמלטה מגני חיות בשנות ה-90 ומשתלטת על חללי קינון של מינים מקומיים.\",\"topic\":\"geography\"},{\"id\":149,\"question\":\"איזה מין נכחד מנופי ישראל בראשית המאה ה-20 ולא הושב לטבע?\",\"category\":\"מינים: אנדמי, פולש, נכחד\",\"answers\":[{\"text\":\"הדוב הסורי\",\"correct\":true},{\"text\":\"היעל הנובי\",\"correct\":false},{\"text\":\"הצבי הארץ-ישראלי\",\"correct\":false},{\"text\":\"הזאב המצוי\",\"correct\":false}],\"explanation\":\"הדוב הסורי נצפה לאחרונה בגליל בשנות ה-1910. יעל, צבי וזאב עדיין חיים בישראל.\",\"topic\":\"flora-fauna\"},{\"id\":150,\"question\":\"היכן הושב היחמור הפרסי לטבע בישראל?\",\"category\":\"יונקים\",\"answers\":[{\"text\":\"בנחל כזיב ובהרי ירושלים\",\"correct\":true},{\"text\":\"ברמת הגולן ובחרמון\",\"correct\":false},{\"text\":\"במדבר יהודה ובעין גדי\",\"correct\":false},{\"text\":\"בהר הנגב ובערבה\",\"correct\":false}],\"explanation\":\"פרויקט ההשבה של חי-בר כרמל החל ב-1996; היחמור נכחד מהארץ בראשית המאה ה-20.\",\"topic\":\"geography\"},{\"id\":151,\"question\":\"היכן נפוץ במיוחד היעל הנובי בישראל?\",\"category\":\"יונקים\",\"answers\":[{\"text\":\"בעין גדי ולאורך מצוק ההעתקים\",\"correct\":true},{\"text\":\"ביערות הכרמל\",\"correct\":false},{\"text\":\"ברמות מנשה\",\"correct\":false},{\"text\":\"בגליל העליון\",\"correct\":false}],\"explanation\":\"היעל קשור למצוקים תלולים המשמשים לו מפלט מטורפים; אוכלוסייה נוספת בנגב ובאילת.\",\"topic\":\"flora-fauna\"},{\"id\":152,\"question\":\"מה תפקידה של },{\"id\":156,\"question\":\"היכן מתרכזים בחורף אלפי עגורים אפורים?\",\"category\":\"נדידה\",\"answers\":[{\"text\":\"באגמון החולה\",\"correct\":true},{\"text\":\"בשמורת החולה\",\"correct\":false},{\"text\":\"במאגר בית נטופה\",\"correct\":false},{\"text\":\"בבריכות המלח באילת\",\"correct\":false}],\"explanation\":\"האגמון הוא שטח הצפה חקלאי שנוצר בשנות ה-90; ה\\\"הסדר\\\" של האכלת העגורים בשדה מונע נזק לחקלאות.\",\"topic\":\"water-climate\"},{\"id\":157,\"question\":\"ממה ניזון הנשר המקראי, הדורס הגדול בישראל?\",\"category\":\"ציפורים\",\"answers\":[{\"text\":\"מפגרי בעלי חיים\",\"correct\":true},{\"text\":\"מדגים שהוא צד במים רדודים\",\"correct\":false},{\"text\":\"ממכרסמים חיים שהוא צד בשדות\",\"correct\":false},{\"text\":\"מזוחלים וחרקים גדולים\",\"correct\":false}],\"explanation\":\"הנשר הוא אוכל נבלות (grifon vulture) ואינו טורף. בעברית המקראית \\\"נשר\\\" הוא בדיוק העוף הזה.\",\"topic\":\"flora-fauna\"},{\"id\":158,\"question\":\"שמורת גמלא ידועה בין השאר בזכות:\",\"category\":\"ציפורים\",\"answers\":[{\"text\":\"מושבת נשרים מקננת\",\"correct\":true},{\"text\":\"מושבת פלמינגו\",\"correct\":false},{\"text\":\"יער אלון תבור\",\"correct\":false},{\"text\":\"עדר יחמורים שהושב לטבע\",\"correct\":false}],\"explanation\":\"מצוקי גמלא הם אתר קינון ותצפית מרכזי לנשרים בישראל.\",\"topic\":\"flora-fauna\"},{\"id\":159,\"question\":\"מהי הציפור שנבחרה כציפור הלאומית של ישראל?\",\"category\":\"ציפורים\",\"answers\":[{\"text\":\"דוכיפת\",\"correct\":true},{\"text\":\"נשר מקראי\",\"correct\":false},{\"text\":\"תנשמת\",\"correct\":false},{\"text\":\"בולבול\",\"correct\":false}],\"explanation\":\"נבחרה בהצבעת הציבור ב-2008, לציון שישים שנה למדינה.\",\"topic\":\"flora-fauna\"},{\"id\":160,\"question\":\"מהו הפרח שנבחר כפרח הלאומי של ישראל?\",\"category\":\"צמחים ובתי גידול\",\"answers\":[{\"text\":\"רקפת מצויה\",\"correct\":true},{\"text\":\"כלנית מצויה\",\"correct\":false},{\"text\":\"נורית אסיה\",\"correct\":false},{\"text\":\"חצב מצוי\",\"correct\":false}],\"explanation\":\"
