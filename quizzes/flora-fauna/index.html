:false}],\"explanation\":\"אלוני אבא ואלוני יצחק שבגליל התחתון הם שריד ליער הפארק; רוב עצי אלון תבור נכרתו בתקופה העות'מאנית.\",\"topic\":\"geography\"},{\"id\":138,\"question\":\"מהו ההבדל העיקרי בין אלון מצוי לאלון תבור?\",\"category\":\"צמחים ובתי גידול\",\"answers\":[{\"text\":\"אלון מצוי ירוק-עד ואלון תבור נשיר\",\"correct\":true},{\"text\":\"אלון מצוי נשיר ואלון תבור ירוק-עד\",\"correct\":false},{\"text\":\"שניהם ירוקי-עד ונבדלים בגובהם בלבד\",\"correct\":false},{\"text\":\"שניהם נשירים ונבדלים בצורת הבלוט\",\"correct\":false}],\"explanation\":\"אלון תבור משיל את עליו בקיץ — התאמה לבית גידול חם ופתוח יותר מן החורש.\",\"topic\":\"flora-fauna\"},{\"id\":139,\"question\":\"מה מבדיל בין גריגה לחורש?\",\"category\":\"צמחים ובתי גידול\",\"answers\":[{\"text\":\"בגריגה שיחים נמוכים ופתוחים, בחורש עצים גבוהים וצפופים\",\"correct\":true},{\"text\":\"הגריגה מדברית והחורש ים-תיכוני\",\"correct\":false},{\"text\":\"הגריגה נטועה בידי אדם והחורש טבעי\",\"correct\":false},{\"text\":\"בגריגה שולטים מחטניים ובחורש רחבי-עלים\",\"correct\":false}],\"explanation\":\"רצף ההידרדרות: יער ← חורש ← גריגה ← בתה, לפי גובה הצומח וצפיפותו; רעייה, כריתה ושריפות מקדמות אותו.\",\"topic\":\"flora-fauna\"},{\"id\":140,\"question\":\"צמחייה ממוצא סודני מופיעה בישראל בעיקר:\",\"category\":\"צמחים ובתי גידול\",\"answers\":[{\"text\":\"לאורך הבקע ובעמק הירדן הדרומי\",\"correct\":true},{\"text\":\"בגליל העליון ובחרמון\",\"correct\":false},{\"text\":\"ברמות מנשה ובכרמל\",\"correct\":false},{\"text\":\"במישור החוף הצפוני\",\"correct\":false}],\"explanation\":\"שיטים, זקום ודום מצרי הם מינים טרופיים שמצאו מקלט בחום של הבקע — \\\"אצבע\\\" סודנית בתוך ארץ ים-תיכונית.\",\"topic\":\"geography\"},{\"id\":141,\"question\":\"היכן גדל בישראל עץ הדום המצרי?\",\"category\":\"צמחים ובתי גידול\",\"answers\":[{\"text\":\"באזור אילת והערבה הדרומית\",\"correct\":true},{\"text\":\"בכרמל ובגליל המערבי\",\"correct\":false},{\"text\":\"בעמק יזרעאל\",\"correct\":false},{\"text\":\"בהרי ירושלים\",\"correct\":false}],\"explanation\":\"הדום הוא דקל אפריקני מסועף; בישראל הוא בקצה הצפוני של תפוצתו, ומוגן.\",\"topic\":\"geography\"},{\"id\":142,\"question\":\"מהו הצמח שממנו מכינים את תערובת התבלין \\\"זעתר\\\"?\",\"category\":\"צמחים ובתי גידול\",\"answers\":[{\"text\":\"אזוב מצוי\",\"correct\":true},{\"text\":\"מרווה משולשת\",\"correct\":false},{\"text\":\"לוטם שעיר\",\"correct\":false},{\"text\":\"סירה קוצנית\",\"correct\":false}],\"explanation\":\"אזוב מצוי הוא ערך טבע מוגן, וקטיפתו בטבע אסורה — הוא מגודל היום בחקלאות.\",\"topic\":\"flora-fauna\"},{\"id\":143,\"question\":\"מה משותף לאזוב מצוי, לעכובית הגלגל ולקורנית מקורקפת?\",\"category\":\"צמחים ובתי גידול\",\"answers\":[{\"text\":\"שלושתם ערכי טבע מוגנים שאסור לקטוף בטבע\",\"correct\":true},{\"text\":\"שלושתם מינים פולשים שהובאו לישראל\",\"correct\":false},{\"text\":\"שלושתם אנדמיים לישראל בלבד\",\"correct\":false},{\"text\":\"שלושתם צמחי מדבר הגדלים רק בנגב\",\"correct\":false}],\"explanation\":\"הכרזתם כערכי טבע מוגנים באה בעקבות קטיף מסחרי שסיכן את אוכלוסיותיהם.\",\"topic\":\"flora-fauna\"},{\"id\":144,\"question\":\"מתי פורח החצב המצוי?\",\"category\":\"צמחים ובתי גידול\",\"answers\":[{\"text\":\"בסוף הקיץ, לפני הגשמים הראשונים\",\"correct\":true},{\"text\":\"באמצע החורף, אחרי הגשמים\",\"correct\":false},{\"text\":\"באביב, יחד עם הכלניות\",\"correct\":false},{\"text\":\"בסתיו המאוחר, אחרי היורה\",\"correct\":false}],\"explanation\":\"החצב פורח מהבצל על יבש, ורק אחר כך מוציא עלים — ולכן שימש סמן גבולות שדות בסוף הקיץ.\",\"topic\":\"flora-fauna\"},{\"id\":145,\"question\":\"\\\"דרום אדום\\\" — פריחת החורף בעוטף עזה — מבוססת בעיקר על:\",\"category\":\"צמחים ובתי גידול\",\"answers\":[{\"text\":\"כלנית מצויה\",\"correct\":true},{\"text\":\"נורית אסיה\",\"correct\":false},{\"text\":\"פרג נסתר\",\"correct\":false},{\"text\":\"דם המכבים האדום\",\"correct\":false}],\"explanation\":\"הכלנית פורחת בשיא החורף; הנורית והפרג פורחים אחריה באביב, ודם המכבים הוא מין אנדמי ונדיר.\",\"topic\":\"flora-fauna\"},{\"id\":146,\"question\":\"מה מייחד את דם המכבים האדום?\",\"category\":\"מינים: אנדמי, פולש, נכחד\",\"answers\":[{\"text\":\"הוא מין אנדמי הגדל בישראל בלבד\",\"correct\":true},{\"text\":\"הוא מין פולש שהגיע מאירופה\",\"correct\":false},{\"text\":\"הוא מין מדברי הגדל רק בערבה\",\"correct\":false},{\"text\":\"הוא מין שנכחד מן הטבע והושב אליו\",\"correct\":false}],\"explanation\":\"אנדמי = תפוצתו העולמית מוגבלת לאזור אחד. דוגמאות נוספות: אירוס הגלבוע ואזובית החרמון.\",\"topic\":\"second-temple\"},{\"id\":147,\"question\":\"מהי ההגדרה של מין פולש?\",\"category\":\"מינים: אנדמי, פולש, נכחד\",\"answers\":[{\"text\":\"מין שהובא בידי אדם, התבסס והתפשט על חשבון מינים מקומיים\",\"correct\":true},{\"text\":\"מין שחדר בכוחות עצמו מארץ שכנה ואינו מזיק\",\"correct\":false},{\"text\":\"מין הגדל רק בשטחים מופרים ואינו מתרבה בטבע\",\"correct\":false},{\"text\":\"מין שנכחד מן הטבע והושב אליו בידי האדם\",\"correct\":false}],\"explanation\":\"שלושת התנאים הם הבאה בידי אדם, התבססות עצמאית ופגיעה במערכת המקומית — ולא עצם היותו זר.\",\"topic\":\"geography\"},{\"id\":148,\"question\":\"מי מבין הבאים הוא מין פולש שהתבסס בערי ישראל?\",\"category\":\"מינים: אנדמי, פולש, נכחד\",\"answers\":[{\"text\":\"מיינה מצויה\",\"correct\":true},{\"text\":\"דוכיפת\",\"correct\":false},{\"text\":\"בולבול\",\"correct\":false},{\"text\":\"זרזיר מצוי\",\"correct\":false}],\"explanation\":\"המיינה נמלטה מגני חיות בשנות ה-90 ומשתלטת על חללי קינון של מינים מקומיים.\",\"topic\":\"geography\"},{\"id\":149,\"question\":\"איזה מין נכחד מנופי ישראל בראשית המאה ה-20 ולא הושב לטבע?\",\"category\":\"מינים: אנדמי, פולש, נכחד\",\"answers\":[{\"text\":\"הדוב הסורי\",\"correct\":true},{\"text\":\"היעל הנובי\",\"correct\":false},{\"text\":\"הצבי הארץ-ישראלי\",\"correct\":false},{\"text\":\"הזאב המצוי\",\"correct\":false}],\"explanation\":\"הדוב הסורי נצפה לאחרונה בגליל בשנות ה-1910. יעל, צבי וזאב עדיין חיים בישראל.\",\"topic\":\"flora-fauna\"},{\"id\":150,\"question\":\"היכן הושב היחמור הפרסי לטבע בישראל?\",\"category\":\"יונקים\",\"answers\":[{\"text\":\"בנחל כזיב ובהרי ירושלים\",\"correct\":true},{\"text\":\"ברמת הגולן ובחרמון\",\"correct\":false},{\"text\":\"במדבר יהודה ובעין גדי\",\"correct\":false},{\"text\":\"בהר הנגב ובערבה\",\"correct\":false}],\"explanation\":\"פרויקט ההשבה של חי-בר כרמל החל ב-1996; היחמור נכחד מהארץ בראשית המאה ה-20.\",\"topic\":\"geography\"},{\"id\":151,\"question\":\"היכן נפוץ במיוחד היעל הנובי בישראל?\",\"category\":\"יונקים\",\"answers\":[{\"text\":\"בעין גדי ולאורך מצוק ההעתקים\",\"correct\":true},{\"text\":\"ביערות הכרמל\",\"correct\":false},{\"text\":\"ברמות מנשה\",\"correct\":false},{\"text\":\"בגליל העליון\",\"correct\":false}],\"explanation\":\"היעל קשור למצוקים תלולים המשמשים לו מפלט מטורפים; אוכלוסייה נוספת בנגב ובאילת.\",\"topic\":\"flora-fauna\"},{\"id\":152,\"question\":\"מה תפקידה של התנשמת בחקלאות הישראלית?\",\"category\":\"יונקים\",\"answers\":[{\"text\":\"הדברה ביולוגית של מכרסמים\",\"correct\":true},{\"text\":\"האבקת מטעים בלילה\",\"correct\":false},{\"text\":\"הפצת זרעים בשדות בור\",\"correct\":false},{\"text\":\"בקרה על אוכלוסיות חרקים מזיקים\",\"correct\":false}],\"explanation\":\"פרויקט תיבות הקינון לתנשמות ולבזים מצמצם שימוש בחומרי הדברה, ומופעל גם בשיתוף עם ירדן והרשות הפלסטינית.\",\"topic\":\"state\"},{\"id\":153,\"question\":\"מה נכון לגבי עטלפי הפירות בישראל?\",\"category\":\"יונקים\",\"answers\":[{\"text\":\"הם מוגנים בחוק, ובעבר נפגעו קשות מהרעלות במערות\",\"correct\":true},{\"text\":\"הם מין פולש שהגיע מאפריקה\",\"correct\":false},{\"text\":\"הם ניזונים מחרקים בלבד\",\"correct\":false},{\"text\":\"הם הוכרזו כמין שנכחד מן הטבע\",\"correct\":false}],\"explanation\":\"בשנות ה-50–60 הורעלו מערות כדי לפגוע בעטלפי הפירות, ונפגעו גם עטלפי החרקים המועילים.\",\"topic\":\"geography\"},{\"id\":154,\"question\":\"מדוע נדידת העופות בישראל כה מרשימה?\",\"category\":\"ציפורים\",\"answers\":[{\"text\":\"ישראל היא צוואר בקבוק יבשתי בין אירופה, אסיה ואפריקה\",\"correct\":true},{\"text\":\"ישראל היא יעד הנדידה הסופי של רוב העופות מאירופה\",\"correct\":false},{\"text\":\"העופות חוצ alse}],\"explanation\":\"מצוקי גמלא הם אתר קינון ותצפית מרכזי לנשרים בישראל.\",\"topic\":\"flora-fauna\"},{\"id\":159,\"question\":\"מהי הציפור שנבחרה כציפור הלאומית של ישראל?\",\"category\":\"ציפורים\",\"answers\":[{\"text\":\"דוכיפת\",\"correct\":true},{\"text\":\"נשר מקראי\",\"correct\":false},{\"text\":\"תנשמת\",\"correct\":false},{\"text\":\"בולבול\",\"correct\":false}],\"explanation\":\"נבחרה בהצבעת הציבור ב-2008, לציון שישים שנה למדינה.\",\"topic\":\"flora-fauna\"},{\"id\":160,\"question\":\"מהו הפרח שנבחר כפרח הלאומי של ישראל?\",\"category\":\"צמחים ובתי גידול\",\"answers\":[{\"text\":\"רקפת מצויה\",\"correct\":true},{\"text\":\"כלנית מצויה\",\"correct\":false},{\"text\":\"נורית אסיה\",\"correct\":false},{\"text\":\"חצב מצוי\",\"correct\":false}],\"explanation\":\"הרקפת ניצחה בהצבעת הציבור ב-2007; הכלנית הגיעה למקום השני.\",\"topic\":\"flora-fauna\"},{\"id\":161,\"question\":\"מה מבדיל בין הצפע הארץ-ישראלי לאפעה המגוון?\",\"category\":\"זוחלים\",\"answers\":[{\"text\":\"הצפע נפוץ בחבל הים-תיכוני והאפעה מדברי\",\"correct\":true},{\"text\":\"הצפע ארסי והאפעה אינו ארסי\",\"correct\":false},{\"text\":\"שניהם מדבריים, והצפע גדול בהרבה\",\"correct\":false},{\"text\":\"הצפע פעיל ביום והאפעה בלילה בלבד\",\"correct\":false}],\"explanation\":\"שניהם ארסיים ומסוכנים. הצפע אחראי לרוב ההכשות בישראל, והאפעה מצוי בנגב, בערבה ובמדבר יהודה.\",\"topic\":\"geography\"},{\"id\":162,\"question\":\"מה נכון לגבי עצי האקליפטוס בישראל?\",\"category\":\"צמחים ובתי גידול\",\"answers\":[{\"text\":\"הם הובאו מאוסטרליה ונטועים, ואינם צומח בר מקומי\",\"correct\":true},{\"text\":\"הם מין מקומי שגדל בעמקים מאז ומתמיד\",\"correct\":false},{\"text\":\"הם מין פולש שהתפשט בכוחות עצמו לכל הארץ\",\"correct\":false},{\"text\":\"הם מין אנדמי המוגן בחוק\",\"correct\":false}],\"explanation\":\"האקליפטוס הובא בסוף המאה ה-19, בין השאר מתוך אמונה שייבש ביצות; בפועל הניקוז הוא שייבש אותן.\",\"topic\":\"flora-fauna\"},{\"id\":163,\"question\":\"מה קובע חוק גנים לאומיים ושמורות טבע לגבי שמורת טבע?\",\"category\":\"מינים: אנדמי, פולש, נכחד\",\"answers\":[{\"text\":\"אסורה בה כל פגיעה בערכי הטבע — כולל צמח, בעל חיים ואבן\",\"correct\":true},{\"text\":\"מותר לקטוף בה פרחים שאינם מוגנים\",\"correct\":false},{\"text\":\"מותר לחנות בכל מקום, גם מחוץ לשבילים\",\"correct\":false},{\"text\":\"הכניסה אליה אסורה לציבור הרחב\",\"correct\":false}],\"explanation\":\"עיקרון \\\"קח רק תמונות, השאר רק עקבות\\\": בשמורה אסור לפגוע, לקטוף, לצוד או להוציא דבר.\",\"topic\":\"flora-fauna\"},{\"id\":164,\"question\":\"מהי מטרתו של חי-בר יטבתה?\",\"category\":\"יונקים\",\"answers\":[{\"text\":\"השבה לטבע של חיות מדבר שנכחדו מן הארץ\",\"correct\":true},{\"text\":\"שיקום עופות דורסים פצועים\",\"correct\":false},{\"text\":\"גידול דגי נוי מהים האדום\",\"correct\":false},{\"text\":\"שימור מיני צומח מדבריים בסכנה\",\"correct\":false}],\"explanation\":\"ביטבתה גודלו ראם לבן, פרא אסייתי, יעל ובקר הבר; מהם הושבו עדרים לערבה ולנגב.\",\"topic\":\"flora-fauna\"},{\"id\":165,\"question\":\"מהי הסיבה העיקרית לכך שהחורש הים-תיכוני בישראל נמוך וצפוף ולא יער גבוה?\",\"category\":\"צמחים ובתי גידול\",\"answers\":[{\"text\":\"כריתה, רעייה ושריפות לאורך אלפי שנים\",\"correct\":true},{\"text\":\"כמות משקעים נמוכה מכדי לקיים עצים גבוהים\",\"correct\":false},{\"text\":\"סוג הסלע בהרים אינו מאפשר עצים גבוהים\",\"correct\":false},{\"text\":\"התחרות עם עצי האורן הנטועים\",\"correct\":false}],\"explanation\":\"החורש הנוכחי הוא בעיקר חורש-משנה שהתחדש מגדמים; בישראל כמעט שלא נותרו יערות בתוליים.\",\"topic\":\"flora-fauna\"}]}}]\n21:I[27201,[\"/moreh-derech/_next/static/chunks/2uv3ff-pa-p5j.js\",\"/moreh-derech/_next/static/chunks/19enys_g5ttxz.js\",\"/moreh-derech/_next/static/chunks/1tp92mif6l80v.js\"],\"IconMark\"]\n1d:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n1b:null\n"])</script><script>self.__next_f.push([1,"1f:[[\"$\",\"title\",\"0\",{\"children\":\"אבן דרך למורי דרך\"}],[\"$\",\"meta\",\"1\",{\"name\":\"des
