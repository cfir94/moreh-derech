:\"איזו קביעה משקפת נכון את מועד פנטקוסט ביחס לתחייה?\",\"category\":\"ו. אתרים ומסורות לאחר התחייה\",\"answers\":[{\"text\":\"פנטקוסט חל 50 יום לאחר התחייה\",\"correct\":true},{\"text\":\"פנטקוסט חל 40 יום לאחר התחייה\",\"correct\":false},{\"text\":\"פנטקוסט חל ביום התחייה עצמו\",\"correct\":false},{\"text\":\"פנטקוסט חל בתום ימי הלנט\",\"correct\":false}],\"explanation\":\"פנטקוסט מצוין במקור כחל בדיוק 50 יום לאחר התחייה, כמסגרת \\\"יום הולדת הכנסייה\\\".\",\"source\":\"נצרות ג' — 7/8/26, איילת (ארבע הקלטות), יחידת פוסט־תחייה והתרחבות הכנסייה\"},{\"id\":120,\"question\":\"באיזו צורה מתוארת ירידת רוח הקודש על המאמינים בפנטקוסט?\",\"category\":\"ו. אתרים ומסורות לאחר התחייה\",\"answers\":[{\"text\":\"לשונות אש\",\"correct\":true},{\"text\":\"ענן\",\"correct\":false},{\"text\":\"איקונוסטזיס\",\"correct\":false},{\"text\":\"מטה רועים\",\"correct\":false}],\"explanation\":\"בהרצאה נאמר שרוח הקודש ירדה על המאמינים כלשונות אש.\",\"source\":\"נצרות ג' — 7/8/26, איילת (ארבע הקלטות), יחידת פוסט־תחייה והתרחבות הכנסייה\"},{\"id\":121,\"question\":\"בעקבות דרשת פטרוס ביום פנטקוסט, כמה אנשים נטבלו והצטרפו לפי החומר?\",\"category\":\"ו. אתרים ומסורות לאחר התחייה\",\"answers\":[{\"text\":\"כ־3,000 איש\",\"correct\":true},{\"text\":\"כ־120 אנשים\",\"correct\":false},{\"text\":\"כ־60 אנשים\",\"correct\":false},{\"text\":\"כ־160 אנשים\",\"correct\":false}],\"explanation\":\"המקור מציין הצטרפות וטבילה של כ־3,000 איש בעקבות דרשת פטרוס.\",\"source\":\"נצרות ג' — 7/8/26, איילת (ארבע הקלטות), יחידת פוסט־תחייה והתרחבות הכנסייה\"},{\"id\":122,\"question\":\"באיזו עיר נולד שאול התרסי (פאולוס) לפי החומר?\",\"category\":\"ו. אתרים ומסורות לאחר התחייה\",\"answers\":[{\"text\":\"טרסוס\",\"correct\":true},{\"text\":\"ירושלים\",\"correct\":false},{\"text\":\"רומא\",\"correct\":false},{\"text\":\"אנטיוכיה\",\"correct\":false}],\"explanation\":\"פאולוס מתואר כנולד בעיר המסחר טרסוס באסיה הקטנה.\",\"source\":\"נצרות ג' — 7/8/26, איילת (ארבע הקלטות), יחידת פוסט־תחייה והתרחבות הכנסייה\"},{\"id\":123,\"question\":\"באיזה כינוי הגדיר פאולוס את שליחותו כלפי העמים שאינם יהודים?\",\"category\":\"ו. אתרים ומסורות לאחר התחייה\",\"answers\":[{\"text\":\"השליח לגויים\",\"correct\":true},{\"text\":\"השליחה לשליחים\",\"correct\":false},{\"text\":\"פטריארך ירושלים\",\"correct\":false},{\"text\":\"קרדינל\",\"correct\":false}],\"explanation\":\"פאולוס כינה עצמו \\\"השליח לגויים\\\", לאחר שהפנייה לגויים הפכה למפעל חייו.\",\"source\":\"נצרות ג' — 7/8/26, איילת (ארבע הקלטות), יחידת פוסט־תחייה והתרחבות הכנסייה\"},{\"id\":124,\"question\":\"כיצד מכונה אצל פאולוס העידן שהחל עם מות ישוע על הצלב?\",\"category\":\"ו. אתרים ומסורות לאחר התחייה\",\"answers\":[{\"text\":\"עידן החסד\",\"correct\":true},{\"text\":\"עידן החוק\",\"correct\":false},{\"text\":\"הלנט\",\"correct\":false},{\"text\":\"הביאה השנייה\",\"correct\":false}],\"explanation\":\"המקור מציג את 'עידן החסד' כעידן שהחל עם מותו של ישוע על הצלב, בניגוד ל'עידן החוק'.\",\"source\":\"נצרות ג' — 7/8/26, איילת (ארבע הקלטות), יחידת פוסט־תחייה והתרחבות הכנסייה\"},{\"id\":125,\"question\":\"מאילו מצוות מעשיות פטר פאולוס את הגויים המצטרפים, לפי ההרצאה?\",\"category\":\"ו. אתרים ומסורות לאחר התחייה\",\"answers\":[{\"text\":\"ברית מילה, כשרות ושמירת שבת\",\"correct\":true},{\"text\":\"וידוי, ויה דולורוזה ונגינת עוגב\",\"correct\":false},{\"text\":\"נדרי עוני, פרישות וצייתנות\",\"correct\":false},{\"text\":\"טבילה ואוכריסטיה בלבד\",\"correct\":false}],\"explanation\":\"לפי המקור, הגויים הפטורים ממצוות הבשר — ברית מילה, כשרות ושבת — נדרשים ל'מילת הלב' ואמונה.\",\"source\":\"נצרות ג' — 7/8/26, איילת (ארבע הקלטות), יחידת פוסט־תחייה והתרחבות הכנסייה\"},{\"id\":126,\"question\":\"מי הוצג כמנהיג הראשון של קהילת ירושלים (ה'בישוף' בדיעבד) לפי החומר?\",\"category\":\"ו. אתרים ומסורות לאחר התחייה\",\"answers\":[{\"text\":\"יעקב אחי ישוע\",\"correct\":true},{\"text\":\"פטרוס\",\"correct\":false},{\"text\":\"הפטריארך הלטיני של ירושלים\",\"correct\":false},{\"text\":\"הפטריארך היווני־אורתודוקסי של ירושלים\",\"correct\":false}],\"explanation\":\"בהרצאה צוין שמנהיג קהילת ירושלים הראשון היה יעקב \\\"אחי ישוע\\\", ולא פטרוס.\",\"source\":\"נצרות ג' — 7/8/26, איילת (ארבע הקלטות), יחידת פוסט־תחייה והתרחבות הכנסייה\"},{\"id\":127,\"question\":\"איזה רצף מציג נכון את תחנות הילדות המוקדמות לפי הסיפור והמסורת שנלמדו?\",\"category\":\"ז. חיבורים למורה הדרך\",\"answers\":[{\"text\":\"בשורה בנצרת → ביקור אצל אלישבע → לידה בבית לחם → בריחה למצרים\",\"correct\":true},{\"text\":\"לידה בבית לחם → בשורה בנצרת → טבילה בירדן → ביקור אצל אלישבע\",\"correct\":false},{\"text\":\"ביקור אצל אלישבע → בריחה למצרים → לידה בבית לחם → בשורה בנצרת\",\"correct\":false},{\"text\":\"בשורה בנצרת → לידה בבית לחם → טבילה בירדן → הצגה במקדש\",\"correct\":false}],\"explanation\":\"הבשורה למרים קודמת לביקור אצל אלישבע; לאחר מכן באים הלידה בבית לחם והבריחה למצרים בעקבות איום הורדוס. הסדר מחבר בין ארבע תחנות הדרכה.\",\"source\":\"מפגש החזרה למבחן — רצף חייו של ישוע\"},{\"id\":128,\"question\":\"היכן מציינת המסורת את ביקור מרים אצל אלישבע?\",\"category\":\"ז. חיבורים למורה הדרך\",\"answers\":[{\"text\":\"עין כרם\",\"correct\":true},{\"text\":\"כפר כנא\",\"correct\":false},{\"text\":\"בית עניה\",\"correct\":false},{\"text\":\"בית פגי\",\"correct\":false}],\"explanation\":\"הבשורה אינה נוקבת בשם עין כרם אלא מתארת יישוב בהרי יהודה; עין כרם היא הזיהוי המסורתי. זהו הבדל שמורה דרך צריך לציין.\",\"source\":\"מפגש החזרה למבחן — הביקור ומסורת עין כרם\"},{\"id\":129,\"question\":\"איזו התאמה בין אירוע למקום נכונה?\",\"category\":\"ז. חיבורים למורה הדרך\",\"answers\":[{\"text\":\"הצהרת פטרוס — קיסריה פיליפי; ההשתנות — הר גבוה המזוהה במסורת עם תבור\",\"correct\":true},{\"text\":\"הצהרת פטרוס — הר תבור; ההשתנות — קיסריה פיליפי\",\"correct\":false},{\"text\":\"הצהרת פטרוס וההשתנות — שתיהן התרחשו לאחר התחייה בירושלים\",\"correct\":false},{\"text\":\"הצהרת פטרוס — כפר כנא; ההשתנות — בית לחם\",\"correct\":false}],\"explanation\":\"הצהרת פטרוס קודמת להליכת ישוע אל ההר שבו אירעה ההשתנות. המסורת מזהה את הר ההשתנות עם תבור, בעוד שהטקסט אינו נוקב בשם ההר.\",\"source\":\"נצרות ב ומפגש החזרה — קיסריה פיליפי וההשתנות\"},{\"id\":130,\"question\":\"מהי המשמעות ההיסטורית־דתית של חג הפנטקוסט מעבר לתיאור לשונות האש?\",\"category\":\"ז. חיבורים למורה הדרך\",\"answers\":[{\"text\":\"ראשית השליחות הציבורית של הכנסייה לקהלים דוברי לשונות שונות\",\"correct\":true},{\"text\":\"סיום פעילות השליחים וחזרתם לחיים פרטיים בגליל\",\"correct\":false},{\"text\":\"הקמת הפנטארכיה וחלוקת העולם לחמש פטריארכיות\",\"correct\":false},{\"text\":\"הכרזה על שבעת הסקרמנטים בוועידת כלקדון\",\"correct\":false}],\"explanation\":\"רוח הקודש, הדיבור בלשונות ודרשת פטרוס הופכים את פנטקוסט לנקודת פתיחה סמלית של הכנסייה המיסיונרית, לא רק לנס בפני עצמו.\",\"source\":\"מפגש החזרה למבחן — פנטקוסט והתפשטות הנצרות\"},{\"id\":131,\"question\":\"פטרוס רואה ביפו יריעה ובה בעלי חיים ושומע שלא לטמא את מה שאלוהים טיהר. איזו התפתחות מכין החזון?\",\"category\":\"ז. חיבורים למורה הדרך\",\"answers\":[{\"text\":\"קבלת גויים לקהילה בלי לראות בהם טמאים\",\"correct\":true},{\"text\":\"חזרה לחובת שמירת הכשרות המלאה לכל המצטרפים\",\"correct\":false},{\"text\":\"העברת מרכז הכנסייה מבית לחם לנצרת\",\"correct\":false},{\"text\":\"קביעת שבעת הסקרמנטים לכל העדות\",\"correct\":false}],\"explanation\":\"החזון ביפו מכין את פטרוס למפגש עם קורנליוס הגוי. במעשי השליחים פטרוס עצמו מסביר שאלוהים הראה לו שלא לכנות אדם טמא; במסורת הנוצרית נקשר האירוע גם להקלה במגבלות האכילה.\",\"source\":\"מפגש החזרה למבחן — פטרוס ביפו ומעשי השליחים\"},{\"id\":132,\"question\":\"כיצד מחבר סיפור קורנליוס בין קיסריה ליפו?\",\"category\":\"ז. חיבורים למורה הדרך\",\"answers\":[{\"text\":\"הקצין הרומי מקיסריה שולח לקרוא לפטרוס השוהה ביפו\",\"correct\":true},{\"text\":\"פטרוס מקיסריה שולח את פאולוס להיטבל ביפו\",\"correct\":false},{\"text\":\"קורנליוס בורח מיפו ומקים מנזר בקיסריה\",\"correct\":false},{\"text\":\"יוחנן המטביל יוצא מקיסריה כדי להטביל את פטרוס ביפו\",\"correct\":false}],\"explanation\":\"הסיפור נע בין בית שמעון הבורסקאי ביפו לבית קורנליוס בקיסריה, ומחבר שני אתרי הדרכה לסוגיית קבלת הגויים.\",\"source\":\"מפגש החזרה למבחן — פטרוס, קורנליוס וקיסריה\"},{\"id\":133,\"question\":\"באיזה אטריבוט מזהים בדרך כלל את פטרוס באמנות נוצרית?\",\"category\":\"ז. חיבורים למורה הדרך\",\"answers\":[{\"text\":\"מפתחות מלכות השמיים\",\"correct\":true},{\"text\":\"חרב וספר איגרות\",\"correct\":false},{\"text\":\"גלגל שבור\",\"correct\":false},{\"text\":\"קונכיית עולה רגל\",\"correct\":false}],\"explanation\":\"המפתחות מפנים לדברי ישוע לפטרוס על מפתחות מלכות השמיים. זהו אטריבוט זיהוי שימושי בכנסיות וביצירות אמנות.\",\"source\":\"מפגש החזרה למבחן — פטרוס והאטריבוטים שלו\"},{\"id\":134,\"question\":\"איזה צירוף קושר נכון בין פטרוס, רומא והמסורת על מותו?\",\"category\":\"ז. חיבורים למורה הדרך\",\"answers\":[{\"text\":\"פטרוס פעל ברומא ולפי המסורת נצלב שם במהופך\",\"correct\":true},{\"text\":\"פטרוס פעל באלכסנדריה ולפי המסורת נערף שם\",\"correct\":false},{\"text\":\"פטרוס נשאר בירושלים ולפי המסורת מת במנזר\",\"correct\":false},{\"text\":\"פטרוס פעל באנטיוכיה ולפי המסורת טבע בים\",\"correct\":false}],\"explanation\":\"המסורת קושרת את פטרוס לרומא, לראשית סמכות האפיפיורות ולצליבה במהופך — סימן זיהוי נוסף שלו באמנות.\",\"source\":\"מפגש החזרה למבחן — פטרוס ורומא\"},{\"id\":135,\"question\":\"מה ההבדל המרכזי בין מקומם של פטרוס ופאולוס בהתפשטות הנצרות?\",\"category\":\"ז. חיבורים למורה הדרך\",\"answers\":[{\"text\":\"פטרוס היה מתלמידי ישוע; פאולוס הצטרף אחר כך ועיצב שליחות ותאולוגיה לגויים\",\"correct\":true},{\"text\":\"פאולוס היה מן השנים־עשר; פטרוס הצטרף רק לאחר פנטקוסט\",\"correct\":false},{\"text\":\"שניהם כתבו בשורות סינופטיות והגבילו את השליחות ליהודים\",\"correct\":false},{\"text\":\"שניהם היו כמרים קתולים שמונו בידי בישוף רומא\",\"correct\":false}],\"explanation\":\"פטרוס שייך לגרעין התלמידים הראשון; פאולוס אינו מתלמידי ישוע בחייו, אך היה מכריע בהפצת האמונה ובעיצובה עבור קהילות לא־יהודיות.\",\"source\":\"מפגש החזרה למבחן — פטרוס ופאולוס\"},{\"id\":136,\"question\":\"איזו התאמה בין דמות, אתר ורעיון נכונה?\",\"category\":\"ז. חיבורים למורה הדרך\",\"answers\":[{\"text\":\"פטרוס — יפו — פתיחת הדרך לקבלת גויים\",\"correct\":true},{\"text\":\"פאולוס — כפר כנא — הפיכת מים ליין\",\"correct\":false},{\"text\":\"קורנליוס — הר תבור — ההשתנות\",\"correct\":false},{\"text\":\"יוחנן המטביל — בית עניה — הקמת קהילת ירושלים\",\"correct\":false}],\"explanation\":\"החזון של פטרוס ביפו ומפגשו עם קורנליוס הם חוליה מרכזית במעבר מתנועה יהודית לשליחות הפונה גם לגויים.\",\"source\":\"מפגש החזרה למבחן — דמויות ואתרים בהתפשטות הנצרות\"},{\"id\":137,\"question\":\"מה שמה של המחיצה הנושאת איקונות ומפרידה בין אזור הקהל למזבח בכנסייה אורתודוקסית?\",\"category\":\"ז. חיבורים למורה הדרך\",\"answers\":[{\"text\":\"איקונוסטזיס\",\"correct\":true},{\"text\":\"קתדרה\",\"correct\":false},{\"text\":\"טרנספט\",\"correct\":false},{\"text\":\"בפטיסטריום\",\"correct\":false}],\"explanation\":\"האיקונוסטזיס הוא מחיצה ליטורגית נושאת איקונות. הוא גם מסמן גבול במרחב הכנסייה וגם מציג דמויות וסצנות קדושות.\",\"source\":\"נצרות ב ומפגש החזרה — זיהוי כנסייה אורתודוקסית\"},{\"id\":138,\"question\":\"איזה סימן חזותי מסייע להבחין בדרך כלל בין כנסייה קתולית לאורתודוקסית?\",\"category\":\"ז. חיבורים למורה הדרך\",\"answers\":[{\"text\":\"בקתולית שכיחים פסלים תלת־ממדיים; באורתודוקסית מודגשות איקונות ומחיצת איקונוסטזיס\",\"correct\":true},{\"text\":\"בקתולית אין דימויים כלל; באורתודוקסית יש רק פסלים תלת־ממדיים\",\"correct\":false},{\"text\":\"בקתולית המזבח תמיד נסתר במחיצה; באורתודוקסית הוא תמיד פתוח לקהל\",\"correct\":false},{\"text\":\"אין כל הבדל חזותי או ליטורגי שניתן להסביר למבקרים\",\"correct\":false}],\"explanation\":\"זו הבחנת שטח שימושית אך לא כלל מוחלט: במסורת האורתודוקסית האיקונה והאיקונוסטזיס מרכזיים, ואילו בכנסיות קתוליות נפוץ יותר פיסול תלת־ממדי.\",\"source\":\"מפגש החזרה למבחן — קתולים ואורתודוקסים בשטח\"},{\"id\":139,\"question\":\"איזה רצף כרונולוגי מציג נכון שלוש נקודות מפנה בפיצול העולם הנוצרי?\",\"category\":\"ז. חיבורים למורה הדרך\",\"answers\":[{\"text\":\"כלקדון במאה ה־5 → הקרע בין מזרח למערב ב־1054 → הרפורמציה במאה ה־16\",\"correct\":true},{\"text\":\"הרפורמציה במאה ה־5 → כלקדון ב־1054 → הקרע הגדול במאה ה־16\",\"correct\":false},{\"text\":\"הקרע הגדול במאה ה־4 → ועידת ותיקן 2 → כלקדון במאה ה־20\",\"correct\":false},{\"text\":\"כלקדון והרפורמציה התרחשו יחד; הקרע הגדול קדם לשתיהן\",\"correct\":false}],\"explanation\":\"הסדר מסביר שלוש משפחות שונות של פיצולים: הכנסיות האוריינטליות לאחר כלקדון, קתולים מול אורתודוקסים ב־1054, ופרוטסטנטים מן המאה ה־16.\",\"source\":\"נצרות ג — ועידות, קרעים וזרמים\"},{\"id\":140,\"question\":\"איזו מפת תוכן של הברית החדשה נכונה?\",\"category\":\"ז. חיבורים למורה הדרך\",\"answers\":[{\"text\":\"בשורות — חיי ישוע; מעשי השליחים — התפשטות; איגרות — הוראה לקהילות; התגלות — אחרית הימים\",\"correct\":true},{\"text\":\"בשורות — אחרית הימים; מעשי השליחים — ילדות ישוע; איגרות — חיי משה; התגלות — היררכיה כנסייתית\",\"correct\":false},{\"text\":\"בשורות — חוקי הכנסייה; מעשי השליחים — בריאת העולם; איגרות — חיי ישוע; התגלות — מסעות פאולוס\",\"correct\":false},{\"text\":\"כל ארבע הקבוצות מתארות אותו פרק בחיי ישוע מזוויות שונות\",\"correct\":false}],\"explanation\":\"המיפוי מסביר גם את סדר החלקים: סיפור ישוע, התפתחות הקהילה, עיצוב אמונה וחיי קהילות, ולבסוף חזון אחרית הימים.\",\"source\":\"נצרות א — מבנה ספרי הברית החדשה\"},{\"id\":141,\"question\":\"מבקר שואל מדוע סדר ספרי הברית הישנה בכנסייה שונה מסדר התנ״ך היהודי. מהי התשובה המקצועית?\",\"category\":\"ז. חיבורים למורה הדרך\",\"answers\":[{\"text\":\"הסידור הנוצרי יוצר רצף פרשני המוביל מן הנביאים אל בשורות ישוע\",\"correct\":true},{\"text\":\"הכנסיות אינן מכירות בתורה ולכן הן פותחות בנביאים\",\"correct\":false},{\"text\":\"הסדר נקבע לפי אורך הספרים בלבד ללא משמעות פרשנית\",\"correct\":false},{\"text\":\"אין הבדל בין הסדר הנוצרי לבין תורה–נביאים–כתובים\",\"correct\":false}],\"explanation\":\"הברית הישנה הנוצרית מסודרת כך שהנביאים ניצבים סמוך לברית החדשה; הסיום במלאכי מדגיש את הציפייה לאליהו ואת החיבור ליוחנן המטביל.\",\"source\":\"מפגש החזרה למבחן — סדר הספרים בברית הישנה\"},{\"id\":142,\"question\":\"איזה ניסוח נכון ביחס לספרים הדויטרוקאנוניים?\",\"category\":\"ז. חיבורים למורה הדרך\",\"answers\":[{\"text\":\"הם חלק מן הברית הישנה הקתולית, בעוד שהקאנון הפרוטסטנטי אינו כולל אותם באותו מעמד\",\"correct\":true},{\"text\":\"הם ארבע הבשורות הסינופטיות שנוספו לאחר ועידת ותיקן 2\",\"correct\":false},{\"text\":\"הם ספרים המקובלים רק ביהדות ואינם מוכרים בשום כנסייה\",\"correct\":false},{\"text\":\"הם שמו האחר של ספר מעשי השליחים והאיגרות\",\"correct\":false}],\"explanation\":\"המונח דויטרוקאנוניים משמש במסורת הקתולית לספרים שאינם בקאנון הפרוטסטנטי. במסורות אורתודוקסיות קיימים היקפים משלהן, ולכן אין לדבר על קאנון נוצרי אחיד לגמרי.\",\"source\":\"מפגש החזרה למבחן — הבדלים בקאנון\"},{\"id\":143,\"question\":\"איזה אתר בהר ציון מקושר הן לסעודה האחרונה והן להתכנסות בפנטקוסט?\",\"category\":\"ז. חיבורים למורה הדרך\",\"answers\":[{\"text\":\"חדר הסעודה האחרונה\",\"correct\":true},{\"text\":\"כנסיית הקבר\",\"correct\":false},{\"text\":\"כנסיית כל העמים\",\"correct\":false},{\"text\":\"כנסיית פטרוס אין גליקנטו\",\"correct\":false}],\"explanation\":\"אותו מרחב מסורתי בהר ציון מקשר שני אירועים שונים: הסעודה האחרונה לפני הצליבה והתכנסות התלמידים עם ירידת רוח הקודש בפנטקוסט.\",\"source\":\"מפגש החזרה למבחן — הר ציון ופנטקוסט\"},{\"id\":144,\"question\":\"איזה רצף של השבוע הקדוש נכון?\",\"category\":\"ז. חיבורים למורה הדרך\",\"answers\":[{\"text\":\"כניסה מבית פגי → סעודה אחרונה → גת שמנים → מעצר ומשפט → צליבה\",\"correct\":true},{\"text\":\"גת שמנים → כניסה מבית פגי → צליבה → סעודה אחרונה → משפט\",\"correct\":false},{\"text\":\"סעודה אחרונה → טבילה בירדן → כניסה מבית פגי → צליבה → פנטקוסט\",\"correct\":false},{\"text\":\"כניסה מבית פגי → צליבה → גת שמנים → סעודה אחרונה → מעצר\",\"correct\":false}],\"explanation\":\"הרצף מחבר את יום ראשון של הדקלים, יום חמישי הקדוש והלילה בגת שמנים אל המשפט והצליבה ביום שישי.\",\"source\":\"נצרות ב ומפגש החזרה — השבוע הקדוש בירושלים\"},{\"id\":145,\"question\":\"איזה צירוף מבדיל נכון בין שני אירועים בבית עניה?\",\"category\":\"ז. חיבורים למורה הדרך\",\"answers\":[{\"text\":\"אחיית אלעזר ומשיחת ישוע בידי מרים לקראת קבורתו\",\"correct\":true},{\"text\":\"טבילת ישוע והדרשה על ההר\",\"correct\":false},{\"text\":\"הצהרת פטרוס וההשתנות\",\"correct\":false},{\"text\":\"פנטקוסט וחזון פטרוס על בעלי החיים\",\"correct\":false}],\"explanation\":\"בית עניה מקושרת גם לאחיית אלעזר וגם למשיחת ישוע בידי מרים אחותו. השילוב מסביר את חשיבות המקום ערב הכניסה לירושלים.\",\"source\":\"נצרות ב — בית עניה והשבוע הקדוש\"},{\"id\":146,\"question\":\"איזו הבחנה בין שני אירועים הקשורים לפטרוס נכונה?\",\"category\":\"ז. חיבורים למורה הדרך\",\"answers\":[{\"text\":\"בקיסריה פיליפי הוא מצהיר שישוע הוא המשיח; בטבחה שלאחר התחייה הוא מקבל אחריות לרעות את הצאן\",\"correct\":true},{\"text\":\"בטבחה הוא מצהיר לראשונה שישוע הוא המשיח; בקיסריה פיליפי הוא פוגש את ישוע לאחר התחייה\",\"correct\":false},{\"text\":\"שני האירועים מתרחשים בחדר הסעודה האחרונה בפנטקוסט\",\"correct\":false},{\"text\":\"שני האירועים מתרחשים לפני טבילת ישוע בירדן\",\"correct\":false}],\"explanation\":\"הצהרת האמונה והענקת המפתחות שייכות לקיסריה פיליפי לפני הפסיון; השיחה 'רעה את צאני' שייכת להתגלות שלאחר התחייה על שפת הכנרת.\",\"source\":\"נצרות ב–ג — פטרוס לפני הצליבה ולאחר התחייה\"},{\"id\":147,\"question\":\"מדוע קיימים כמה אתרים המתחרים על הזיהוי של אמאוס?\",\"category\":\"ז. חיבורים למורה הדרך\",\"answers\":[{\"text\":\"כתבי יד שונים מוסרים מרחקים שונים מירושלים, ולכן מוצעים זיהויים גאוגרפיים שונים\",\"correct\":true},{\"text\":\"כל אחת מארבע הבשורות מציבה את אמאוס בארץ אחרת\",\"correct\":false},{\"text\":\"השם אמאוס מופיע רק במסורת מאוחרת ואינו נזכר בברית החדשה\",\"correct\":false},{\"text\":\"הוויכוח נובע רק מהבדל בין לוח השנה הקתולי לאורתודוקסי\",\"correct\":false}],\"explanation\":\"המסורות של 60 ושל 160 סטדיות משפיעות על ההתאמה בין הטקסט למרחק מן העיר, ומסבירות את ריבוי הזיהויים בארץ.\",\"source\":\"נצרות ג — אמאוס, כתבי יד ומסורות זיהוי\"},{\"id\":148,\"question\":\"איזה רצף זמן לאחר התחייה נכון לפי המסורת הנלמדת?\",\"category\":\"ז. חיבורים למורה הדרך\",\"answers\":[{\"text\":\"התגלויות לתלמידים → עלייה לשמיים ביום ה־40 → פנטקוסט ביום ה־50\",\"correct\":true},{\"text\":\"פנטקוסט ביום ה־10 → עלייה לשמיים ביום ה־40 → התחייה ביום ה־50\",\"correct\":false},{\"text\":\"עלייה לשמיים ביום הראשון → אמאוס ביום ה־40 → פנטקוסט ביום ה־50\",\"correct\":false},{\"text\":\"התגלויות לתלמידים → פנטקוסט ביום ה־40 → עלייה לשמיים ביום ה־50\",\"correct\":false}],\"explanation\":\"התקופה שלאחר הפסחא כוללת התגלויות, את העלייה ביום הארבעים ואת פנטקוסט ביום החמישים. כך יש לשלב אירוע, מועד ואתר.\",\"source\":\"נצרות ג ומפגש החזרה — ציר הזמן לאחר התחייה\"},{\"id\":149,\"question\":\"נזיר עומד בראש קבלת קבוצה במנזר. האם עצם היותו נזיר מסמיכה אותו לערוך מיסה ולהעניק סקרמנטים?\",\"category\":\"ז. חיבורים למורה הדרך\",\"answers\":[{\"text\":\"לא; לשם כך דרושה גם הסמכה לכהונה\",\"correct\":true},{\"text\":\"כן; שלושת נדרי הנזירות מקנים אוטומטית סמכות כוהנית\",\"correct\":false},{\"text\":\"כן; כל נזיר הוא בדרגת בישוף בתוך המנזר\",\"correct\":false},{\"text\":\"לא; נזירים מנועים תמיד מהסמכה לכהונה\",\"correct\":false}],\"explanation\":\"נזירות וכהונה הן מסגרות שונות. נזיר יכול להיות גם כומר, אך הסמכות להעניק סקרמנטים נובעת מן ההסמכה הכוהנית ולא מנדרי הנזירות.\",\"source\":\"נצרות ג — נזירות, כהונה וסקרמנטים\"},{\"id\":150,\"question\":\"כיצד נכון להסביר אתר שבו המסורת הכנסייתית והמחקר ההיסטורי מציעים זיהויים שונים?\",\"category\":\"ז. חיבורים למורה הדרך\",\"answers\":[{\"text\":\"להציג במפורש את המקור, את המסורת ואת הצעת המחקר כשלושה רבדים\",\"correct\":true},{\"text\":\"לבחור בזיהוי שמושך יותר תיירים ולהציגו כעובדה\",\"correct\":false},{\"text\":\"להסתיר את המסורת ולהציג רק מסקנה ארכאולוגית\",\"correct\":false},{\"text\":\"להסתיר את המחקר כדי לא לערער על מסורת המקום\",\"correct\":false}],\"explanation\":\"הבחנה בין רובדי הידע היא מיומנות ליבה של מורה דרך: מה כתוב, מה התקדש במסורת, ומה מציע המחקר. היא מאפשרת דיוק בלי זלזול באמונה.\",\"source\":\"מפגש החזרה למבחן — מתודולוגיית הדרכה באתרים נוצריים\"}]}}]\n11:I[27201,[\"/moreh-derech/_next/static/chunks/3fntmmi971322.js\",\"/moreh-derech/_next/static/chunks/30r482bhrq5tc.js\"],\"IconMark\"]\nc:[[\"$\",\"meta\",\"0\
