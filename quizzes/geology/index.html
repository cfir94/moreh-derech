\":false},{\"text\":\"מהיר מאוד — עשרות קילומטרים בשנה\",\"correct\":false},{\"text\":\"איטי מאוד — כמה סנטימטרים בשנה, בקצב הדומה לצמיחת ציפורן\",\"correct\":true}]},{\"id\":13,\"question\":\"מהו גבול גזירה (טרנספורם) בין לוחות טקטוניים?\",\"category\":\"טקטוניקת לוחות\",\"answers\":[{\"text\":\"אזור שבו לוחות מחליקים זה לצד זה בתנועה אופקית, ללא יצירה או הרס משמעותי של קרום\",\"correct\":true},{\"text\":\"אזור שבו שני לוחות יבשתיים מתרחקים באנכיות\",\"correct\":false},{\"text\":\"אזור שבו נוצר קרום אוקייני חדש בלבד\",\"correct\":false},{\"text\":\"אזור שבו לוח אחד צולל מתחת לשני\",\"correct\":false}]},{\"id\":14,\"question\":\"איזה מבנה בישראל מהווה דוגמה מובהקת לגבול טרנספורם?\",\"category\":\"טקטוניקת לוחות\",\"answers\":[{\"text\":\"רמת הגולן\",\"correct\":false},{\"text\":\"הרי הכרמל\",\"correct\":false},{\"text\":\"בקע ים המלח (השבר הסורי-אפריקאי)\",\"correct\":true},{\"text\":\"מכתש רמון\",\"correct\":false}]},{\"id\":16,\"question\":\"מהם שלושת סוגי גבולות הלוחות העיקריים?\",\"category\":\"טקטוניקת לוחות\",\"answers\":[{\"text\":\"גבול צפוני, גבול דרומי וגבול מרכזי\",\"correct\":false},{\"text\":\"גבול מתבדר (פתיחה), גבול מתכנס (הפחתה), וגבול גזירה (טרנספורם)\",\"correct\":true},{\"text\":\"גבול יבשתי, גבול אוקייני וגבול אטמוספרי\",\"correct\":false},{\"text\":\"גבול חם וגבול קר בלבד\",\"correct\":false}]},{\"id\":18,\"question\":\"מהו חוק העל-תצב (סופרפוזיציה)?\",\"category\":\"קימוט ושבירה\",\"answers\":[{\"text\":\"שכבות עליונות תמיד קדומות משכבות תחתונות\",\"correct\":false},{\"text\":\"כל שכבות הסלע נוצרות באותו זמן בדיוק\",\"correct\":false},{\"text\":\"אין קשר בין מיקום השכבה לגילה\",\"correct\":false},{\"text\":\"ברצף שכבות אופקי תקין, השכבה התחתונה היא הקדומה ביותר והעליונה הצעירה ביותר\",\"correct\":true}]},{\"id\":19,\"question\":\"מהם שלושת סוגי המאמצים (כוחות) העיקריים המופעלים על סלע?\",\"category\":\"קימוט ושבירה\",\"answers\":[{\"text\":\"לחיצה (compression), מתיחה (tension) וגזירה (shear)\",\"correct\":true},{\"text\":\"כבידה, חשמל ומגנטיות\",\"correct\":false},{\"text\":\"רוח, מים וקרח בלבד\",\"correct\":false},{\"text\":\"חום, קור ולחות\",\"correct\":false}]},{\"id\":20,\"question\":\"מהו קימוט מבחינה גיאולוגית?\",\"category\":\"קימוט ושבירה\",\"answers\":[{\"text\":\"שבירה מיידית של הסלע כתוצאה מלחץ עצום\",\"correct\":false},{\"text\":\"תהליך שבו הסלע נמס לחלוטין ומתמצק מחדש\",\"correct\":false},{\"text\":\"עיוות פלסטי ואיטי (על פני מיליוני שנים) שבו הסלע מתכופף ומתקפל מבלי להישבר\",\"correct\":true},{\"text\":\"תופעה המתרחשת רק בסלעי משקע רכים כמו קירטון\",\"correct\":false}]},{\"id\":21,\"question\":\"מהי אנטיקלינה (קמר)?\",\"category\":\"קימוט ושבירה\",\"answers\":[{\"text\":\"גוש סלע שקוע בין שני שברים\",\"correct\":false},{\"text\":\"קימוט של שכבות הסלע כלפי מטה בצורת אגן\",\"correct\":false},{\"text\":\"שבר אנכי בין שני גושי סלע\",\"correct\":false},{\"text\":\"קימוט של שכבות הסלע כלפי מעלה בצורת קשת, כשהשכבות העתיקות ביותר במרכז\",\"correct\":true}]},{\"id\":22,\"question\":\"מהי סינקלינה (קער)?\",\"category\":\"קימוט ושבירה\",\"answers\":[{\"text\":\"תעלה עמוקה באזור סובדוקציה\",\"correct\":false},{\"text\":\"גוש סלע מורם בין שני שברים\",\"correct\":false},{\"text\":\"קימוט של שכבות הסלע כלפי מטה בצורת אגן, כשהשכבות הצעירות ביותר במרכז\",\"correct\":true},{\"text\":\"קימוט של שכבות הסלע כלפי מעלה בצורת קשת\",\"correct\":false}]},{\"id\":23,\"question\":\"היכן בישראל ניתן למצוא דוגמאות מובהקות לקמרים (אנטיקלינות)?\",\"category\":\"קימוט ושבירה\",\"answers\":[{\"text\":\"הרי אילת בלבד\",\"correct\":false},{\"text\":\"חוף הים התיכון בלבד\",\"correct\":false},{\"text\":\"הרי יהודה והכרמל\",\"correct\":true},{\"text\":\"רמת הגולן בלבד\",\"correct\":false}]},{\"id\":24,\"question\":\"כיצד נוצרו המכתשים הייחודיים בנגב (כגון מכתש רמון)?\",\"category\":\"קימוט ושבירה\",\"answers\":[{\"text\":\"פגיעת מטאוריט בעבר הרחוק\",\"correct\":false},{\"text\":\"פעילות געשית שיצרה לוע הר געש\",\"correct\":false},{\"text\":\"התמוטטות תת-קרקעית פתאומית עקב שבר בודד\",\"correct\":false},{\"text\":\"חשיפה ובליה/סחי \"רמת הגולן והגליל התחתון\",\"correct\":false}]},{\"id\":102,\"question\":\"מהו מבחן הזיהוי המשותף לגיר ולקירטון בשטח?\",\"category\":\"סלעי משקע\",\"answers\":[{\"text\":\"מבחן מגנטיות באמצעות מצפן\",\"correct\":false},{\"text\":\"טעם מלוח מובהק בליקוק\",\"correct\":false},{\"text\":\"היעדר מוחלט של תגובה לחומצה\",\"correct\":false},{\"text\":\"תסיסה חזקה ומידית בטפטוף חומצה מלחית מהולה (5%–10%)\",\"correct\":true}]},{\"id\":103,\"question\":\"מהו ההרכב הכימי של סלע הדולומיט?\",\"category\":\"סלעי משקע\",\"answers\":[{\"text\":\"נתרן כלורי — NaCl\",\"correct\":false},{\"text\":\"תחמוצת סיליקון — SiO₂\",\"correct\":false},{\"text\":\"פחמת סידן ומגנזיום — CaMg(CO₃)₂\",\"correct\":true},{\"text\":\"סידן פחמתי טהור — CaCO₃\",\"correct\":false}]},{\"id\":104,\"question\":\"כיצד נוצר הדולומיט?\",\"category\":\"סלעי משקע\",\"answers\":[{\"text\":\"בהשקעה ראשונית ישירה מתוך מי ים בלבד, ללא תהליך משני\",\"correct\":false},{\"text\":\"בתהליך משני (דולומיטיזציה) שבו יוני מגנזיום מחליפים כ-50% מיוני הסידן בבוץ גירי/אבן גיר קיימת\",\"correct\":true},{\"text\":\"מהתמצקות מגמה עשירה במגנזיום\",\"correct\":false},{\"text\":\"מהתמרה תרמית של קוורציט\",\"correct\":false}]},{\"id\":105,\"question\":\"מה קשיות הדולומיט בסולם מוס לעומת קלציט, ומה משמעות ההבדל בשטח?\",\"category\":\"סלעי משקע\",\"answers\":[{\"text\":\"דולומיט 1 לעומת קלציט 8 — הדולומיט רך בהרבה מקלציט\",\"correct\":false},{\"text\":\"שניהם באותה קשיות בדיוק, 5 בסולם מוס\",\"correct\":false},{\"text\":\"דולומיט הוא הרך ביותר מכל סלעי המשקע, קשיות 1\",\"correct\":false},{\"text\":\"דולומיט 3.5–4 לעומת קלציט 3 — לכן הדולומיט עמיד יותר לבליה ובונה מצוקים תלולים\",\"correct\":true}]},{\"id\":106,\"question\":\"מהו מבחן הזיהוי הייחודי לדולומיט (המבדיל אותו מגיר)?\",\"category\":\"סלעי משקע\",\"answers\":[{\"text\":\"אינו תוסס בחומצה מלחית קרה — תוסס רק אם מחממים את החומצה או כותשים את הסלע לאבקה\",\"correct\":true},{\"text\":\"משנה צבע לירוק במגע עם חומצה\",\"correct\":false},{\"text\":\"אינו מגיב לחומצה בשום תנאי\",\"correct\":false},{\"text\":\"תוסס חזק ומידי בחומצה קרה, בדיוק כמו גיר\",\"correct\":false}]},{\"id\":107,\"question\":\"כיצד כינו חוצבים ובנאים ערבים בירושלים את הדולומיט האפור והקשה?\",\"category\":\"סלעי משקע\",\"answers\":[{\"text\":\"\\\"אבן החכמים\\\"\",\"correct\":false},{\"text\":\"\\\"אבן הזהב\\\"\",\"correct\":false},{\"text\":\"\\\"מיזי יהודי\\\" (אבן היהודים), כמשל לעקשנות\",\"correct\":true},{\"text\":\"\\\"מיזי אחמר\\\" בלבד (ללא הבחנה מהגרסה האפורה)\",\"correct\":false}]},{\"id\":109,\"question\":\"מהו מקור הצבעים העזים (אדום, צהוב, ורוד) באבן החול הנוביתית בדרום הארץ?\",\"category\":\"סלעי משקע\",\"answers\":[{\"text\":\"השקעת מלחי נחושת מתמיסות ימיות\",\"correct\":false},{\"text\":\"חימום מהתמרה תרמית שצבעה את הסלע\",\"correct\":false},{\"text\":\"גרגרי הקוורץ עצמם צבעוניים באופן טבעי\",\"correct\":false},{\"text\":\"ציפוי דק של תחמוצות ברזל (המטיט, לימוניט) ומינרלים נוספים סביב גרגרי הקוורץ הלבנים\",\"correct\":true}]},{\"id\":110,\"question\":\"כיצד נוצרה תופעת \\\"הפטרייה\\\" בבקעת תמנע?\",\"category\":\"סלעי משקע\",\"answers\":[{\"text\":\"בליה דיפרנציאלית — \\\"כובע\\\" קשה (קונגלומרט) מגן על \\\"רגל\\\" רכה (אבן חול פריכה) שנשחקת ע\\\"י רוח נושאת חול\",\"correct\":true},{\"text\":\"התכת שכבת בזלת שהתקררה בצורת פטרייה\",\"correct\":false},{\"text\":\"המסה כימית של דולומיט לאורך אלפי שנים בלבד\",\"correct\":false},{\"text\":\"פעילות אלמוגים קדומה בים רדוד\",\"correct\":false}]},{\"id\":112,\"question\":\"מהו סלע ההתאדות (אוופוריט) העיקרי הנחשף בהר סדום, וממה הוא מורכב?\",\"category\":\"סלעי משקע\",\"answers\":[{\"text\":\"גיר — סידן פחמתי (CaCO₃)\",\"correct\":false},{\"text\":\"בזלת — סלע מאפי כהה\",\"correct\":false},{\"text\":\"קוורציט — תחמוצת סיליקון\",\"correct\":false},{\"text\":\"מלח (הליט) — נתרן כלורי (NaCl)\",\"correct\":true}]},{\"id\":113,\"question\":\"מה קשיות המלח (הליט) בסולם מוס, וכיצד מזהים אותו בשטח?\",\"category\":\"סלעי משקע\",\"answers\":[{\"text\":\"קשיות 9 — קשה מאוד ולא נשרט אפילו במתכת\",\"correct\":false},{\"text\":\"קשיות 1 — כמעט נוזלי במגע\",\"correct\":false},{\"text\":\"קשיות 2.5 — רך מאוד, נחרץ בציפורן, בעל טעם מלוח מובהק וגביש קובייתי\",\"correct\":true},{\"text\":\"קשיות 5 — קשיות בינונית, ללא טעם מובהק\",\"correct\":false}]},{\"id\":115,\"question\":\"כיצד נוצר סלע מטמורפי?\",\"category\":\"סלעים מטמורפיים\",\"answers\":[{\"text\":\"שינוי עמוק של סלע קיים במצב מוצק לחלוטין (ללא התכה) עקב חום, לחץ טקטוני, או תמיסות חמות\",\"correct\":true},{\"text\":\"התמצקות ישירה של מאגמה או לבה\",\"correct\":false},{\"text\":\"התכה מלאה של סלע והתגבשותו מחדש\",\"correct\":false},{\"text\":\"הצטברות והתלכדות של פירורי סלע שנסחפו\",\"correct\":false}]},{\"id\":116,\"question\":\"מהם שני סוגי המטמורפיזם העיקריים?\",\"category\":\"סלעים מטמורפיים\",\"answers\":[{\"text\":\"מטמורפיזם ימי ומטמורפיזם יבשתי\",\"correct\":false},{\"text\":\"מטמורפיזם חם ומטמורפיזם קר\",\"correct\":false},{\"text\":\"מטמורפיזם אזורי (בעומק, במהלך אורוגנזה) ומטמורפיזם מגע/חודרני (בקרבת גוף מגמתי)\",\"correct\":true},{\"text\":\"מטמורפיזם ראשוני ומטמורפיזם משני בלבד\",\"correct\":false}]},{\"id\":117,\"question\":\"לאיזה סלע הופך גיר בתהליך התמרה?\",\"category\":\"סלעים מטמורפיים\",\"answers\":[{\"text\":\"גנייס\",\"correct\":false},{\"text\":\"קוורציט\",\"correct\":false},{\"text\":\"שיש\",\"correct\":true},{\"text\":\"בזלת\",\"correct\":false}]},{\"id\":118,\"question\":\"לאיזה סלע הופכת אבן חול בתהליך התמרה?\",\"category\":\"סלעים מטמורפיים\",\"answers\":[{\"text\":\"גרניט\",\"correct\":false},{\"text\":\"קוורציט\",\"correct\":true},{\"text\":\"שיש\",\"correct\":false},{\"text\":\"דולומיט\",\"correct\":false}]},{\"id\":119,\"question\":\"לאיזה סלע הופך גרניט בתהליך התמרה אזורית בדרגה גבוהה?\",\"category\":\"סלעים מטמורפיים\",\"answers\":[{\"text\":\"שיש\",\"correct\":false},{\"text\":\"גנייס\",\"correct\":true},{\"text\":\"קירטון\",\"correct\":false},{\"text\":\"קוורציט\",\"correct\":false}]},{\"id\":120,\"question\":\"לאיזה סלע הופכת חרסית בתהליך התמרה מתקדם?\",\"category\":\"סלעים מטמורפיים\",\"answers\":[{\"text\":\"אבן חול\",\"correct\":false},{\"text\":\"בזלת\",\"correct\":false},{\"text\":\"מלח (הליט)\",\"correct\":false},{\"text\":\"צפחה, ובהמשך גנייס\",\"correct\":true}]},{\"id\":121,\"question\":\"מהי פוליאציה?\",\"category\":\"סלעים מטמורפיים\",\"answers\":[{\"text\":\"צביעת סלע בתחמוצות ברזל\",\"correct\":false},{\"text\":\"סידור המינרלים בסלע מטמורפי בפסים מקבילים, בניצב לכיוון הלחץ שפעל עליו\",\"correct\":true},{\"text\":\"תהליך המסה כימית של קלציט\",\"correct\":false},{\"text\":\"שם נוסף להתמצקות מגמה\",\"correct\":false}]},{\"id\":122,\"question\":\"כיצד ניתן להבחין בשטח בין קוורציט לאבן חול רגילה?\",\"category\":\"סלעים מטמורפיים\",\"answers\":[{\"text\":\"קוורציט תמיד לבן בוהק, אבן חול תמיד שחורה\",\"correct\":false},{\"text\":\"אין דרך להבחין ביניהם בשטח כלל\",\"correct\":false},{\"text\":\"אבן חול קשה יותר מקוורציט\",\"correct\":false},{\"text\":\"בקוורציט קו השבר עובר דרך הגרגרים עצמם (לא סביבם), הוא קשה מאוד ואינו משאיר גרגרי חול על הידיים\",\"correct\":true}]},{\"id\":123,\"question\":\"מהו \\\"המנסרה\\\" במכתש רמון, וכיצד נוצרה?\",\"category\":\"סלעים מטמורפיים\",\"answers\":[{\"text\":\"שרשרת של קמרים (אנטיקלינות) קטנים\",\"correct\":false},{\"text\":\"מבנה שנחצב על ידי בני אדם בתקופה הנבטית\",\"correct\":false},{\"text\":\"אלפי עמודי קוורציט מצולעים; גוף מגמטי \\\"אפה\\\" שכבות אבן חול והתמיר אותן, ולאחר מכן התכווצו וסידקו בהתקררות\",\"correct\":true},{\"text\":\"שכבת בזלת שקפאה במהירות על פני מכתש רמון\",\"correct\":false}]},{\"id\":125,\"question\":\"היכן בישראל חשוף הגנייס?\",\"category\":\"סלעים מטמורפיים\",\"answers\":[{\"text\":\"הרי אילת בלבד — כמו בתצורת \\\"גנייס רודד\\\" בהר שלמה, ובאפיקי נחל רודד ונחל שלמה\",\"correct\":true},{\"text\":\"לאורך כל שדרת ההר המרכזית מהגליל ועד הנגב\",\"correct\":false},{\"text\":\"הרי הגליל והכרמל\",\"correct\":false},{\"text\":\"רמת הגולן ומכתש רמון\",\"correct\":false}]},{\"id\":127,\"question\":\"כיצד נוצר שיש, ומה קורה למאובנים ולנקבוביות שהיו בסלע המקורי?\",\"category\":\"סלעים מטמורפיים\",\"answers\":[{\"t רגירי של נייר זכוכית\",\"correct\":false},{\"text\":\"אבן גיר — קשיות בינונית, תוסס מיד בחומצה קרה\",\"correct\":false}],\"image\":{\"url\":\"/quiz-images/geology/rocks/dolomite.jpg\",\"fit\":\"cover\",\"credit\":\"Wikimedia Commons\"}},{\"id\":158,\"question\":\"איזה סלע מוצג בתמונה (שימו לב לשיכוב ולמרקם הגרגירי)?\",\"category\":\"סלעי משקע\",\"answers\":[{\"text\":\"קירטון — סלע לבן בוהק ורך במיוחד\",\"correct\":false},{\"text\":\"גנייס — סלע מטמורפי עם פסים בהירים וכהים\",\"correct\":false},{\"text\":\"בזלת — סלע כהה ואחיד ללא שיכוב\",\"correct\":false},{\"text\":\"אבן חול — סלע משקע קלסטי מגרגרי קוורץ, מופיע בשכבות אופקיות\",\"correct\":true}],\"image\":{\"url\":\"/quiz-images/geology/rocks/sandstone.jpg\",\"fit\":\"cover\",\"credit\":\"Wikimedia Commons\"}},{\"id\":159,\"question\":\"איזה סלע מוצג בתמונה?\",\"category\":\"סלעי משקע\",\"answers\":[{\"text\":\"מלח (הליט) — סלע התאדות רך במיוחד, גביש קובייתי, שקוף עד עכור\",\"correct\":true},{\"text\":\"גרניט — סלע מגמטי-פלוטוני קשה\",\"correct\":false},{\"text\":\"קוורציט — סלע מטמורפי קשה מאוד\",\"correct\":false},{\"text\":\"גיר — סלע משקע קרבונטי בקשיות בינונית\",\"correct\":false}],\"image\":{\"url\":\"/quiz-images/geology/rocks/halite.jpg\",\"fit\":\"cover\",\"credit\":\"Wikimedia Commons\"}},{\"id\":160,\"question\":\"איזה מבנה סלעי ייחודי מוצג בתמונה, ומאיזה סלע הוא בנוי?\",\"category\":\"סלעים מטמורפיים\",\"answers\":[{\"text\":\"\\\"המנסרה\\\" במכתש רמון — עמודי קוורציט מצולעים שנוצרו מהתמרת מגע של אבן חול\",\"correct\":true},{\"text\":\"הר סדום — דיאפיר מלח\",\"correct\":false},{\"text\":\"בריכת המשושים בגולן — עמודי בזלת משושים\",\"correct\":false},{\"text\":\"עמודי עמרם בתמנע — אבן חול ורודה-אדומה\",\"correct\":false}],\"image\":{\"url\":\"/quiz-images/geology/rocks/quartzite_minsara.jpg\",\"fit\":\"cover\",\"credit\":\"Wikimedia Commons\"}},{\"id\":161,\"question\":\"איזה סלע מוצג בתמונה (שימו לב לפסים הבהירים והכהים המקבילים — הפוליאציה)?\",\"category\":\"סלעים מטמורפיים\",\"answers\":[{\"text\":\"גנייס — סלע מטמורפי מהתמרה אזורית בדרגה גבוהה, עם פוליאציה בולטת\",\"correct\":true},{\"text\":\"שיש — סלע מטמורפי אחיד ללא פסים\",\"correct\":false},{\"text\":\"אבן חול — סלע משקע קלסטי\",\"correct\":false},{\"text\":\"גרניט — סלע מגמטי-פלוטוני עם גבישים לא מכוונים\",\"correct\":false}],\"image\":{\"url\":\"/quiz-images/geology/rocks/gneiss.jpg\",\"fit\":\"cover\",\"credit\":\"Wikimedia Commons\"}},{\"id\":162,\"question\":\"איזה סלע מוצג בתמונה?\",\"category\":\"סלעים מטמורפיים\",\"answers\":[{\"text\":\"קירטון — סלע משקע רך ופריך\",\"correct\":false},{\"text\":\"דולומיט — סלע משקע קשה בגוון אפור-אדמדם\",\"correct\":false},{\"text\":\"אבן גיר — סלע משקע נקבובי, לעיתים עם מאובנים\",\"correct\":false},{\"text\":\"שיש — סלע מטמורפי אחיד וצפוף, ללא נקבוביות או מאובנים, שנוצר מהתמרת גיר או דולומיט\",\"correct\":true}],\"image\":{\"url\":\"/quiz-images/geology/rocks/marble.jpg\",\"fit\":\"cover\",\"credit\":\"Wikimedia Commons\"}},{\"id\":163,\"question\":\"בתרשים מוצגים שני מבנים שנוצרו משבירה טקטונית. מהם, ומי מהם הגוש המורם ומי השקוע?\",\"category\":\"קימוט ושבירה\",\"answers\":[{\"text\":\"אנטיקלינה (הגוש המורם) וסינקלינה (הגוש השקוע) — שני מבני קימוט\",\"correct\":false},{\"text\":\"הורסט (הגוש המורם בין שני שברים) וגרבן (הגוש השקוע בין שני שברים)\",\"correct\":true},{\"text\":\"שני הגושים בתרשים הם דוגמה לגבול טרנספורם בלבד, ללא הבדל גובה\",\"correct\":false},{\"text\":\"רכס מרכז-אוקייני (מורם) ותעלה אוקיינית (שקועה)\",\"correct\":false}],\"image\":{\"url\":\"/quiz-images/geology/diagrams/horst_graben.jpg\",\"fit\":\"cover\",\"credit\":\"Brews ohare / Wikimedia Commons (CC BY-SA 3.0), נחתך\"}},{\"id\":164,\"question\":\"בתרשים מוצגים כמה דגמים תלת-ממדיים של תזוזת גושי סלע לאורך שבר. שלושה מהם הם סוגי ההעתקים הקלאסיים שנלמדו בקורס — מהם?\",\"category\":\"קימוט ושבירה\",\"answers\":[{\"text\":\"גבול פתיחה, גבול הפחתה, וגבול פנימי\",\"correct\":false},{\"text\":\"הורסט, גרבן, ומצוק העתקים בלבד\",\"correct\":false},{\"text\":\"העתק נורמלי (מתיחה), העתק הפוך (לחיצה), והעתק הזזה אופקית (גזירה)\",\"correct\":true},{\"text\":\"אנטיקלינה, סינקלינה, ומונוקלינה\",\"correct\":false}],\"image\":{\"url\":\"/quiz-images/geology/diagrams/fault_types.svg\",\"fit\":\"contain\",\"credit\":\"Jesús Gómez Fernández / Wikimedia Commons (CC BY-SA 3.0)\"}},{\"id\":165,\"question\":\"בתרשים מוצג רצף שכבות סלע מקומטות לסירוגין — קשתות כלפי מעלה וקערים כלפי מטה. כיצד מבחינים בין שני סוגי הקימוט הללו, לפי מיקום השכבות העתיקות ביותר?\",\"category\":\"קימוט ושבירה\",\"answers\":[{\"text\":\"באנטיקלינה (הקמר הקמור) השכבות העתיקות ביותר במרכז; בסינקלינה (הקער הקעור) השכבות הצעירות ביותר במרכז\",\"correct\":true},{\"text\":\"אין הבדל בגיל השכבות בין שני המבנים — ההבדל הוא רק בצבע הסלע\",\"correct\":false},{\"text\":\"באנטיקלינה השכבות הצעירות ביותר תמיד במרכז, ובסינקלינה העתיקות ביותר\",\"correct\":false},{\"text\":\"שני המבנים בתרשים הם בעצם אותו מבנה שצולם מזוויות שונות\",\"correct\":false}],\"image\":{\"url\":\"/quiz-images/geology/diagrams/fold_anticline_syncline.png\",\"fit\":\"contain\",\"credit\":\"Pearson Scott Foresman / Wikimedia Commons (public domain)\"}},{\"id\":166,\"question\":\"בתרשים מוצג חתך רוחב של קרום כדור הארץ עם שלושת סוגי גבולות הלוחות. אילו שלושה סוגים אלו?\",\"category\":\"טקטוניקת לוחות\",\"answers\":[{\"text\":\"גבול מתבדר/פתיחה (עם רכס מרכז-אוקייני), גבול מתכנס/הפחתה (עם תעלה עמוקה והר געש), וגבול גזירה/טרנספורם\",\"correct\":true},{\"text\":\"הורסט, גרבן, ומצוק העתקים\",\"correct\":false},{\"text\":\"גבול צפוני, גבול דרומי, וגבול משווני בלבד\",\"correct\":false},{\"text\":\"אנטיקלינה, סינקלינה, ומונוקלינה\",\"correct\":false}],\"image\":{\"url\":\"/quiz-images/geology/diagrams/plate_boundaries.png\",\"fit\":\"contain\",\"credit\":\"José F. Vigil, USGS / Wikimedia Commons (public domain)\"}}]}}]\n11:I[27201,[\"/moreh-derech/_next/static/chunks/3mkv7ugmxwio7.js\"],\"IconMark\"]\nc:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n9:n
