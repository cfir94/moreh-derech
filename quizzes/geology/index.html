n6:[\"$\",\"$L10\",null,{\"quiz\":{\"slug\":\"geology\",\"label\":\"גיאולוגיה\",\"categories\":[\"טקטוניקת לוחות\",\"קימוט ושבירה\",\"רעידות אדמה\",\"בקע ים המלח וגיאולוגיה של ארץ ישראל\",\"גיאומורפולוגיה\",\"סלעים מגמטיים\",\"סלעי משקע\",\"סלעים מטמורפיים\",\"מחזור הסלעים\",\"טעויות נפוצות ומונחים מסחריים\"],\"questions\":[{\"id\":1,\"question\":\"מהי הליתוספירה?\",\"category\":\"טקטוניקת לוחות\",\"answers\":[{\"text\":\"הקרום וחלק מהמעטפת העליונה, המחולקים ללוחות\",\"correct\":true},{\"text\":\"השכבה הצמיגה והחמה שמתחת ללוחות\",\"correct\":false},{\"text\":\"הליבה החיצונית הנוזלית של כדור הארץ\",\"correct\":false},{\"text\":\"שכבת הקרקע העליונה שבה גדלים צמחים\",\"correct\":false}],\"explanation\":\"הליתוספירה היא השכבה הקשיחה שנשברה ללוחות הנעים זה ביחס לזה; מתחתיה האסתנוספירה הצמיגה.\",\"topic\":\"geology\"},{\"id\":2,\"question\":\"מהי האסתנוספירה?\",\"category\":\"טקטוניקת לוחות\",\"answers\":[{\"text\":\"שכבה צמיגה וחמה שמתחת לליתוספירה\",\"correct\":true},{\"text\":\"השכבה החיצונית הקשיחה, המחולקת ללוחות\",\"correct\":false},{\"text\":\"הליבה החיצונית הנוזלית, שבה נוצר השדה המגנטי\",\"correct\":false},{\"text\":\"השכבה התחתונה של הקרום היבשתי בלבד\",\"correct\":false}],\"explanation\":\"באסתנוספירה מתרחשים זרמי הקונבקציה שמניעים את הלוחות שמעליה.\",\"topic\":\"christianity\"},{\"id\":3,\"question\":\"מיהו החוקר שהגה את רעיון \\\"נדידת היבשות\\\", ממנו התפתחה תיאוריית טקטוניקת הלוחות?\",\"category\":\"טקטוניקת לוחות\",\"answers\":[{\"text\":\"קארולוס לינאוס\",\"correct\":false},{\"text\":\"צ'ארלס דרווין\",\"correct\":false},{\"text\":\"אלברט איינשטיין\",\"correct\":false},{\"text\":\"אלפרד וגנר\",\"correct\":true}],\"topic\":\"geology\"},{\"id\":4,\"question\":\"מהו זרם הקונבקציה ומה תפקידו בטקטוניקת הלוחות?\",\"category\":\"טקטוניקת לוחות\",\"answers\":[{\"text\":\"תנועה מעגלית של חומר חם העולה ומתקרר במעטפת\",\"correct\":true},{\"text\":\"תנועה אנכית של הליתוספירה כלפי מעלה בלבד\",\"correct\":false},{\"text\":\"זרם מים תת-קרקעי הממיס סלעי גיר בעומק\",\"correct\":false},{\"text\":\"זרם אוויר חם העולה מעל שטח יבשתי מחומם\",\"correct\":false}],\"explanation\":\"החומר החם עולה, מתקרר בקרבת פני השטח ושוקע — והמעגל הזה גורר איתו את הלוחות.\",\"topic\":\"geology\"},{\"id\":5,\"question\":\"איזו מהעדויות הבאות אינה נמנית על העדויות ההיסטוריות לתיאוריית טקטוניקת הלוחות?\",\"category\":\"טקטוניקת לוחות\",\"answers\":[{\"text\":\"רצועות מגנטיות בקרקעית הים\",\"correct\":false},{\"text\":\"מציאת מאובנים זהים ביבשות המופרדות כיום באוקיינוס\",\"correct\":false},{\"text\":\"התאמת קווי החוף בין מערב אפריקה למזרח דרום אמריקה\",\"correct\":false},{\"text\":\"אחידות מוחלטת בצבעי הסלעים בכל היבשות\",\"correct\":true}],\"topic\":\"geology\"},{\"id\":6,\"question\":\"מה מתרחש באזור פתיחה (spreading) בין לוחות טקטוניים?\",\"category\":\"טקטוניקת לוחות\",\"answers\":[{\"text\":\"לוח אחד צולל מתחת לשני ונהרס\",\"correct\":false},{\"text\":\"הלוחות מחליקים זה לצד זה ללא יצירת קרום חדש\",\"correct\":false},{\"text\":\"הלוחות מתרחקים זה מזה, מאגמה עולה ונוצר קרום אוקייני חדש\",\"correct\":true},{\"text\":\"הקרום מתקמט ונוצרים הרי קמט בלבד\",\"correct\":false}],\"topic\":\"christianity\"},{\"id\":7,\"question\":\"מהו רכס מרכז-אוקייני?\",\"category\":\"טקטוניקת לוחות\",\"answers\":[{\"text\":\"קו החוף שבו נפגשים לוח יבשתי ולוח אוקייני\",\"correct\":false},{\"text\":\"רכס הרים תת-ימי הנוצר מעליית מאגמה בזלתית באזור פתיחה\",\"correct\":true},{\"text\":\"שרשרת הרי געש היבשתיים סביב האוקיינוס השקט\",\"correct\":false},{\"text\":\"תעלה עמוקה הנוצרת באזור סובדוקציה\",\"correct\":false}],\"topic\":\"christianity\"},{\"id\":9,\"question\":\"מה מתרחש באזור הפחתה (סובדוקציה)?\",\"category\":\"טקטוניקת לוחות\",\"answers\":[{\"text\":\"הלוחות מפסיקים לנוע לחלוטין\",\"correct\":false},{\"text\":\"שני לוחות יבשתיים מתמזגים לאחד ללא שינוי בגובה הנוף\",\"correct\":false},{\"text\":\"נוצר קרום אוקייני חדש בלבד, ללא הרי געש\",\"correct\":false},{\"text\":\"לוח אוקייני כבד צולל מתחת ללוח יבשתי קל ממנו, והקרום הישן מוחזר אל המעטפת\",\"correct\":true}],\"topic\":\"christianity\"},{\"id\":10,\"question\":\"מהי \\\"טבעת האש\\\"?\",\"category\":\"טקטוניקת לוחות\",\"answers\":[{\"text\":\"אזור סובדוקציה סביב האוקיינוס השקט\",\"correct\":true},{\"text\":\"מערכת השברים לאורך בקע ים המלח\",\"correct\":false},{\"text\":\"שכבת הבזלת המכסה את רמת הגולן\",\"correct\":false},{\"text\":\"שם נוסף לרכס המרכז-אטלנטי\",\"correct\":false}],\"topic\":\"geology\",\"explanation\":\"רוב הרי הגעש ורעידות האדמה בעולם מתרחשים בטבעת הזו, שבה לוחות אוקייניים צוללים מתחת ליבשות.\"},{\"id\":11,\"question\":\"אילו הרים נוצרו כתוצאה מסובדוקציה של קרום אוקייני מתחת ליבשת דרום אמריקה?\",\"category\":\"טקטוניקת לוחות\",\"answers\":[{\"text\":\"הרי האלפים\",\"correct\":false},{\"text\":\"הרי הגליל\",\"correct\":false},{\"text\":\"הרי אילת\",\"correct\":false},{\"text\":\"הרי האנדים\",\"correct\":true}],\"topic\":\"christianity\"},{\"id\":12,\"question\":\"מהו קצב התנועה הטיפוסי של לוחות טקטוניים?\",\"category\":\"טקטוניקת לוחות\",\"answers\":[{\"text\":\"מטרים ספורים ביום\",\"correct\":false},{\"text\":\"הלוחות בכלל אינם נעים ברציפות, אלא רק בעת רעידת אדמה\",\"correct\":false},{\"text\":\"מהיר מאוד — עשרות קילומטרים בשנה\",\"correct\":false},{\"text\":\"איטי מאוד — כמה סנטימטרים בשנה, בקצב הדומה לצמיחת ציפורן\",\"correct\":true}],\"topic\":\"flora-fauna\"},{\"id\":13,\"question\":\"מהו גבול גזירה (טרנספורם) בין לוחות טקטוניים?\",\"category\":\"טקטוניקת לוחות\",\"answers\":[{\"text\":\"לוחות המחליקים זה לצד זה בתנועה אופקית\",\"correct\":true},{\"text\":\"לוח אחד הצולל אל מתחת ללוח השני\",\"correct\":false},{\"text\":\"לוחות המתרחקים ויוצרים קרום חדש\",\"correct\":false},{\"text\":\"לוחות המתנגשים ויוצרים הרי קמט\",\"correct\":false}],\"topic\":\"christianity\",\"explanation\":\"בגבול טרנספורם לא נוצר קרום ולא נהרס — ולכן אין בו הרי געש, אך יש רעידות אדמה חזקות.\"},{\"id\":14,\"question\":\"איזה מבנה בישראל מהווה דוגמה מובהקת לגבול טרנספורם?\",\"category\":\"טקטוניקת לוחות\",\"answers\":[{\"text\":\"בקע ים המלח\",\"correct\":true},{\"text\":\"רמת הגולן\",\"correct\":false},{\"text\":\"הרי הכרמל\",\"correct\":false},{\"text\":\"מכתש רמון\",\"correct\":false}],\"explanation\":\"השבר הסורי-אפריקאי הוא גבול טרנספורם: הלוח הערבי נע צפונה ביחס לסיני בתנועה אופקית של כ-105 ק\\\"מ.\",\"topic\":\"geography\"},{\"id\":16,\"question\":\"מהם שלושת סוגי גבולות הלוחות העיקריים?\",\"category\":\"טקטוניקת לוחות\",\"answers\":[{\"text\":\"גבול צפוני, גבול דרומי וגבול מרכזי\",\"correct\":false},{\"text\":\"גבול מתבדר (פתיחה), גבול מתכנס (הפחתה), וגבול גזירה (טרנספורם)\",\"correct\":true},{\"text\":\"גבול יבשתי, גבול אוקייני וגבול אטמוספרי\",\"correct\":false},{\"text\":\"גבול חם וגבול קר בלבד\",\"correct\":false}],\"topic\":\"geography\"},{\"id\":18,\"question\":\"מהו חוק העל-תצב (סופרפוזיציה)?\",\"category\":\"קימוט ושבירה\",\"answers\":[{\"text\":\"השכבה התחתונה היא הקדומה ביותר\",\"correct\":true},{\"text\":\"השכבה העליונה היא הקדומה ביותר\",\"correct\":false},{\"text\":\"כל השכבות נוצרו באותו פרק זמן\",\"correct\":false},{\"text\":\"אין קשר בין מיקום השכבה לגילה\",\"correct\":false}],\"topic\":\"christianity\",\"explanation\":\"החוק תקף ברצף אופקי שלא התהפך; היפוך שכבות בקימוט חזק הוא בדיוק מה שמסבך תיארוך בשטח.\"},{\"id\":19,\"question\":\"מהם שלושת סוגי המאמצים (כוחות) העיקריים המופעלים על סלע?\",\"category\":\"קימוט ושבירה\",\"answers\":[{\"text\":\"לחיצה, מתיחה וגזירה\",\"correct\":true},{\"text\":\"דחיסה, המסה והתאדות\",\"correct\":false},{\"text\":\"חום, קור ולחות\",\"correct\":false},{\"text\":\"רוח, מים וקרח\",\"correct\":false}],\"explanation\":\"לחיצה מקמטת ויוצרת הרי קמט, מתיחה שוברת ויוצרת בקעים, וגזירה מחליקה — כמו בגבול טרנספורם.\",\"topic\":\"modern-yishuv\"},{\"id\":20,\"question\":\"מהו קימוט מבחינה גיאולוגית?\",\"category\":\"קימוט ושבירה\",\"answers\":[{\"text\":\"שבירה מיידית של הסלע כתוצאה מלחץ עצום\",\"correct\":false},{\"text\":\"תהליך שבו הסלע נמס לחלוטין ומתמצק מחדש\",\"correct\":false},{\"text\":\"עיוות פלסטי ואיטי (על פני מיליוני שנים) שבו הסלע מתכופף ומתקפל מבלי להישבר\",\"correct\":true},{\"text\":\"תופעה המתרחשת רק בסלעי משקע רכים כמו קירטון\",\"correct\":false}],\"topic\":\"geology\"},{\"id\":21,\"question\":\"מהי אנטיקלינה (קמר)?\",\"category\":\"קימוט ושבירה\",\"answers\":[{\"text\":\"קימוט כלפי מעלה בצורת קשת\",\"correct\":true},{\"text\":\"קימוט כלפי מטה בצורת אגן\",\"correct\":false},{\"text\":\"גוש סלע מורם בין שני שברים\",\"correct\":false},{\"text\":\"שבר אנכי בין שני גושי סלע\",\"correct\":false}],\"topic\":\"geology\",\"explanation\":\"בקמר השכבות העתיקות נמצאות במרכז, כי הקשת נשחקת מלמעלה וחושפת את מה שהיה בעומק.\"},{\"id\":22,\"question\":\"מהי סינקלינה (קער)?\",\"category\":\"קימוט ושבירה\",\"answers\":[{\"text\":\"קימוט כלפי מטה בצורת אגן\",\"correct\":true},{\"text\":\"קימוט כלפי מעלה בצורת קשת\",\"correct\":false},{\"text\":\"גוש סלע שקוע בין שני שברים\",\"correct\":false},{\"text\":\"תעלה עמוקה באזור סובדוקציה\",\"correct\":false}],\"topic\":\"geology\",\"explanation\":\"בקער השכבות הצעירות במרכז. קמר וקער נבדלים בכיוון הקימוט, לא בגובה הנוף — קער יכול להיות הר.\"},{\"id\":23,\"question\":\"היכן בישראל ניתן למצוא דוגמאות מובהקות לקמרים (אנטיקלינות)?\",\"category\":\"קימוט ושבירה\",\"answers\":[{\"text\":\"הרי אילת בלבד\",\"correct\":false},{\"text\":\"חוף הים התיכון בלבד\",\"correct\":false},{\"text\":\"הרי יהודה והכרמל\",\"correct\":true},{\"text\":\"רמת הגולן בלבד\",\"correct\":false}],\"topic\":\"geography\"},{\"id\":24,\"question\":\"כיצד נוצרו המכתשים הייחודיים בנגב (כגון מכתש רמון)?\",\"category\":\"קימוט ושבירה\",\"answers\":[{\"text\":\"פגיעת מטאוריט בעבר הרחוק\",\"correct\":false},{\"text\":\"פעילות געשית שיצרה לוע הר געש\",\"correct\":false},{\"text\":\"התמוטטות תת-קרקעית פתאומית עקב שבר בודד\",\"correct\":false},{\"text\":\"חשיפה ובליה/סחיפה של ליבת גבעה מקומטת (אנטיקלינה) שהתרוממה\",\"correct\":true}],\"topic\":\"geology\"},{\"id\":25,\"question\":\"מהי שבירה (העתק) מבחינה גיאולוגית?\",\"category\":\"קימוט ושבירה\",\"answers\":[{\"text\":\"תופעה שמתרחשת אך ורק בסלעים מגמטיים\",\"correct\":false},{\"text\":\"תגובה מיידית ופתאומית של הסלע, המ דה או הר תבור\",\"correct\":true}],\"topic\":\"geology\"},{\"id\":30,\"question\":\"מהו גרבן (בקעה), ותן דוגמה ממנו בישראל.\",\"category\":\"קימוט ושבירה\",\"answers\":[{\"text\":\"גוש סלע שקוע הכלוא בין שני שברים — כגון בקעת בית הכרם\",\"correct\":true},{\"text\":\"תעלה עמוקה בקרקעית האוקיינוס\",\"correct\":false},{\"text\":\"גוש סלע מורם הכלוא בין שני שברים — כגון הר תבור\",\"correct\":false},{\"text\":\"קמר קמור שהשכבות העתיקות בו במרכז\",\"correct\":false}],\"topic\":\"geology\"},{\"id\":31,\"question\":\"מהו ההבדל בין מוקד רעידת האדמה (היפוקנטר) לאפיקנטר?\",\"category\":\"קימוט ושבירה\",\"answers\":[{\"text\":\"האפיקנטר הוא תמיד עמוק יותר מהמוקד\",\"correct\":false},{\"text\":\"המוקד הוא נקודת השבירה בעומק הקרום; האפיקנטר הוא הנקודה על פני השטח מעל המוקד\",\"correct\":true},{\"text\":\"המוקד והאפיקנטר הם אותו הדבר בדיוק\",\"correct\":false},{\"text\":\"המוקד מתייחס לרעידות ימיות בלבד, האפיקנטר ליבשתיות\",\"correct\":false}],\"topic\":\"islam\"},{\"id\":32,\"question\":\"כיצד נוצר צונאמי מבחינה גיאולוגית?\",\"category\":\"קימוט ושבירה\",\"answers\":[{\"text\":\"רוח חזקה מעל פני הים בלבד\",\"correct\":false},{\"text\":\"שבירה תת-ימית פתאומית שמזיזה אנכית גוף מים אדיר\",\"correct\":true},{\"text\":\"התכה של קרחונים בקוטב\",\"correct\":false},{\"text\":\"התפרצות געשית יבשתית רחוקה מהים\",\"correct\":false}],\"topic\":\"christianity\"},{\"id\":33,\"question\":\"מה גורם ישירות לרעידת אדמה?\",\"category\":\"רעידות אדמה\",\"answers\":[{\"text\":\"שחרור פתאומי של אנרגיה אלסטית שנצברה לאורך מישור העתק\",\"correct\":true},{\"text\":\"שינויים עונתיים בטמפרטורת פני הים\",\"correct\":false},{\"text\":\"עלייה הדרגתית של מפלס מי התהום\",\"correct\":false},{\"text\":\"תהליכי בליה כימית איטיים בסלעי גיר\",\"correct\":false}],\"topic\":\"geology\"},{\"id\":34,\"question\":\"כיצד מתפשטת האנרגיה המשתחררת ברעידת אדמה?\",\"category\":\"רעידות אדמה\",\"answers\":[{\"text\":\"היא כלל אינה מתפשטת מעבר לנקודת השבירה\",\"correct\":false},{\"text\":\"כגלים סייסמיים המזעזעים את פני השטח\",\"correct\":true},{\"text\":\"כגלי חום בלבד\",\"correct\":false},{\"text\":\"כזרמי מים תת-קרקעיים\",\"correct\":false}],\"topic\":\"islam\"},{\"id\":35,\"question\":\"איזה אזור בישראל מוגדר כפעיל סייסמית לאורך כל ההיסטוריה, עם רעידות אדמה מתועדות רבות?\",\"category\":\"רעידות אדמה\",\"answers\":[{\"text\":\"בקע ים המלח\",\"correct\":true},{\"text\":\"רמת הנגב המערבית\",\"correct\":false},{\"text\":\"הרי הגליל העליון בלבד\",\"correct\":false},{\"text\":\"מישור החוף\",\"correct\":false}],\"topic\":\"geography\"},{\"id\":36,\"question\":\"מדוע יש רעידות אדמה תכופות לאורך בקע ים המלח?\",\"category\":\"רעידות אדמה\",\"answers\":[{\"text\":\"משום שזהו אזור פתיחה טהור ללא מאמצים טקטוניים\",\"correct\":false},{\"text\":\"אין קשר בין רעידות האדמה לטקטוניקה באזור זה\",\"correct\":false},{\"text\":\"משום שהאזור עשיר בפעילות געשית פעילה\",\"correct\":false},{\"text\":\"משום שהוא גבול טרנספורם שבו לוחות מחליקים זה לצד זה ומצטבר מאמץ עד לשחרור פתאומי\",\"correct\":true}],\"topic\":\"islam\"},{\"id\":37,\"question\":\"מהי העדות הארכיאולוגית הפיזית המפורסמת לתזוזה לאורך בקע ים המלח?\",\"category\":\"רעידות אדמה\",\"answers\":[{\"text\":\"חומה עתיקה במצד עתרת שנחצתה והוזזה לאורך קו השבר\",\"correct\":true},{\"text\":\"שכבת אפר געשי מתחת למצדה\",\"correct\":false},{\"text\":\"כתובת עתיקה המתעדת רעידת אדמה במגדל דוד\",\"correct\":false},{\"text\":\"שרידי אנייה שנמצאו בהר החרמון\",\"correct\":false}],\"topic\":\"islam\"},{\"id\":38,\"question\":\"מה קורה כאשר המאמץ הטקטוני על סלע עובר את סף חוזקו המכני?\",\"category\":\"רעידות אדמה\",\"answers\":[{\"text\":\"הסלע נמס במקום ונהפך למאגמה\",\"correct\":false},{\"text\":\"הסלע נשבר ברגע אחד ונוצר העתק, המשחרר אנרגיה כרעידת אדמה\",\"correct\":true},{\"text\":\"לא קורה דבר — הסלע סופג את הלחץ ללא שינוי\",\"correct\":false},{\"text\":\"הסלע ממשיך להתקפל לנצח מבלי להישבר\",\"correct\":false}],\"topic\":\"geology\"},{\"id\":39,\"question\":\"אילו תופעות טבע נוספות (מלבד רעידות אדמה) בישראל קשורות ישירות למערכת השברים לאורך בקע ים המלח?\",\"category\":\"רעידות אדמה\",\"answers\":[{\"text\":\"פריצת מעיינות חמים ומינרלים מעומק האדמה\",\"correct\":true},{\"text\":\"התפרצויות געשיות תכופות בהווה\",\"correct\":false},{\"text\":\"שינויי אקלים גלובליים\",\"correct\":false},{\"text\":\"היווצרות קרחונים\",\"correct\":false}],\"topic\":\"water-climate\"},{\"id\":40,\"question\":\"אילו מעיינות חמים בישראל בוקעים לאורך קווי שבר?\",\"category\":\"רעידות אדמה\",\"answers\":[{\"text\":\"טבריה וחמת גדר\",\"correct\":true},{\"text\":\"עין אבדת בלבד\",\"correct\":false},{\"text\":\"עין כרם ועין הוד\",\"correct\":false},{\"text\":\"עין גדי ועין פרת\",\"correct\":false}],\"topic\":\"geography\"},{\"id\":42,\"question\":\"מהו מצוק ההעתקים המשתרע ממערב לים המלח?\",\"category\":\"רעידות אדמה\",\"answers\":[{\"text\":\"רכס בזלתי שנוצר מהתפרצות געשית\",\"correct\":false},{\"text\":\"מצוק זקוף שנוצר מהתרוממות/שקיעה לאורך קו השבר של בקע ים המלח\",\"correct\":true},{\"text\":\"מצוק חול הנוצר מרוח בלבד\",\"correct\":false},{\"text\":\"שרשרת מכתשים שנוצרה מפגיעות מטאוריטים\",\"correct\":false}],\"topic\":\"christianity\"},{\"id\":43,\"question\":\"כיצד נוצר ים סוף?\",\"category\":\"בקע ים המלח וגיאולוגיה של ארץ ישראל\",\"answers\":[{\"text\":\"כתוצאה מהתכת קרחונים בעבר הרחוק\",\"correct\":false},{\"text\":\"כתוצאה מפגיעת מטאוריט ענק\",\"correct\":false},{\"text\":\"כתוצאה מסובדוקציה של לוח אפריקה מתחת ללוח ערב\",\"correct\":false},{\"text\":\"כתוצאה מהתרחקות לוח ערב מלוח אפריקה — אזור פתיחה צעיר\",\"correct\":true}],\"topic\":\"christianity\"},{\"id\":44,\"question\":\"מהו סוג הגבול הטקטוני שמאפיין את בקע ים המלח?\",\"category\":\"בקע ים המלח וגיאולוגיה של ארץ ישראל\",\"answers\":[{\"text\":\"אזור סובדוקציה\",\"correct\":false},{\"text\":\"אין לבקע ים המלח אופי טקטוני מוגדר\",\"correct\":false},{\"text\":\"אזור פתיחה טהור, כמו ים סוף\",\"correct\":false},{\"text\":\"טרנספורם (העתק תזוזה אופקית)\",\"correct\":true}],\"topic\":\"geology\"},{\"id\":45,\"question\":\"אילו לוחות נעים זה ביחס לזה לאורך בקע ים המלח, וכיצד?\",\"category\":\"בקע antine\",\"explanation\":\"לגונת סדום היא מקור המלח שממנו עלה מאוחר יותר הדיאפיר של הר סדום.\"},{\"id\":51,\"question\":\"מהו הר סדום מבחינה גיאולוגית?\",\"category\":\"בקע ים המלח וגיאולוגיה של ארץ ישראל\",\"answers\":[{\"text\":\"דיאפיר — פקק מלח שצף כלפי מעלה\",\"correct\":true},{\"text\":\"הורסט — גוש מורם בין שני שברים\",\"correct\":false},{\"text\":\"הר קימוט שנוצר מלחיצה טקטונית\",\"correct\":false},{\"text\":\"הר געש כבוי מתקופת הבזלות\",\"correct\":false}],\"topic\":\"geology\",\"explanation\":\"המלח קל מהסלעים שמעליו, ולכן הוא נדחק כלפי מעלה ומרים אותם — ומכאן גם המערות והנקרות בהר.\"},{\"id\":52,\"question\":\"כיצד נוצרה \\\"אשת לוט\\\"?\",\"category\":\"בקע ים המלח וגיאולוגיה של ארץ ישראל\",\"answers\":[{\"text\":\"תוצר של פעילות געשית קדומה\",\"correct\":false},{\"text\":\"עמוד מלח מבודד שנוצר מהמסה סלקטיבית של מלח בגשמים נדירים\",\"correct\":true},{\"text\":\"עמוד קוורציט שהתמיר מחום מאגמה\",\"correct\":false},{\"text\":\"התגבשות מלח סביב שריד ארכיאולוגי אנושי\",\"correct\":false}],\"topic\":\"christianity\"},{\"id\":53,\"question\":\"למה מתייחס המונח \\\"השבר הסורי-אפריקאי\\\"?\",\"category\":\"בקע ים המלח וגיאולוגיה של ארץ ישראל\",\"answers\":[{\"text\":\"מערכת שברים מהערבה דרך ים המלח והכנרת צפונה\",\"correct\":true},{\"text\":\"אזור סובדוקציה בין אפריקה לאירואסיה\",\"correct\":false},{\"text\":\"שרשרת הרי געש לאורך גבול סוריה\",\"correct\":false},{\"text\":\"שם נוסף לרכס המרכז-אטלנטי\",\"correct\":false}],\"topic\":\"geography\",\"explanation\":\"זהו קטע מהבקע הסורי-אפריקאי, שאורכו כ-6,000 ק\\\"מ ממוזמביק ועד טורקיה.\"},{\"id\":54,\"question\":\"היכן חשופים בישראל סלעי היסוד הקדומים ביותר (כמו גרניט וגנייס)?\",\"category\":\"בקע ים המלח וגיאולוגיה של ארץ ישראל\",\"answers\":[{\"text\":\"מישור החוף\",\"correct\":false},{\"text\":\"רמת הגולן\",\"correct\":false},{\"text\":\"הרי אילת בלבד\",\"correct\":true},{\"text\":\"הרי הגליל העליון\",\"correct\":false}],\"topic\":\"geography\"},{\"id\":55,\"question\":\"מדוע סלעי היסוד הקדומים בישראל חשופים רק בדרום הארץ (אילת) ולא בצפון?\",\"category\":\"בקע ים המלח וגיאולוגיה של ארץ ישראל\",\"answers\":[{\"text\":\"הרמה טקטונית שקילפה בדרום את שכבות המשקע\",\"correct\":true},{\"text\":\"הסלעים בצפון צעירים ולכן אינם קדומים כלל\",\"correct\":false},{\"text\":\"בצפון הארץ מעולם לא היו סלעי יסוד\",\"correct\":false},{\"text\":\"בדרום ירד גשם רב יותר ששחק את השכבות\",\"correct\":false}],\"explanation\":\"השילד הערבי-נובי הורם באזור אילת, והבליה חשפה את הגרניט והגנייס שמתחת לכיסוי המשקע.\",\"topic\":\"geology\"},{\"id\":56,\"question\":\"מהו \\\"האזור המנומר\\\" בבקעת חתרורים?\",\"category\":\"בקע ים המלח וגיאולוגיה של ארץ ישראל\",\"answers\":[{\"text\":\"אזור נחשפות מרהיב של קוורציט מתחת למכתש רמון\",\"correct\":false},{\"text\":\"אזור שבו נמצא הגרניט הוורוד היחיד בישראל\",\"correct\":false},{\"text\":\"תופעת התמרת שריפה (פירומטמורפיזם) נדירה שנוצרה מבעירה ספונטנית של פצלי שמן\",\"correct\":true},{\"text\":\"שם נוסף לתופעת הקרסט בגליל\",\"correct\":false}],\"topic\":\"geology\"},{\"id\":57,\"question\":\"לאיזו טמפרטורה בערך הגיעה השריפה התת-קרקעית שיצרה את \\\"האזור המנומר\\\" בחתרורים?\",\"category\":\"בקע ים המלח וגיאולוגיה של ארץ ישראל\",\"answers\":[{\"text\":\"כ-100 מעלות צלזיוס\",\"correct\":false},{\"text\":\"מעל 3,000 מעלות צלזיוס\",\"correct\":false},{\"text\":\"כ-400 מעלות צלזיוס\",\"correct\":false},{\"text\":\"מעל 1,100 מעלות צלזיוס\",\"correct\":true}],\"topic\":\"water-climate\"},{\"id\":59,\"question\":\"מהי גיאומורפולוגיה?\",\"category\":\"גיאומורפולוגיה\",\"answers\":[{\"text\":\"תורת צורות הנוף\",\"correct\":true},{\"text\":\"תורת סיווג הסלעים לפי הרכבם\",\"correct\":false},{\"text\":\"מדע חקר האקלים ההיסטורי\",\"correct\":false},{\"text\":\"מדע מיפוי הלוחות הטקטוניים\",\"correct\":false}],\"topic\":\"geology\",\"explanation\":\"היא מסבירה מדוע הנוף בכל מקום נראה כפי שהוא — שילוב של מבנה הסלע, הכוחות שפעלו עליו והאקלים.\"},{\"id\":60,\"question\":\"מהם שני סוגי הכוחות המעצבים את הנוף?\",\"category\":\"גיאומורפולוגיה\",\"answers\":[{\"text\":\"כוחות פנימיים וכוחות חיצוניים\",\"correct\":true},{\"text\":\"כוחות ביולוגיים וכוחות מגנטיים\",\"correct\":false},{\"text\":\"כוחות חום וכוחות קור\",\"correct\":false},{\"text\":\"כוחות אנושיים וכוחות ימיים\",\"correct\":false}],\"topic\":\"geology\",\"explanation\":\"הפנימיים (טקטוניקה, הרמה, געשיות) בונים תבליט; החיצוניים (בליה, סחיפה) מיישרים אותו.\"},{\"id\":61,\"question\":\"מהי בליה, ובמה היא שונה מסחיפה?\",\"category\":\"גיאומורפולוגיה\",\"answers\":[{\"text\":\"בליה וסחיפה הם שמות שונים לאותו תהליך בדיוק\",\"correct\":false},{\"text\":\"בליה מתרחשת רק מתחת למים, סחיפה רק ביבשה\",\"correct\":false},{\"text\":\"בליה היא הסעת חומר בלבד, ואילו סחיפה מתרחשת במקום\",\"correct\":false},{\"text\":\"בליה היא פירוק וקירוס הסלע במקום הימצאו, ללא הסעה — בשונה מסחיפה שמזיזה את החומר\",\"correct\":true}],\"topic\":\"geology\"},{\"id\":62,\"question\":\"מהם שלושת סוגי הבליה?\",\"category\":\"גיאומורפולוגיה\",\"answers\":[{\"text\":\"בליה ראשונית, בליה משנית ובליה שלישונית\",\"correct\":false},{\"text\":\"בליה יבשתית, בליה ימית ובליה אווירית\",\"correct\":false},{\"text\":\"בליה פיזיקלית-מכנית, בליה כימית ובליה ביולוגית\",\"correct\":true},{\"text\":\"בליה חמה, בליה קרה ובליה נייטרלית\",\"correct\":false}],\"topic\":\"geology\"},{\"id\":63,\"question\":\"איזו מהבאות היא דוגמה לבליה פיזיקלית-מכנית?\",\"category\":\"גיאומורפולוגיה\",\"answers\":[{\"text\":\"טריז קרח — קפיאה והפשרה חוזרת של מים בסדקי הסלע\",\"correct\":true},{\"text\":\"חדירת שורשי צמחים לסדקי הסלע\",\"correct\":false},{\"text\":\"המסת גיר על ידי מי גשמים חומציים\",\"correct\":false},{\"text\":\"חמצון מינרלים בסלע\",\"correct\":false}],\"topic\":\"geology\"},{\"id\":64,\"question\":\"איזו מהבאות היא דוגמה לבליה כימית?\",\"category\":\"גיאומורפולוגיה\",\"answers\":[{\"text\":\"המסה — התהליך העיקרי הפוגע בסלעי גיר ויוצר נופי קרסט\",\"correct\":true},{\"text\":\"התפשטות והתכווצות תרמית של הסלע\",\"correct\":false},{\"text\":\"פירוק הסלע ע\\\"י שורשי עצים\",\"correct\":false},{\"text\":\"גידול גבישי מלח בסדקי הסלע\",\"correct\":false}],\"topic\":\"geology\"},{\"id\":65,\"question\":\"באיזה סוג אקלים שולטת בליה פיזיקלית, ובאיזה שולטת בליה כימית?\",\"category\":\"גיאומורפולוגיה\",\"answers\":[{\"text\":\"פיזיקלית שולטת באזור צחיח; כימית שולטת באזור לח\",\"correct\":true},{\"text\":\"פיזיקלית שולטת באזור לח; כימית שולטת באזור צחיח\",\"correct\":false},{\"text\":\"האקלים אינו משפיע כלל על סוג הבליה\",\"correct\":false},{\"text\":\"שתיהן שולטות באותה מידה בכל אקלים\",\"correct\":false}],\"topic\":\"geology\"},{\"id\":66,\"question\":\"מהו קרסט?\",\"category\":\"גיאומורפולוגיה\",\"answers\":[{\"text\":\"חללים, נקרות ומערות המסה בסלע גיר\",\"correct\":true},{\"text\":\"גבעה מקומטת שנחשפה בבליה\",\"correct\":false},{\"text\":\"בקעה שקועה בין שני שברים\",\"correct\":false},{\"text\":\"סוג של סלע מגמטי כהה\",\"correct\":false}],\"topic\":\"geology\",\"explanation\":\"מי גשם חומציים קלות ממיסים את הקלציט; כך נוצרות מערות הנטיפים, הבולענים ושדות הקרסט.\"},{\"id\":67,\"question\":\"מהי סחיפה?\",\"category\":\"גיאומורפולוגיה\",\"answers\":[{\"text\":\"ניתוק החומר הבלוי והסעתו למקום אחר\",\"correct\":true},{\"text\":\"פירוק כימי של מינרלים במקומם\",\"correct\":false},{\"text\":\"התמצקות של מגמה על פני השטח\",\"correct\":false},{\"text\":\"שינוי סלע תחת חום ולחץ בעומק\",\"correct\":false}],\"topic\":\"geology\",\"explanation\":\"בליה מפוררת במקום, סחיפה מעבירה. בלי גורם מסיע — מים, רוח או כבידה — אין סחיפה.\"},{\"id\":68,\"question\":\"מהו הגורם המסיע החזק ביותר בטבע, גם באזורים מדבריים?\",\"category\":\"גיאומורפולוגיה\",\"answers\":[{\"text\":\"מים זורמים\",\"correct\":true},{\"text\":\"רוח\",\"correct\":false},{\"text\":\"כוח הכבידה\",\"correct\":false},{\"text\":\"קרינת השמש\",\"correct\":false}],\"explanation\":\"גם במדבר — דווקא שם — השיטפונות הנדירים מסיעים יותר חומר מכל גורם אחר.\",\"topic\":\"geography\"},{\"id\":69,\"question\":\"אילו צורות נוף בונה הרוח באמצעות סחיפה?\",\"category\":\"גיאומורפולוגיה\",\"answers\":[{\"text\":\"רכסי הרים תת-ימיים\",\"correct\":false},{\"text\":\"מכתשים ומערות קרסט\",\"correct\":false},{\"text\":\"מניפות סחף בפתחי ואדיות בלבד\",\"correct\":false},{\"text\":\"דיונות חול ולס\",\"correct\":true}],\"topic\":\"geology\"},{\"id\":70,\"question\":\"אילו תופעות במדרון נגרמות מכוח הכבידה כגורם מסיע?\",\"category\":\"גיאומורפולוגיה\",\"answers\":[{\"text\":\"יצירת עמודי בזלת משושים\",\"correct\":false},{\"text\":\"דיונות חול ולס\",\"correct\":false},{\"text\":\"מפולות, גלישות וזחילת קרקע\",\"correct\":true},{\"text\":\"היווצרות מערות קרסט\",\"correct\":false}],\"topic\":\"geology\"},{\"id\":71,\"question\":\"מהו בסיס הסחיפה?\",\"category\":\"גיאומורפולוגיה\",\"answers\":[{\"text\":\"המפלס שאליו נחל יכול להתחתר ולהעמיק\",\"correct\":true},{\"text\":\"נקודת המוצא של הנחל בהר\",\"correct\":false},{\"text\":\"השכבה הקשה ביותר ברצף הסלעים\",\"correct\":false},{\"text\":\"שכבת האטימות בתחתית אגן ההיקוות\",\"correct\":false}],\"topic\":\"geology\",\"explanation\":\"בסיס הסחיפה של נחלי מדבר יהודה הוא ים המלח — וירידת מפלסו מעמיקה אותם ומאיצה את הבולענים.\"},{\"id\":73,\"question\":\"מהם מרכיבי מערכת ניקוז אופיינית?\",\"category\":\"גיאומורפולוגיה\",\"answers\":[{\"text\":\"הורסט, גרבן, אנטיקלינה וסינקלינה\",\"correct\":false},{\"text\":\"רכס, מצוק, טראסה ומדרגה בלבד\",\"correct\":false},{\"text\":\"אגן היקוות, פרשת מים, ערוץ ראשי ויובלים\",\"correct\":true},{\"text\":\"דיאפיר, קרסט, לס ודיונה\",\"correct\":false}],\"topic\":\"geology\"},{\"id\":74,\"question\":\"מה גורם להיווצרות מצוקים, מדרגות וטראסות בנוף?\",\"category\":\"גיאומורפולוגיה\",\"answers\":[{\"text\":\"הפרשי קושי בין שכבות סלע שכנות\",\"correct\":true},{\"text\":\"המסה כימית של סלעי גרניט\",\"correct\":false},{\"text\":\"פעילות געשית לאורך קווי שבר\",\"correct\":false},{\"text\":\"רוח בלבד, ללא תלות במבנה הסלע\",\"correct\":false}],\"topic\":\"geology\",\"explanation\":\"שכבה קשה עומדת בפני הבליה ויוצרת מדף; הרכה שמתחתיה נסוגה — וכך נבנית מדרגה או מצוק.\"},{\"id\":75,\"question\":\"כיצד נוצר סלע מגמתי?\",\"category\":\"סלעים מגמטיים\",\"answers\":[{\"text\":\"משינוי סלע קיים במצב מוצק תחת חום ולחץ\",\"correct\":false},{\"text\":\"מהצטברות והתלכדות של פירורי סלע שנסחפו\",\"correct\":false},{\"text\":\"מהמסת מלח בתמיסה רוויה\",\"correct\":false},{\"text\":\"מהתמצקות (קריסטליזציה) של חומר מותך — מגמה או לבה\",\"correct\":true}],\"topic\":\"geology\"},{\"id\":76,\"question\":\"מה ההבדל בין מגמה ללבה?\",\"category\":\"סלעים מגמטיים\",\"answers\":[{\"text\":\"מגמה היא חומר מותך מתחת לפני השטח, ולבה היא חומר מותך שהגיע אל פני השטח\",\"correct\":true},{\"text\":\"מגמה ולבה הם שני מונחים זהים לחלוטין\",\"correct\":false},{\"text\":\"מגמה תמיד בהירה, לבה תמיד כהה\",\"correct\":false},{\"text\":\"לבה נמצאת רק בעומק, מגמה רק על פני השטח\",\"correct\":false}],\"topic\":\"geography\"},{\"id\":77,\"question\":\"מה ההבדל בין סלע פֶלזי לסלע מאפי?\",\"category\":\"סלעים מגמטיים\",\"answers\":[{\"text\":\"פלזי נוצר רק בים, מאפי רק ביבשה\",\"correct\":false},{\"text\":\"פלזי תמיד וולקני, מאפי תמיד פלוטוני\",\"correct\":false},{\"text\":\"פלזי בהיר ועשיר בסיליקה (כגון גרניט); מאפי כהה ודל בסיליקה (כגון בזלת)\",\"correct\":true},{\"text\":\"אין הבדל אמיתי בין השניים, זהו הבדל בשם בלבד\",\"correct\":false}],\"topic\":\"geology\"},{\"id\":78,\"question\":\"מהו הכלל בין תכולת הסיליקה במגמה לצמיגותה?\",\"category\":\"סלעים מגמטיים\",\"answers\":[{\"text\":\"תכולת הסיליקה אינה משפיעה על צמיגות המגמה\",\"correct\":false},{\"text\":\"ככל ששיעור הסיליקה גבוה יותר — המגמה נוזלית יותר\",\"correct\":false},{\"text\":\"ככל ששיעור הסיליקה גבוה יותר — המגמה צמיגה יותר וההתפרצות נפיצה יותר\",\"correct\":true},{\"text\":\"צמיגות המגמה תלויה רק בטמפרטורת האוויר\",\"correct\":false}],\"topic\":\"islam\"},{\"id\":79,\"question\":\"מהו סלע פלוטוני (סלע תהום)?\",\"category\":\"סלעים מגמטיים\",\"answers\":[{\"text\":\"סלע מגמתי שהתקרר לאט במעמקי כדור הארץ, עם גבישים גדולים (למשל גרניט, גברו)\",\"correct\":true},{\"text\":\"סלע מגמתי שהתקרר מהר על פני השטח, עם גבישים זעירים\",\"correct\":false},{\"text\":\"סלע מטמורפי שנוצר מהתמרת אזורית\",\"correct\":false},{\"text\":\"סלע משקע שנוצר בקרקעית האוקיינוס\",\"correct\":false}],\"topic\":\"geology\"},{\"id\":80,\"question\":\"מהו סלע וולקני (סלע פרץ)?\",\"category\":\"סלעים מגמטיים\",\"answers\":[{\"text\":\"סלע מגמטי שהתקרר מהר על פני השטח\",\"correct\":true},{\"text\":\"סלע מגמטי שהתקרר לאט בעומק\",\"correct\":false},{\"text\":\"סלע שנוצר מהתמרה אזורית של גרניט\",\"correct\":false},{\"text\":\"סלע שנוצר רק בקרקעית האוקיינוס\",\"correct\":false}],\"topic\":\"geology\",\"explanation\":\"הקירור המהיר אינו מאפשר גידול גבישים — ומכאן המרקם הזעיר של הבזלת או הזכוכיתי של האובסידיאן.\"},{\"id\":81,\"question\":\"מהו מרקם פורפירי?\",\"category\":\"סלעים מגמטיים\",\"answers\":[{\"text\":\"גבישים גדולים בתוך רקע של גבישים דקים\",\"correct\":true},{\"text\":\"גבישים בגודל אחיד לחלוטין בכל הסלע\",\"correct\":false},{\"text\":\"גבישים המסודרים בפסים מקבילים\",\"correct\":false},{\"text\":\"סלע זכוכיתי, ללא גבישים כלל\",\"correct\":false}],\"explanation\":\"המרקם מעיד על קירור בשני שלבים: איטי בעומק (הגבישים הגדולים) ומהיר אחרי התפרצות.\",\"topic\":\"geology\"},{\"id\":82,\"question\":\"מהו דייק?\",\"category\":\"סלעים מגמטיים\",\"answers\":[{\"text\":\"חדירה מגמתית אופקית המקבילה לשכבות הסלע\",\"correct\":false},{\"text\":\"חדירה מגמתית אנכית החוצה שכבות סלע קיימות\",\"correct\":true},{\"text\":\"שם נוסף לרכס מרכז-אוקייני\",\"correct\":false},{\"text\":\"עמוד בזלת משושה\",\"correct\":false}],\"topic\":\"geology\"},{\"id\":83,\"question\":\"מהו סיל?\",\"category\":\"סלעים מגמטיים\",\"answers\":[{\"text\":\"סוג של סלע משקע קלסטי\",\"correct\":false},{\"text\":\"מבנה קמור של שכבות מקומטות\",\"correct\":false},{\"text\":\"חדירה מגמתית אנכית החוצה שכבות סלע\",\"correct\":false},{\"text\":\"חדירה מגמתית אופקית המקבילה לשכבות הסלע הקיימות\",\"correct\":true}],\"topic\":\"geology\"},{\"id\":84,\"question\":\"מהי בזלת ומה טווח אחוז הסיליקה בה?\",\"category\":\"סלעים מגמטיים\",\"answers\":[{\"text\":\"סלע משקע קלסטי, ללא סיליקה כלל\",\"correct\":false},{\"text\":\"סלע מגמתי-פלוטוני פלזי, עם מעל 65% סיליקה\",\"correct\":false},{\"text\":\"סלע מטמורפי הנוצר מהתמרת אבן חול\",\"correct\":false},{\"text\":\"סלע מגמתי-וולקני מאפי, עם כ-45%–52% סיליקה\",\"correct\":true}],\"topic\":\"geology\"},{\"id\":86,\"question\":\"מהו המרקם האופייני לבזלת, ומדוע?\",\"category\":\"סלעים מגמטיים\",\"answers\":[{\"text\":\"מרקם אפינטי — גבישים זעירים מתחת ל-1 מ\\\"מ, עקב התקררות מהירה על פני השטח\",\"correct\":true},{\"text\":\"מרקם קלסטי — פירורי סלע מלוכדים\",\"correct\":false},{\"text\":\"מרקם פנריטי גס — גבישים גדולים הנראים בעין, עקב התקררות איטית בעומק\",\"correct\":false},{\"text\":\"מרקם פוליאטי — פסים מקבילים של מינרלים\",\"correct\":false}],\"topic\":\"geology\"},{\"id\":87,\"question\":\"מהן ה-vesicles (נקבוביות) המופיעות לעיתים בבזלת?\",\"category\":\"סלעים מגמטיים\",\"answers\":[{\"text\":\"חללים בסלע שנוצרים מכליאת גזים בעת התקררות מהירה של הלבה\",\"correct\":true},{\"text\":\"מאובנים של יצורים ימיים כלואים בסלע\",\"correct\":false},{\"text\":\"גבישי קוורץ גדולים המפוזרים בסלע\",\"correct\":false},{\"text\":\"סדקים הנוצרים מהתקררות איטית בעומק האדמה\",\"correct\":false}],\"topic\":\"geology\"},{\"id\":89,\"question\":\"היכן בישראל יש תצורות בזלת מסיביות ונרחבות, ומאיזו תקופה גיאולוגית?\",\"category\":\"סלעים מגמטיים\",\"answers\":[{\"text\":\"רמת הגולן, מהפליוקן ועד הפלייסטוקן המאוחר\",\"correct\":true},{\"text\":\"הרי יהודה, מהתקופה הקנומנית\",\"correct\":false},{\"text\":\"מישור החוף, מהתקופה ההולוקנית בלבד\",\"correct\":false},{\"text\":\"הרי אילת, מהפרקמבריון\",\"correct\":false}],\"topic\":\"geology\"},{\"id\":90,\"question\":\"כיצד נוצרו עמודי הבזלת המשושים בבריכת המשושים (נחל משושים)?\",\"category\":\"סלעים מגמטיים\",\"answers\":[{\"text\":\"התכווצות תרמית של לבה שהתקררה לאט\",\"correct\":true},{\"text\":\"שקיעת שכבות משקע דקות זו על גבי זו\",\"correct\":false},{\"text\":\"המסה כימית של סלע גיר לאורך זמן\",\"correct\":false},{\"text\":\"פיסול בידי אדם בתקופה הרומית\",\"correct\":false}],\"explanation\":\"בהתקררות מצטמצם נפח הלבה ונפתחים סדקים מצולעים — לרוב משושים — בניצב לפני הקירור.\",\"topic\":\"geology\"},{\"id\":91,\"question\":\"מהו ההרכב הכימי המאפיין את הגרניט?\",\"category\":\"סלעים מגמטיים\",\"answers\":[{\"text\":\"סלע פלסי, עשיר מאוד בסיליקה — מעל 65%\",\"correct\":true},{\"text\":\"סלע מאפי, דל בסיליקה — 45%–52%\",\"correct\":false},{\"text\":\"סלע המורכב בעיקרו מקלציט\",\"correct\":false},{\"text\":\"סלע נטול סיליקה לחלוטין\",\"correct\":false}],\"topic\":\"geology\"},{\"id\":92,\"question\":\"אילו מינרלים בונים את הגרניט, ואילו צבעים הם מעניקים לו?\",\"category\":\"סלעים מגמטיים\",\"answers\":[{\"text\":\"קוורץ, פלדספר, פלגיוקלז ומיקה\",\"correct\":true},{\"text\":\"אוליבין, פירוקסן, פלגיוקלז ומגנטיט\",\"correct\":false},{\"text\":\"קלציט, דולומיט, גבס והליט\",\"correct\":false},{\"text\":\"קוורץ, קלציט, חרסית ותחמוצות ברזל\",\"correct\":false}],\"explanation\":\"הפלדספר נותן לגרניט את הוורוד, הקוורץ אפור-שקוף, הפלגיוקלז לבן והמיקה שחורה. אוליבין ופירוקסן — אלו מינרלי הבזלת.\",\"topic\":\"geology\"},{\"id\":93,\"question\":\"כיצד נוצר סלע משקע, בקצרה?\",\"category\":\"סלעי משקע\",\"answers\":[{\"text\":\"השקעת פירורי סלע ודחיסתם לסלע מוצק\",\"correct\":true},{\"text\":\"התמצקות ישירה של מגמה על פני השטח\",\"correct\":false},{\"text\":\"שינוי סלע קיים תחת חום ולחץ בעומק\",\"correct\":false},{\"text\":\"התכה מלאה של סלע והתגבשותו מחדש\",\"correct\":false}],\"topic\":\"geology\",\"explanation\":\"השרשרת המלאה: בליה, סחיפה, הסעה, השקעה בשכבות, ולבסוף דחיסה וצמנטציה (דיאגנזה).\"},{\"id\":94,\"question\":\"מהן שלוש משפחות המשנה של סלעי המשקע?\",\"category\":\"סלעי משקע\",\"answers\":[{\"text\":\"קלסטיים, כימיים, ואורגניים/ביוגניים\",\"correct\":true},{\"text\":\"אזוריים, מגעיים, ופירומטמורפיים\",\"correct\":false},{\"text\":\"פלזיים, מאפיים, ואולטרה-מאפיים\",\"correct\":false},{\"text\":\"פלוטוניים, וולקניים, ומטמורפיים\",\"correct\":false}],\"topic\":\"geology\"},{\"id\":95,\"question\":\"איזה מהבאים הוא דוגמה לסלע משקע קלסטי?\",\"category\":\"סלעי משקע\",\"answers\":[{\"text\":\"גבס\",\"correct\":false},{\"text\":\"מלח\",\"correct\":false},{\"text\":\"אבן חול\",\"correct\":true},{\"text\":\"גיר\",\"correct\":false}],\"topic\":\"geology\"},{\"id\":96,\"question\":\"איזה מהבאים הוא דוגמה לסלע משקע אורגני/ביוגני?\",\"category\":\"סלעי משקע\",\"answers\":[{\"text\":\"אבן חול וקונגלומרט\",\"correct\":false},{\"text\":\"גרניט וגברו\",\"correct\":false},{\"text\":\"גבס ומלח\",\"correct\":false},{\"text\":\"גיר וקירטון\",\"correct\":true}],\"topic\":\"geology\"},{\"id\":97,\"question\":\"מהו המינרל המרכיב העיקרי של אבן הגיר?\",\"category\":\"סלעי משקע\",\"answers\":[{\"text\":\"דולומיט — פחמת סידן ומגנזיום\",\"correct\":false},{\"text\":\"קלציט — סידן פחמתי (CaCO₃)\",\"correct\":true},{\"text\":\"הליט — נתרן כלורי\",\"correct\":false},{\"text\":\"קוורץ — תחמוצת סיליקון\",\"correct\":false}],\"topic\":\"geology\"},{\"id\":98,\"question\":\"באיזו סביבה נוצר גיר בדרך כלל?\",\"category\":\"סלעי משקע\",\"answers\":[{\"text\":\"ים רדוד, חם ועשיר בבעלי חיים ימיים (צדפות, אלמוגים)\",\"correct\":true},{\"text\":\"ים עמוק, שקט ופתוח, מהצטברות פיטופלנקטון\",\"correct\":false},{\"text\":\"מדבר יבשתי רחוק מכל גוף מים\",\"correct\":false},{\"text\":\"אגם צחיח בתהליך התאדות אינטנסיבית\",\"correct\":false}],\"topic\":\"christianity\"},{\"id\":99,\"question\":\"באיזו סביבה נוצר קירטון בדרך כלל?\",\"category\":\"סלעי משקע\",\"answers\":[{\"text\":\"ים עמוק ושקט, מהצטברות שלדי אצות\",\"correct\":true},{\"text\":\"ים רדוד עשיר בצדפות ואלמוגים\",\"correct\":false},{\"text\":\"אגם מלוח שהתאדה עד יובש\",\"correct\":false},{\"text\":\"ערוץ נהר יבשתי מהיר זרימה\",\"correct\":false}],\"topic\":\"christianity\",\"explanation\":\"הקירטון בנוי משלדי קוקוליתופורים — אצות חד-תאיות זעירות ששקעו לקרקעית ים פתוח.\"},{\"id\":100,\"question\":\"מה ההבדל המרכזי בין גיר לקירטון?\",\"category\":\"סלעי משקע\",\"answers\":[{\"text\":\"קירטון רך, לבן ונקבובי; גיר קשה יותר\",\"correct\":true},{\"text\":\"קירטון קשה ואפור; גיר רך ולבן בוהק\",\"correct\":false},{\"text\":\"גיר תוסס בחומצה וקירטון אינו תוסס\",\"correct\":false},{\"text\":\"שניהם באותה קשיות ונבדלים רק בצבע\",\"correct\":false}],\"explanation\":\"שניהם קלציט ושניהם תוססים בחומצה. על קירטון נוצרת לרוב קרום נארי קשה — ולכן הוא מופיע במדרונות מדורגים.\",\"topic\":\"geology\"},{\"id\":101,\"question\":\"היכן בישראל בולט הקירטון הלבן הבוהק בנוף?\",\"category\":\"סלעי משקע\",\"answers\":[{\"text\":\"הרי אילת בלבד\",\"correct\":false},{\"text\":\"מצוקי ראש הנקרה ומערות בית גוברין\",\"correct\":true},{\"text\":\"בקעת הירדן ליד בית שאן\",\"correct\":false},{\"text\":\"רמת הגולן והגליל התחתון\",\"correct\":false}],\"topic\":\"geography\"},{\"id\":102,\"question\":\"מהו מבחן הזיהוי המשותף לגיר ולקירטון בשטח?\",\"category\":\"סלעי משקע\",\"answers\":[{\"text\":\"מבחן מגנטיות באמצעות מצפן\",\"correct\":false},{\"text\":\"טעם מלוח מובהק בליקוק\",\"correct\":false},{\"text\":\"היעדר מוחלט של תגובה לחומצה\",\"correct\":false},{\"text\":\"תסיסה חזקה ומידית בטפטוף חומצה מלחית מהולה (5%–10%)\",\"correct\":true}],\"topic\":\"geology\"},{\"id\":103,\"question\":\"מהו ההרכב הכימי של סלע הדולומיט?\",\"category\":\"סלעי משקע\",\"answers\":[{\"text\":\"נתרן כלורי — NaCl\",\"correct\":false},{\"text\":\"תחמוצת סיליקון — SiO₂\",\"correct\":false},{\"text\":\"פחמת סידן ומגנזיום — CaMg(CO₃)₂\",\"correct\":true},{\"text\":\"סידן פחמתי טהור — CaCO₃\",\"correct\":false}],\"topic\":\"geology\"},{\"id\":104,\"question\":\"כיצד נוצר הדולומיט?\",\"category\":\"סלעי משקע\",\"answers\":[{\"text\":\"החלפת יוני סידן ביוני מגנזיום בסלע גירי קיים\",\"correct\":true},{\"text\":\"השקעה ישירה מתוך מי ים חמים ורדודים\",\"correct\":false},{\"text\":\"התמצקות מגמה עשירה במגנזיום בעומק\",\"correct\":false},{\"text\":\"התמרה תרמית של אבן גיר בקרבת חדירה\",\"correct\":false}],\"explanation\":\"דולומיטיזציה היא תהליך משני: כמחצית מיוני הסידן בבוץ הגירי מוחלפים במגנזיום מתמיסות.\",\"topic\":\"geology\"},{\"id\":105,\"question\":\"מה קשיות הדולומיט בסולם מוס לעומת קלציט, ומה משמעות ההבדל בשטח?\",\"category\":\"סלעי משקע\",\"answers\":[{\"text\":\"דולומיט 1 לעומת קלציט 8 — הדולומיט רך בהרבה מקלציט\",\"correct\":false},{\"text\":\"שניהם באותה קשיות בדיוק, 5 בסולם מוס\",\"correct\":false},{\"text\":\"דולומיט הוא הרך ביותר מכל סלעי המשקע, קשיות 1\",\"correct\":false},{\"text\":\"דולומיט 3.5–4 לעומת קלציט 3 — לכן הדולומיט עמיד יותר לבליה ובונה מצוקים תלולים\",\"correct\":true}],\"topic\":\"geology\"},{\"id\":106,\"question\":\"מהו מבחן הזיהוי הייחודי לדולומיט (המבדיל אותו מגיר)?\",\"category\":\"סלעי משקע\",\"answers\":[{\"text\":\"אינו תוסס בחומצה קרה\",\"correct\":true},{\"text\":\"תוסס בחומצה קרה בעוצמה רבה מגיר\",\"correct\":false},{\"text\":\"משנה צבעו לירוק במגע עם חומצה\",\"correct\":false},{\"text\":\"אינו מגיב לחומצה בשום תנאי\",\"correct\":false}],\"explanation\":\"כותשים אותו לאבקה או מחממים את החומצה — ואז גם הדולומיט תוסס. זה המבחן שמבדיל אותו מגיר בשטח.\",\"topic\":\"geology\"},{\"id\":107,\"question\":\"כיצד כינו חוצבים ובנאים ערבים בירושלים את הדולומיט האפור והקשה?\",\"category\":\"סלעי משקע\",\"answers\":[{\"text\":\"\\\"אבן החכמים\\\"\",\"correct\":false},{\"text\":\"\\\"אבן הזהב\\\"\",\"correct\":false},{\"text\":\"\\\"מיזי יהודי\\\" (אבן היהודים), כמשל לעקשנות\",\"correct\":true},{\"text\":\"\\\"מיזי אחמר\\\" בלבד (ללא הבחנה מהגרסה האפורה)\",\"correct\":false}],\"topic\":\"jerusalem\"},{\"id\":109,\"question\":\"מהו מקור הצבעים העזים (אדום, צהוב, ורוד) באבן החול הנוביתית בדרום הארץ?\",\"category\":\"סלעי משקע\",\"answers\":[{\"text\":\"ציפוי תחמוצות ברזל סביב גרגרי הקוורץ\",\"correct\":true},{\"text\":\"מלחי נחושת שהושקעו מתמיסות ימיות\",\"correct\":false},{\"text\":\"חימום בהתמרת מגע שצבע את הסלע\",\"correct\":false},{\"text\":\"גרגרי הקוורץ עצמם צבעוניים בטבעם\",\"correct\":false}],\"explanation\":\"הגרגרים לבנים; המטיט ולימוניט עוטפים אותם ונותנים את האדום, הצהוב והוורוד של אבן החול הנובית.\",\"topic\":\"geology\"},{\"id\":110,\"question\":\"כיצד נוצרה תופעת \\\"הפטרייה\\\" בבקעת תמנע?\",\"category\":\"סלעי משקע\",\"answers\":[{\"text\":\"בליה דיפרנציאלית: כובע קשה מגן על רגל רכה\",\"correct\":true},{\"text\":\"התכווצות בזלת שהתקררה בצורת פטרייה\",\"correct\":false},{\"text\":\"המסה כימית של דולומיט לאורך אלפי שנים\",\"correct\":false},{\"text\":\"שחיקת גלים בים קדום שכיסה את האזור\",\"correct\":false}],\"explanation\":\"החול שהרוח נושאת שוחק את אבן החול הפריכה שבבסיס, בעוד שכבת הקונגלומרט הקשה שמעליה עומדת בפני הבליה.\",\"topic\":\"geology\"},{\"id\":112,\"question\":\"מהו סלע ההתאדות (אוופוריט) העיקרי הנחשף בהר סדום, וממה הוא מורכב?\",\"category\":\"סלעי משקע\",\"answers\":[{\"text\":\"גיר — סידן פחמתי (CaCO₃)\",\"correct\":false},{\"text\":\"בזלת — סלע מאפי כהה\",\"correct\":false},{\"text\":\"קוורציט — תחמוצת סיליקון\",\"correct\":false},{\"text\":\"מלח (הליט) — נתרן כלורי (NaCl)\",\"correct\":true}],\"topic\":\"geology\"},{\"id\":113,\"question\":\"מה קשיות המלח (הליט) בסולם מוס, וכיצד מזהים אותו בשטח?\",\"category\":\"סלעי משקע\",\"answers\":[{\"text\":\"קשיות 9 — קשה מאוד ולא נשרט אפילו במתכת\",\"correct\":false},{\"text\":\"קשיות 1 — כמעט נוזלי במגע\",\"correct\":false},{\"text\":\"קשיות 2.5 — רך מאוד, נחרץ בציפורן, בעל טעם מלוח מובהק וגביש קובייתי\",\"correct\":true},{\"text\":\"קשיות 5 — קשיות בינונית, ללא טעם מובהק\",\"correct\":false}],\"topic\":\"flora-fauna\"},{\"id\":115,\"question\":\"כיצד נוצר סלע מטמורפי?\",\"category\":\"סלעים מטמורפיים\",\"answers\":[{\"text\":\"שינוי סלע קיים במצב מוצק בשל חום ולחץ\",\"correct\":true},{\"text\":\"התמצקות של מגמה שקפאה לאט בעומק\",\"correct\":false},{\"text\":\"התכה מלאה של סלע והתגבשותו מחדש\",\"correct\":false},{\"text\":\"התלכדות פירורי סלע שנסחפו והושקעו\",\"correct\":false}],\"explanation\":\"ההבחנה המרכזית: בהתמרה הסלע אינו נמס. אם הוא נמס — נוצרה מגמה, והתוצר יהיה סלע מגמטי.\",\"topic\":\"geology\"},{\"id\":116,\"question\":\"מהם שני סוגי המטמורפיזם העיקריים?\",\"category\":\"סלעים מטמורפיים\",\"answers\":[{\"text\":\"מטמורפיזם אזורי ומטמורפיזם מגע\",\"correct\":true},{\"text\":\"מטמורפיזם ימי ומטמורפיזם יבשתי\",\"correct\":false},{\"text\":\"מטמורפיזם ראשוני ומטמורפיזם משני\",\"correct\":false},{\"text\":\"מטמורפיזם חם ומטמורפיזם קר\",\"correct\":false}],\"explanation\":\"אזורי — בעומק ובשטח נרחב, בזמן בניית הרים; מגע — מקומי, בשולי גוף מגמתי שחדר לסלע.\",\"topic\":\"geography\"},{\"id\":117,\"question\":\"לאיזה סלע הופך גיר בתהליך התמרה?\",\"category\":\"סלעים מטמורפיים\",\"answers\":[{\"text\":\"גנייס\",\"correct\":false},{\"text\":\"קוורציט\",\"correct\":false},{\"text\":\"שיש\",\"correct\":true},{\"text\":\"בזלת\",\"correct\":false}],\"topic\":\"geology\"},{\"id\":118,\"question\":\"לאיזה סלע הופכת אבן חול בתהליך התמרה?\",\"category\":\"סלעים מטמורפיים\",\"answers\":[{\"text\":\"גרניט\",\"correct\":false},{\"text\":\"קוורציט\",\"correct\":true},{\"text\":\"שיש\",\"correct\":false},{\"text\":\"דולומיט\",\"correct\":false}],\"topic\":\"geology\"},{\"id\":119,\"question\":\"לאיזה סלע הופך גרניט בתהליך התמרה אזורית בדרגה גבוהה?\",\"category\":\"סלעים מטמורפיים\",\"answers\":[{\"text\":\"שיש\",\"correct\":false},{\"text\":\"גנייס\",\"correct\":true},{\"text\":\"קירטון\",\"correct\":false},{\"text\":\"קוורציט\",\"correct\":false}],\"topic\":\"geology\"},{\"id\":120,\"question\":\"לאיזה סלע הופכת חרסית בתהליך התמרה מתקדם?\",\"category\":\"סלעים מטמורפיים\",\"answers\":[{\"text\":\"צפחה, ובהמשך גנייס\",\"correct\":true},{\"text\":\"אבן חול, ובהמשך קוורציט\",\"correct\":false},{\"text\":\"גיר, ובהמשך שיש\",\"correct\":false},{\"text\":\"בזלת, ובהמשך גברו\",\"correct\":false}],\"explanation\":\"לכל סלע מוצא סדרת התמרה משלו: חרסית ← צפחה ← גנייס, גיר ← שיש, אבן חול ← קוורציט.\",\"topic\":\"second-temple\"},{\"id\":121,\"question\":\"מהי פוליאציה?\",\"category\":\"סלעים מטמורפיים\",\"answers\":[{\"text\":\"סידור המינרלים בפסים מקבילים בסלע מותמר\",\"correct\":true},{\"text\":\"התכווצות סלע וולקני לעמודים מצולעים\",\"correct\":false},{\"text\":\"השקעת שכבות משקע אופקיות בקרקעית ים\",\"correct\":false},{\"text\":\"ציפוי של תחמוצות ברזל על פני הסלע\",\"correct\":false}],\"explanation\":\"הפסים נערכים בניצב לכיוון הלחץ — ולכן הפוליאציה בגנייס מעידה על כיוון הכוחות שפעלו.\",\"topic\":\"geology\"},{\"id\":122,\"question\":\"כיצד ניתן להבחין בשטח בין קוורציט לאבן חול רגילה?\",\"category\":\"סלעים מטמורפיים\",\"answers\":[{\"text\":\"בקוורציט השבר עובר דרך הגרגרים והוא אינו מתפורר\",\"correct\":true},{\"text\":\"אבן חול קשה יותר ואינה נשרטת במסמר\",\"correct\":false},{\"text\":\"קוורציט תוסס בחומצה ואבן חול אינה תוססת\",\"correct\":false},{\"text\":\"קוורציט תמיד לבן ואבן חול תמיד אדומה\",\"correct\":false}],\"explanation\":\"בהתמרה נעלם המלט שבין הגרגרים והם מתאחים; לכן קוורציט קשה מאוד ואינו משאיר חול על היד.\",\"topic\":\"roman-byzantine\"},{\"id\":123,\"question\":\"מהו \\\"המנסרה\\\" במכתש רמון, וכיצד נוצרה?\",\"category\":\"סלעים מטמורפיים\",\"answers\":[{\"text\":\"עמודי קוורציט שנוצרו בהתמרת מגע\",\"correct\":true},{\"text\":\"עמודי בזלת שהתקררו והתכווצו\",\"correct\":false},{\"text\":\"שרשרת קמרים קטנים בשולי המכתש\",\"correct\":false},{\"text\":\"מבנה שנחצב בידי הנבטים בדרך הבשמים\",\"correct\":false}],\"explanation\":\"גוף מגמתי \\\"אפה\\\" שכבות אבן חול והתמיר אותן לקוורציט; בהתקררות הן נסדקו לעמודים מצולעים.\",\"topic\":\"state\"},{\"id\":125,\"question\":\"היכן בישראל חשוף הגנייס?\",\"category\":\"סלעים מטמורפיים\",\"answers\":[{\"text\":\"בהרי אילת בלבד\",\"correct\":true},{\"text\":\"לאורך שדרת ההר המרכזית\",\"correct\":false},{\"text\":\"בהרי הגליל ובכרמל\",\"correct\":false},{\"text\":\"ברמת הגולן ובמכתש רמון\",\"correct\":false}],\"explanation\":\"תצורת \\\"גנייס רודד\\\" בהר שלמה ובנחלי רודד ושלמה — החשיפה היחידה בישראל של סלעי יסוד מותמרים.\",\"topic\":\"geography\"},{\"id\":127,\"question\":\"כיצד נוצר שיש, ומה קורה למאובנים ולנקבוביות שהיו בסלע המקורי?\",\"category\":\"סלעים מטמורפיים\",\"answers\":[{\"text\":\"מהתאדות מי ים עתירי סידן; הנקבוביות דווקא גדלות\",\"correct\":false},{\"text\":\"מהתמצקות ישירה של מגמה עתירת קלציט; אין קשר לגיר\",\"correct\":false},{\"text\":\"מבליה כימית של גרניט; המאובנים נשמרים במלואם\",\"correct\":false},{\"text\":\"מהתמרה אזורית של אבן גיר או דולומיט; התהליך מוחק כליל את המאובנים והנקבוביות המקוריים\",\"correct\":true}],\"topic\":\"state\"},{\"id\":128,\"question\":\"האם קיימים בישראל מחצבי שיש טבעי קלאסי?\",\"category\":\"סלעים מטמורפיים\",\"answers\":[{\"text\":\"לא — כל השיש האמיתי שבארץ מיובא\",\"correct\":true},{\"text\":\"כן, בהרי אילת, לצד הגרניט\",\"correct\":false},{\"text\":\"כן, במכתש רמון, בשולי הגוף המגמתי\",\"correct\":false},{\"text\":\"כן, בגליל, בשולי גושי הבזלת\",\"correct\":false}],\"explanation\":\"מה שקרוי בארץ \\\"שיש\\\" הוא לרוב אבן גיר או דולומיט מלוטשים, או משטח סינתטי — ולא שיש גיאולוגי.\",\"topic\":\"state\"},{\"id\":129,\"question\":\"מהי \\\"האזור המנומר\\\" בבקעת חתרורים מבחינת תהליך היווצרותו?\",\"category\":\"סלעים מטמורפיים\",\"answers\":[{\"text\":\"התמרת שריפה של פצלי שמן בתת-הקרקע\",\"correct\":true},{\"text\":\"התמרה אזורית עקב לחץ טקטוני עז\",\"correct\":false},{\"text\":\"פגיעת מטאוריט שהתיכה את הסלע\",\"correct\":false},{\"text\":\"זרם לבה שקפא על גבי שכבת הקירטון\",\"correct\":false}],\"explanation\":\"בעירה ספונטנית וממושכת של פצלי השמן צרפה את הקירטון והגיר שמעליהם — פירומטמורפיזם, תופעה נדירה בעולם.\",\"topic\":\"geography\"},{\"id\":130,\"question\":\"מיהי החוקרת שפרסמה ב-1977 מונוגרפיה וזיהתה מעל 120 מינרלים שונים באזור המנומר בחתרורים?\",\"category\":\"סלעים מטמורפיים\",\"answers\":[{\"text\":\"עדה יונת\",\"correct\":false},{\"text\":\"מרי לאונס\",\"correct\":false},{\"text\":\"שולמית גרוס\",\"correct\":true},{\"text\":\"רחל כרמי\",\"correct\":false}],\"topic\":\"geology\"},{\"id\":131,\"question\":\"אילו מינרלים חדשים למדע התגלו באזור המנומר בחתרורים?\",\"category\":\"סלעים מטמורפיים\",\"answers\":[{\"text\":\"יהלום, זהב ופלטינה\",\"correct\":false},{\"text\":\"הליט ואנהידריט בלבד\",\"correct\":false},{\"text\":\"קוורץ, קלציט ופלדספר\",\"correct\":false},{\"text\":\"בנטוריט, יהלימיט, חתרוריט ושולמיטיט\",\"correct\":true}],\"topic\":\"geology\"},{\"id\":132,\"question\":\"לאיזה תהליך תעשייתי מודרני זהה התהליך הטבעי שיצר את האזור המנומר בחתרורים?\",\"category\":\"סלעים מטמורפיים\",\"answers\":[{\"text\":\"עיבוד נפט גולמי\",\"correct\":false},{\"text\":\"ייצור זכוכית ממלט חול\",\"correct\":false},{\"text\":\"התכת ברזל בכור גבוה\",\"correct\":false},{\"text\":\"ייצור צמנט (מלט) פורטלנד בכבשנים\",\"correct\":true}],\"topic\":\"state\"},{\"id\":133,\"question\":\"מהן שלוש המשפחות העיקריות שאליהן שייך כל סלע?\",\"category\":\"מחזור הסלעים\",\"answers\":[{\"text\":\"מגמטיים, משקע, ומטמורפיים\",\"correct\":true},{\"text\":\"קדומים, בינוניים, וצעירים\",\"correct\":false},{\"text\":\"פלוטוניים, וולקניים, ואוופוריטיים בלבד\",\"correct\":false},{\"text\":\"יבשתיים, ימיים, ואוויריים\",\"correct\":false}],\"topic\":\"geology\"},{\"id\":134,\"question\":\"מה מוביל בדרך כלל מסלע מגמטי לסלע משקע במחזור הסלעים?\",\"category\":\"מחזור הסלעים\",\"answers\":[{\"text\":\"בליה, סחיפה והשקעה\",\"correct\":true},{\"text\":\"היתוך מלא\",\"correct\":false},{\"text\":\"פעילות רעידות אדמה בלבד\",\"correct\":false},{\"text\":\"חום ולחץ בלבד\",\"correct\":false}],\"topic\":\"geology\"},{\"id\":135,\"question\":\"מה גורם לסלע (מכל סוג) להפוך לסלע מטמורפי במחזור הסלעים?\",\"category\":\"מחזור הסלעים\",\"answers\":[{\"text\":\"פירוק ביולוגי ע\\\"י שורשי צמחים\",\"correct\":false},{\"text\":\"חום ולחץ, ללא התכה מלאה\",\"correct\":true},{\"text\":\"בליה כימית בלבד\",\"correct\":false},{\"text\":\"התאדות מי ים\",\"correct\":false}],\"topic\":\"geology\"},{\"id\":136,\"question\":\"מה מוביל מסלע מטמורפי בחזרה למגמה במחזור הסלעים?\",\"category\":\"מחזור הסלעים\",\"answers\":[{\"text\":\"בליה פיזיקלית\",\"correct\":false},{\"text\":\"צמנטציה והרבדה\",\"correct\":false},{\"text\":\"היתוך (התכה מלאה)\",\"correct\":true},{\"text\":\"המסה בחומצה מלחית\",\"correct\":false}],\"topic\":\"geology\"},{\"id\":138,\"question\":\"מהי נקודת מוצא נפוצה מאוד במחזור הסלעים?\",\"category\":\"מחזור הסלעים\",\"answers\":[{\"text\":\"סלע מטמורפי בלבד\",\"correct\":false},{\"text\":\"רק סלעי אוופוריט כמו מלח\",\"correct\":false},{\"text\":\"סלע מגמתי (התמצקות מגמה)\",\"correct\":true},{\"text\":\"אין נקודת מוצא — המחזור מתחיל תמיד מחדש מהאפס\",\"correct\":false}],\"topic\":\"geology\"},{\"id\":139,\"question\":\"אילו שני סוגי כוחות מחברת ביניהם תופעת מחזור הסלעים?\",\"category\":\"מחזור הסלעים\",\"answers\":[{\"text\":\"כוחות ביולוגיים בלבד\",\"correct\":false},{\"text\":\"כוחות פנימיים (חום, לחץ) וכוחות חיצוניים (בליה, שחיקה)\",\"correct\":true},{\"text\":\"כוחות מגנטיים וכוחות חשמליים בלבד\",\"correct\":false},{\"text\":\"אין קשר בין כוחות פנימיים לחיצוניים במחזור הסלעים\",\"correct\":false}],\"topic\":\"geology\"},{\"id\":140,\"question\":\"מה קורה לסלע משקע שנקבר בעומק ונחשף לתנאי לחץ וחום קיצוניים?\",\"category\":\"מחזור הסלעים\",\"answers\":[{\"text\":\"הוא הופך לסלע מטמורפי\",\"correct\":true},{\"text\":\"הוא נעלם ואינו הופך לשום דבר\",\"correct\":false},{\"text\":\"הוא נשאר סלע משקע ללא כל שינוי\",\"correct\":false},{\"text\":\"הוא הופך מיידית למגמה נוזלית\",\"correct\":false}],\"topic\":\"geology\"},{\"id\":141,\"question\":\"מהי הבעיה המדעית ב\\\"שיש חברון\\\", \\\"שיש מצפה\\\" ו\\\"אבן חלילה\\\"?\",\"category\":\"טעויות נפוצות ומונחים מסחריים\",\"answers\":[{\"text\":\"אלו אבני גיר או דולומיט שלא עברו התמרה\",\"correct\":true},{\"text\":\"אלו סלעים מגמטיים שהתקררו מהר מדי\",\"correct\":false},{\"text\":\"אלו סוגי שיש אמיתיים, כמו שיש קרארה\",\"correct\":false},{\"text\":\"אלו חומרים סינתטיים ללא מקור טבעי\",\"correct\":false}],\"topic\":\"geology\",\"explanation\":\"בענף האבן \\\"שיש\\\" הוא כל אבן שאפשר ללטש. גיאולוגית, שיש הוא רק גיר שעבר התמרה.\"},{\"id\":142,\"question\":\"מדוע המונח \\\"שיש גרניט\\\" הוא אוקסימורון מדעי?\",\"category\":\"טעויות נפוצות ומונחים מסחריים\",\"answers\":[{\"text\":\"גרניט הוא סלע מגמתי-פלוטוני קשה ביותר, בעוד ששיש אמיתי הוא סלע מטמורפי רך יותר\",\"correct\":true},{\"text\":\"גרניט הוא בעצם שם נרדף מדויק לשיש\",\"correct\":false},{\"text\":\"אין קשר בין המונחים כלל, אך הם אינם סותרים זה את זה\",\"correct\":false},{\"text\":\"גרניט רך יותר משיש, ולכן אינו יכול להיקרא כך\",\"correct\":false}],\"topic\":\"geology\"},{\"id\":143,\"question\":\"מהי \\\"אבן קיסר\\\" מבחינה גיאולוגית?\",\"category\":\"טעויות נפוצות ומונחים מסחריים\",\"answers\":[{\"text\":\"חומר סינתטי מקוורץ טחון ומשרפים\",\"correct\":true},{\"text\":\"סוג נדיר של שיש טבעי מהגליל\",\"correct\":false},{\"text\":\"סלע מטמורפי שנוצר מהתמרת קוורציט\",\"correct\":false},{\"text\":\"אבן גיר קשה במיוחד ממחצבות הנגב\",\"correct\":false}],\"explanation\":\"כ-90% גבישי קוורץ טחונים בתוספת דבקים ופיגמנטים. זה מוצר תעשייתי, לא סלע.\",\"topic\":\"geology\"},{\"id\":144,\"question\":\"היכן פותחה \\\"אבן קיסר\\\" (Caesarstone)?\",\"category\":\"טעויות נפוצות ומונחים מסחריים\",\"answers\":[{\"text\":\"בהרי אילת\",\"correct\":false},{\"text\":\"בקיבוץ שדות ים\",\"correct\":true},{\"text\":\"באיטליה, ליד קרארה\",\"correct\":false},{\"text\":\"בבקעת תמנע\",\"correct\":false}],\"topic\":\"geography\"},{\"id\":145,\"question\":\"מהי ההגדרה הגיאולוגית המדויקת של שיש אמיתי?\",\"category\":\"טעויות נפוצות ומונחים מסחריים\",\"answers\":[{\"text\":\"חומר בנייה סינתטי מבוסס קוורץ\",\"correct\":false},{\"text\":\"סלע מגמתי-וולקני כהה\",\"correct\":false},{\"text\":\"סלע משקע כימי שנוצר מהתאדות\",\"correct\":false},{\"text\":\"סלע מטמורפי שנוצר מהתמרת אבן גיר או דולומיט\",\"correct\":true}],\"topic\":\"geology\"},{\"id\":146,\"question\":\"מהי הנקודה הקריטית שכדאי לזכור לבחינה לגבי שיש בישראל?\",\"category\":\"טעויות נפוצות ומונחים מסחריים\",\"answers\":[{\"text\":\"כל השיש בישראל מקומי, ולא קיים שיש מיובא\",\"correct\":false},{\"text\":\"שיש נמצא בישראל אך ורק במכתש רמון\",\"correct\":false},{\"text\":\"שיש נמצא בישראל רק בצפון הארץ\",\"correct\":false},{\"text\":\"אין בישראל מחצבי שיש טבעי קלאסי כלל — כל השיש האמיתי מיובא\",\"correct\":true}],\"topic\":\"geology\"},{\"id\":147,\"question\":\"איזה שיש איטלקי מפורסם שימש את מיכלאנג'לו לפיסול הדוד?\",\"category\":\"טעויות נפוצות ומונחים מסחריים\",\"answers\":[{\"text\":\"שיש חברון\",\"correct\":false},{\"text\":\"שיש רודד\",\"correct\":false},{\"text\":\"שיש קרארה\",\"correct\":true},{\"text\":\"שיש נובי\",\"correct\":false}],\"topic\":\"geography\"},{\"id\":149,\"question\":\"מה ההבדל הפיזי המרכזי בין אבן גיר לשיש אמיתי, שיכול לעזור למורה דרך לזהות בשטח?\",\"category\":\"טעויות נפוצות ומונחים מסחריים\",\"answers\":[{\"text\":\"גיר נקבובי ולעיתים מכיל מאובנים; שיש אחיד וצפוף\",\"correct\":true},{\"text\":\"גיר קשה יותר משיש ואינו נשרט במסמר\",\"correct\":false},{\"text\":\"שיש נקבובי יותר מגיר וסופג נוזלים\",\"correct\":false},{\"text\":\"שניהם תוססים בחומצה ואין להבחין ביניהם\",\"correct\":false}],\"explanation\":\"שיש הוא גיר שעבר התמרה: הגבישים גדלו, הנקבוביות נסגרה והמאובנים נמחקו.\",\"topic\":\"geology\"},{\"id\":150,\"question\":\"מהי \\\"שיש בזלת\\\" מבחינה גיאולוגית?\",\"category\":\"טעויות נפוצות ומונחים מסחריים\",\"answers\":[{\"text\":\"שם אחר לקוורציט הכהה מהמנסרה\",\"correct\":false},{\"text\":\"מונח מסחרי שגוי ללוח בזלת מלוטש — סלע מגמתי-וולקני, לא שיש\",\"correct\":true},{\"text\":\"סוג נדיר של שיש כהה שמקורו בבזלת מותמרת\",\"correct\":false},{\"text\":\"תערובת של בזלת וקלציט טבעית\",\"correct\":false}],\"topic\":\"geology\"},{\"id\":151,\"question\":\"מה ההבדל בעמידות בין גרניט לשיש בשימוש כמשטחי מטבח?\",\"category\":\"טעויות נפוצות ומונחים מסחריים\",\"answers\":[{\"text\":\"גרניט קשה מאוד ועמיד לשריטות; שיש רך יותר ורגיש יותר לשריטות ולחומצות\",\"correct\":true},{\"text\":\"שיש קשה יותר מגרניט ועמיד יותר לשריטות\",\"correct\":false},{\"text\":\"שני החומרים זהים לחלוטין בעמידותם\",\"correct\":false},{\"text\":\"גרניט נמס בקלות ממגע עם מים, שיש לא\",\"correct\":false}],\"topic\":\"christianity\"},{\"id\":152,\"question\":\"מהם הכלים הפשוטים שמורה דרך יכול להשתמש בהם כדי להבחין בשטח בין גרניט לגיר/דולומיט?\",\"category\":\"טעויות נפוצות ומונחים מסחריים\",\"answers\":[{\"text\":\"מבחן חומצה ומבחן שריטה במתכת\",\"correct\":true},{\"text\":\"מבחן מגנטיות ומבחן משקל סגולי\",\"correct\":false},{\"text\":\"מבחן טעם ומבחן ריח של הסלע\",\"correct\":false},{\"text\":\"אין מבחן שדה — נדרשת בדיקת מעבדה\",\"correct\":false}],\"explanation\":\"גיר ודולומיט תוססים בחומצה ונשרטים במסמר; גרניט אינו מגיב ואינו נשרט.\",\"topic\":\"geology\"},{\"id\":153,\"question\":\"איזה סלע מוצג בתמונה?\",\"category\":\"סלעים מגמטיים\",\"answers\":[{\"text\":\"בזלת\",\"correct\":true},{\"text\":\"גרניט\",\"correct\":false},{\"text\":\"גנייס\",\"correct\":false},{\"text\":\"דולומיט\",\"correct\":false}],\"image\":{\"url\":\"/quiz-images/geology/rocks/basalt.jpg\",\"fit\":\"cover\",\"credit\":\"Wikimedia Commons\"},\"topic\":\"geology\",\"explanation\":\"סלע מגמטי-וולקני כהה; העמודים המשושים נוצרו בהתכווצות תרמית בזמן ההתקררות.\"},{\"id\":154,\"question\":\"איזה סלע מוצג בתמונה?\",\"category\":\"סלעים מגמטיים\",\"answers\":[{\"text\":\"גרניט\",\"correct\":true},{\"text\":\"קירטון\",\"correct\":false},{\"text\":\"שיש\",\"correct\":false},{\"text\":\"בזלת\",\"correct\":false}],\"image\":{\"url\":\"/quiz-images/geology/rocks/granite.jpg\",\"fit\":\"cover\",\"credit\":\"Wikimedia Commons\"},\"topic\":\"geology\",\"explanation\":\"סלע מגמטי-פלוטוני: הקירור האיטי בעומק אפשר גבישים גדולים של קוורץ, פלדספר ומיקה — ומכאן המראה המנומר.\"},{\"id\":155,\"question\":\"איזה סלע מוצג בתמונה (שימו לב למרקם ולמאובנים בתוכו)?\",\"category\":\"סלעי משקע\",\"answers\":[{\"text\":\"אבן גיר\",\"correct\":true},{\"text\":\"גנייס\",\"correct\":false},{\"text\":\"בזלת\",\"correct\":false},{\"text\":\"אבן חול\",\"correct\":false}],\"image\":{\"url\":\"/quiz-images/geology/rocks/limestone.jpg\",\"fit\":\"cover\",\"credit\":\"Wikimedia Commons\"},\"topic\":\"geology\",\"explanation\":\"סלע משקע ביוגני, בנוי קלציט; המאובנים שבתוכו מעידים על היווצרות בים.\"},{\"id\":156,\"question\":\"איזה סלע מוצג בתמונה?\",\"category\":\"סלעי משקע\",\"answers\":[{\"text\":\"קירטון\",\"correct\":true},{\"text\":\"שיש\",\"correct\":false},{\"text\":\"דולומיט\",\"correct\":false},{\"text\":\"מלח (הליט)\",\"correct\":false}],\"image\":{\"url\":\"/quiz-images/geology/rocks/chalk.jpg\",\"fit\":\"cover\",\"credit\":\"Wikimedia Commons\"},\"topic\":\"geology\",\"explanation\":\"לבן בוהק, רך ופריך — נשרט בקלות בציפורן, בשונה משיש הקשה והצפוף.\"},{\"id\":157,\"question\":\"איזה סלע מוצג בתמונה (שימו לב לגוון האפור-אדמדם ולמרקם ה\\\"סוכרי\\\")?\",\"category\":\"סלעי משקע\",\"answers\":[{\"text\":\"דולומיט — קשה מגיר, אינו תוסס בחומצה קרה, מרקם גבישי מנצנץ\",\"correct\":true},{\"text\":\"קוורציט — סלע מטמורפי קשה במיוחד\",\"correct\":false},{\"text\":\"אבן חול — מרקם גרגירי של נייר זכוכית\",\"correct\":false},{\"text\":\"אבן גיר — קשיות בינונית, תוסס מיד בחומצה קרה\",\"correct\":false}],\"image\":{\"url\":\"/quiz-images/geology/rocks/dolomite.jpg\",\"fit\":\"cover\",\"credit\":\"Wikimedia Commons\"},\"topic\":\"geology\"},{\"id\":158,\"question\":\"איזה סלע מוצג בתמונה (שימו לב לשיכוב ולמרקם הגרגירי)?\",\"category\":\"סלעי משקע\",\"answers\":[{\"text\":\"קירטון — סלע לבן בוהק ורך במיוחד\",\"correct\":false},{\"text\":\"גנייס — סלע מטמורפי עם פסים בהירים וכהים\",\"correct\":false},{\"text\":\"בזלת — סלע כהה ואחיד ללא שיכוב\",\"correct\":false},{\"text\":\"אבן חול — סלע משקע קלסטי מגרגרי קוורץ, מופיע בשכבות אופקיות\",\"correct\":true}],\"image\":{\"url\":\"/quiz-images/geology/rocks/sandstone.jpg\",\"fit\":\"cover\",\"credit\":\"Wikimedia Commons\"},\"topic\":\"geology\"},{\"id\":159,\"question\":\"איזה סלע מוצג בתמונה?\",\"category\":\"סלעי משקע\",\"answers\":[{\"text\":\"מלח (הליט) — סלע התאדות רך במיוחד, גביש קובייתי, שקוף עד עכור\",\"correct\":true},{\"text\":\"גרניט — סלע מגמטי-פלוטוני קשה\",\"correct\":false},{\"text\":\"קוורציט — סלע מטמורפי קשה מאוד\",\"correct\":false},{\"text\":\"גיר — סלע משקע קרבונטי בקשיות בינונית\",\"correct\":false}],\"image\":{\"url\":\"/quiz-images/geology/rocks/halite.jpg\",\"fit\":\"cover\",\"credit\":\"Wikimedia Commons\"},\"topic\":\"geology\"},{\"id\":160,\"question\":\"איזה מבנה סלעי ייחודי מוצג בתמונה, ומאיזה סלע הוא בנוי?\",\"category\":\"סלעים מטמורפיים\",\"answers\":[{\"text\":\"\\\"המנסרה\\\" במכתש רמון — קוורציט\",\"correct\":true},{\"text\":\"בריכת המשושים בגולן — בזלת\",\"correct\":false},{\"text\":\"עמודי עמרם בתמנע — אבן חול\",\"correct\":false},{\"text\":\"הר סדום — מלח\",\"correct\":false}],\"image\":{\"url\":\"/quiz-images/geology/rocks/quartzite_minsara.jpg\",\"fit\":\"cover\",\"credit\":\"Wikimedia Commons\"},\"topic\":\"geology\",\"explanation\":\"אבן חול שעברה התמרת מגע מגוף מגמתי, ונסדקה בהתקררות לעמודים מצולעים.\"},{\"id\":161,\"question\":\"איזה סלע מוצג בתמונה (שימו לב לפסים הבהירים והכהים המקבילים — הפוליאציה)?\",\"category\":\"סלעים מטמורפיים\",\"answers\":[{\"text\":\"גנייס — סלע מטמורפי מהתמרה אזורית בדרגה גבוהה, עם פוליאציה בולטת\",\"correct\":true},{\"text\":\"שיש — סלע מטמורפי אחיד ללא פסים\",\"correct\":false},{\"text\":\"אבן חול — סלע משקע קלסטי\",\"correct\":false},{\"text\":\"גרניט — סלע מגמטי-פלוטוני עם גבישים לא מכוונים\",\"correct\":false}],\"image\":{\"url\":\"/quiz-images/geology/rocks/gneiss.jpg\",\"fit\":\"cover\",\"credit\":\"Wikimedia Commons\"},\"topic\":\"geology\"},{\"id\":162,\"question\":\"איזה סלע מוצג בתמונה?\",\"category\":\"סלעים מטמורפיים\",\"answers\":[{\"text\":\"שיש\",\"correct\":true},{\"text\":\"אבן גיר\",\"correct\":false},{\"text\":\"קירטון\",\"correct\":false},{\"text\":\"דולומיט\",\"correct\":false}],\"image\":{\"url\":\"/quiz-images/geology/rocks/marble.jpg\",\"fit\":\"cover\",\"credit\":\"Wikimedia Commons\"},\"topic\":\"geology\",\"explanation\":\"אחיד וצפוף, ללא נקבוביות וללא מאובנים — סימני ההיכר של גיר שעבר התמרה.\"},{\"id\":163,\"question\":\"בתרשים מוצגים שני מבנים שנוצרו משבירה טקטונית. מהם, ומי מהם הגוש המורם ומי השקוע?\",\"category\":\"קימוט ושבירה\",\"answers\":[{\"text\":\"אנטיקלינה (הגוש המורם) וסינקלינה (הגוש השקוע) — שני מבני קימוט\",\"correct\":false},{\"text\":\"הורסט (הגוש המורם בין שני שברים) וגרבן (הגוש השקוע בין שני שברים)\",\"correct\":true},{\"text\":\"שני הגושים בתרשים הם דוגמה לגבול טרנספורם בלבד, ללא הבדל גובה\",\"correct\":false},{\"text\":\"רכס מרכז-אוקייני (מורם) ותעלה אוקיינית (שקועה)\",\"correct\":false}],\"image\":{\"url\":\"/quiz-images/geology/diagrams/horst_graben.jpg\",\"fit\":\"cover\",\"credit\":\"Brews ohare / Wikimedia Commons (CC BY-SA 3.0), נחתך\"},\"topic\":\"geology\"},{\"id\":164,\"question\":\"בתרשים מוצגים כמה דגמים תלת-ממדיים של תזוזת גושי סלע לאורך שבר. שלושה מהם הם סוגי ההעתקים הקלאסיים שנלמדו בקורס — מהם?\",\"category\":\"קימוט ושבירה\",\"answers\":[{\"text\":\"גבול פתיחה, גבול הפחתה, וגבול פנימי\",\"correct\":false},{\"text\":\"הורסט, גרבן, ומצוק העתקים בלבד\",\"correct\":false},{\"text\":\"העתק נורמלי (מתיחה), העתק הפוך (לחיצה), והעתק הזזה אופקית (גזירה)\",\"correct\":true},{\"text\":\"אנטיקלינה, סינקלינה, ומונוקלינה\",\"correct\":false}],\"image\":{\"url\":\"/quiz-images/geology/diagrams/fault_types.svg\",\"fit\":\"contain\",\"credit\":\"Jesús Gómez Fernández / Wikimedia Commons (CC BY-SA 3.0)\"},\"topic\":\"geology\"},{\"id\":165,\"question\":\"בתרשים מוצג רצף שכבות סלע מקומטות לסירוגין — קשתות כלפי מעלה וקערים כלפי מטה. כיצד מבחינים בין שני סוגי הקימוט הללו, לפי מיקום השכבות העתיקות ביותר?\",\"category\":\"קימוט ושבירה\",\"answers\":[{\"text\":\"באנטיקלינה (הקמר הקמור) השכבות העתיקות ביותר במרכז; בסינקלינה (הקער הקעור) השכבות הצעירות ביותר במרכז\",\"correct\":true},{\"text\":\"אין הבדל בגיל השכבות בין שני המבנים — ההבדל הוא רק בצבע הסלע\",\"correct\":false},{\"text\":\"באנטיקלינה השכבות הצעירות ביותר תמיד במרכז, ובסינקלינה העתיקות ביותר\",\"correct\":false},{\"text\":\"שני המבנים בתרשים הם בעצם אותו מבנה שצולם מזוויות שונות\",\"correct\":false}],\"image\":{\"url\":\"/quiz-images/geology/diagrams/fold_anticline_syncline.png\",\"fit\":\"contain\",\"credit\":\"Pearson Scott Foresman / Wikimedia Commons (public domain)\"},\"topic\":\"geology\"},{\"id\":166,\"question\":\"בתרשים מוצג חתך רוחב של קרום כדור הארץ עם שלושת סוגי גבולות הלוחות. אילו שלושה סוגים אלו?\",\"category\":\"טקטוניקת לוחות\",\"answers\":[{\"text\":\"פתיחה, הפחתה וטרנספורם\",\"correct\":true},{\"text\":\"הורסט, גרבן ומצוק העתקים\",\"correct\":false},{\"text\":\"אנטיקלינה, סינקלינה ומונוקלינה\",\"correct\":false},{\"text\":\"קמר, קער וטרסה מבנית\",\"correct\":false}],\"image\":{\"url\":\"/quiz-images/geology/diagrams
