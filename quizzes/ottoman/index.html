}],\"explanation\":\"וקף הוא הקדש, ובהרצאה מודגש שאין לסחור בו כבאדמה פרטית רגילה. יש להבחין בינו לבין מולכ ובין נחלת הסולטאן.\",\"topic\":\"mamluk-ottoman\",\"source\":\"חומר הקורס — התקופה העות׳מאנית — יחידה A — אדמת וקף הקדש שלא ניתן לסחור\"},{\"id\":8,\"question\":\"מהי אדמת מולכ בסיווג הקרקעות העות׳מאני?\",\"category\":\"כיבוש, מנהל וצבא\",\"answers\":[{\"text\":\"קרקע של הקדש דתי\",\"correct\":false},{\"text\":\"קרקע של נחלת הסולטאן\",\"correct\":false},{\"text\":\"קרקע לשימוש כלל הציבור\",\"correct\":false},{\"text\":\"קרקע בבעלות פרטית\",\"correct\":true}],\"explanation\":\"מולכ היא קטגוריה של בעלות פרטית. אין להחליף בינה לבין וקף או ג׳יפטליק, המוגדר בהרצאה כנחלה פרטית של הסולטאן.\",\"topic\":\"mamluk-ottoman\",\"source\":\"חומר הקורס — התקופה העות׳מאנית — יחידה A — אדמת מולוק אדמה פרטית\"},{\"id\":9,\"question\":\"מי יזם את בניית חומת העיר העתיקה הניצבת כיום בירושלים?\",\"category\":\"סולימאן והמורשת הבנויה\",\"answers\":[{\"text\":\"סולימאן המפואר\",\"correct\":true},{\"text\":\"סלים הראשון\",\"correct\":false},{\"text\":\"אחמד אל־ג׳זאר\",\"correct\":false},{\"text\":\"דאהר אל־עומר\",\"correct\":false}],\"explanation\":\"חומת ירושלים העות׳מאנית היא ממפעלי סולימאן במאה ה־16. היא חידשה את ההקפה הרציפה של העיר לאחר תקופה ממושכת ללא חומה רציפה.\",\"topic\":\"mamluk-ottoman\",\"source\":\"חומר הקורס — התקופה העות׳מאנית — יחידה A — סולמן חומת ירושלים\"},{\"id\":10,\"question\":\"איזה מפעל אספקת מים קדום לירושלים שופץ בימי סולימאן?\",\"category\":\"סולימאן והמורשת הבנויה\",\"answers\":[{\"text\":\"אמת המים של עכו\",\"correct\":false},{\"text\":\"אמת המים התחתונה\",\"correct\":true},{\"text\":\"נקבת חזקיהו\",\"correct\":false},{\"text\":\"אמת המים של קיסריה\",\"correct\":false}],\"explanation\":\"בימי סולימאן שופצה אמת המים התחתונה להר הבית. ההרצאה מדגימה זאת בצינור חרס שהושחל לתוואי הקדום במנהרת ארמון הנציב.\",\"topic\":\"mamluk-ottoman\",\"source\":\"חומר הקורס — התקופה העות׳מאנית — יחידה A — צינור חרס אמת המים התחתונה ארמון הנציב\"},{\"id\":11,\"question\":\"היכן נמצאת המצודה העות׳מאנית פינאר באשי?\",\"category\":\"סולימאן והמורשת הבנויה\",\"answers\":[{\"text\":\"בתל מגידו בעמק יזרעאל\",\"correct\":false},{\"text\":\"בתל חצור בגליל העליון\",\"correct\":false},{\"text\":\"בתל אפק ליד ראש העין\",\"correct\":true},{\"text\":\"בתל לכיש בשפלת יהודה\",\"correct\":false}],\"explanation\":\"המצודה באנטיפטריס, היא תל אפק, נמנית בהרצאה עם מפעלי הבנייה העות׳מאניים של המאה ה־16, בימי יורשי סולימאן.\",\"topic\":\"mamluk-ottoman\",\"source\":\"חומר הקורס — התקופה העות׳מאנית — יחידה A — פינר בשי אנטיפטריס אפק ראש העין\"},{\"id\":12,\"question\":\"איזה ענף תעשייה תרם במיוחד לפריחת צפת במאה ה־16?\",\"category\":\"צפת והיישוב היהודי במאה ה־16\",\"answers\":[{\"text\":\"הפקת סוכר מקני סוכר\",\"correct\":false},{\"text\":\"ייצור זכוכית ויצוא כלים\",\"correct\":false},{\"text\":\"גידול כותנה ויצוא סיבים\",\"correct\":false},{\"text\":\"עיבוד צמר וייצור אריגים\",\"correct\":true}],\"explanation\":\"מגורשי ספרד הביאו מומחיות בעיבוד צמר. התעשייה, מקורות המים והמסחר סיפקו בסיס כלכלי לפריחה הרוחנית בצפת.\",\"topic\":\"mamluk-ottoman\",\"source\":\"חומר הקורס — התקופה העות׳מאנית — יחידה A — עולי ספרד צפת תעשיית הצמר\"},{\"id\":13,\"question\":\"מה היה שימושן של המבטשות בנחלי צפת?\",\"category\":\"צפת והיישוב היהודי במאה ה־16\",\"answers\":[{\"text\":\"עיבוד אריגי צמר\",\"correct\":true},{\"text\":\"כתישת קני סוכר\",\"correct\":false},{\"text\":\"הפקת שמן מזיתים\",\"correct\":false},{\"text\":\"טחינת דגן לקמח\",\"correct\":false}],\"explanation\":\"המבטשות קשורות לתעשיית הצמר. מתקנים באזור נחל עמוד ונחל מירון ניצלו את מקורות המים לצורכי העיבוד.\",\"topic\":\"mamluk-ottoman\",\"source\":\"חומר הקורס — התקופה העות׳מאנית — יחידה A — מבטשות צמר נחל עמוד נחל מירון\"},{\"id\":14,\"question\":\"איזה חיבור הלכתי מזוהה עם רבי יוסף קארו בצפת?\",\"category\":\"צפת והיישוב היהודי במאה ה־16\",\"answers\":[{\"text\":\"משנה תורה\",\"correct\":false},{\"text\":\"שולחן ערוך\",\"correct\":true},{\"text\":\"ספר הזוהר\",\"correct\":false},{\"text\":\"מורה הנבוכים\",\"correct\":false}],\"explanation\":\"שולחן ערוך הוא קיצור שימושי של החיבור ההלכתי בית יוסף. פעילות קארו ממחישה את מעמדה של צפת כמרכז הלכה במאה ה־16.\",\"topic\":\"mamluk-ottoman\",\"source\":\"חומר הקורס — התקופה העות׳מאנית — יחידה A — יוסף קרו בית יוסף שולחן ערוך\"},{\"id\":15,\"question\":\"מי הוא האר״י, המזוהה עם הקבלה בצפת?\",\"category\":\"צפת והיישוב היהודי במאה ה־16\",\"answers\":[{\"text\":\"רבי יוסף קארו\",\"correct\":false},{\"text\":\"רבי משה קורדובירו\",\"correct\":false},{\"text\":\"רבי יצחק לוריה\",\"correct\":true},{\"text\":\"רבי חיים ויטאל\",\"correct\":false}],\"explanation\":\"רבי יצחק לוריה הוא האר״י. שיטת הקבלה המזוהה עמו מכונה קבלת האר״י או קבלה לוריאנית, והייתה בעלת השפעה רבה לאחר זמנו.\",\"topic\":\"mamluk-ottoman\",\"source\":\"חומר הקורס — התקופה העות׳מאנית — יחידה A — יצחק לוריה הארי קבלה לורינית\"},{\"id\":16,\"question\":\"מי נמנה בהרצאה עם תלמידיו הידועים של האר״י?\",\"category\":\"צפת והיישוב היהודי במאה ה־16\",\"answers\":[{\"text\":\"רבי משה דה לאון\",\"correct\":false},{\"text\":\"רבי חיים אבולעפיה\",\"correct\":false},{\"text\":\"רבי יהודה החסיד\",\"correct\":false},{\"text\":\"רבי חיים ויטאל\",\"correct\":true}],\"explanation\":\"חיים ויטאל נמנה עם תלמידי האר״י. אין לזהותו עם חיים אבולעפיה, הקשור בחידוש היישוב בטבריה במאה ה־18.\",\"topic\":\"mamluk-ottoman\",\"source\":\"חומר הקורס — התקופה העות׳מאנית — יחידה A — תלמידיו רבי חיים ויטל\"},{\"id\":17,\"question\":\"איזו קבוצת ערים מכונה ״ארבע ערי הקודש״?\",\"category\":\"צפת והיישוב היהודי במאה ה־16\",\"answers\":[{\"text\":\"ירושלים, חברון, טבריה וצפת\",\"correct\":true},{\"text\":\"ירושלים, יפו, טבריה וצפת\",\"correct\":false},{\"text\":\"ירושלים, חברון, שכם ועכו\",\"correct\":false},{\"text\":\"ירושלים, בית לחם, נצרת וצפת\",\"correct\":false}],\"explanation\":\"צפת הצטרפה בתודעה היהודית לירושלים, חברון וטבריה. ההרצאה קושרת את התחזקות מעמדה לפריחת המאה ה־16.\",\"topic\":\"mamluk-ottoman\",\"source\":\"חומר הקורס — התקופה העות׳מאנית — יחידה A — ארבע ערי הקודש ירושלים חברון טבריה צפת rect\":false},{\"text\":\"העברת השיפוט לקונסולים בלבד\",\"correct\":false}],\"explanation\":\"שיטת המילט אפשרה מסגרות של ניהול דתי־קהילתי במסגרת השלטון העות׳מאני. אין לבלבל בינה לבין חסות קונסולרית או עצמאות מדינית.\",\"topic\":\"mamluk-ottoman\",\"source\":\"חומר הקורס — התקופה העות׳מאנית — יחידה C — מילת אוטונומיה דתית פנימית קהילות\"},{\"id\":42,\"question\":\"איזה תפקיד נשא החכם באשי?\",\"category\":\"רפורמות ומעורבות המעצמות\",\"answers\":[{\"text\":\"מושל המחוז מטעם הסולטאן\",\"correct\":false},{\"text\":\"רב ראשי ונציג הקהילה היהודית\",\"correct\":true},{\"text\":\"גובה המכס הראשי של עכו\",\"correct\":false},{\"text\":\"נציג הקונסוליה הבריטית\",\"correct\":false}],\"explanation\":\"החכם באשי היה מוסד רבני ייצוגי מול השלטון. ההרצאה מציגה אותו כדוגמה להנהגה הקהילתית היהודית במסגרת העות׳מאנית.\",\"topic\":\"mamluk-ottoman\",\"source\":\"חומר הקורס — התקופה העות׳מאנית — יחידה C — חכם בשי רב ראשי מייצג קהילה\"},{\"id\":43,\"question\":\"מה אפשרו הקפיטולציות לנתינים זרים באימפריה?\",\"category\":\"רפורמות ומעורבות המעצמות\",\"answers\":[{\"text\":\"ריבונות נפרדת על ערי הקודש\",\"correct\":false},{\"text\":\"בעלות אוטומטית על אדמות וקף\",\"correct\":false},{\"text\":\"זכויות יתר וחסות קונסולרית\",\"correct\":true},{\"text\":\"פטור מכל דין בכל מדינות אירופה\",\"correct\":false}],\"explanation\":\"הסדרי הקפיטולציות הקנו זכויות וחסות לנתינים זרים, והקונסולים שימשו גורם הגנה וייצוג. הם תרמו להעמקת ההשפעה האירופית בארץ.\",\"topic\":\"mamluk-ottoman\",\"source\":\"חומר הקורס — התקופה העות׳מאנית — יחידה C — קפיטולציות זכויות יתר קונסולים נתיניהן\"},{\"id\":44,\"question\":\"באיזה צד לחמו בריטניה וצרפת במלחמת קרים?\",\"category\":\"רפורמות ומעורבות המעצמות\",\"answers\":[{\"text\":\"לצד רוסיה נגד העות׳מאנים\",\"correct\":false},{\"text\":\"לצד מצרים נגד העות׳מאנים\",\"correct\":false},{\"text\":\"לצד אוסטריה נגד צרפת\",\"correct\":false},{\"text\":\"לצד העות׳מאנים נגד רוסיה\",\"correct\":true}],\"explanation\":\"במלחמת קרים, בשנים 1853–1856, בריטניה וצרפת סייעו לאימפריה העו [{\"text\":\"ח׳אן אל־עומדאן\",\"correct\":false},{\"text\":\"ח׳אן שער הגיא\",\"correct\":false},{\"text\":\"ח׳אן החמורים\",\"correct\":false},{\"text\":\"ח׳אן א־תוג׳אר\",\"correct\":true}],\"explanation\":\"ח׳אן א־תוג׳אר, חאן הסוחרים, נמנה בהרצאה עם מפעלי השיקום העות׳מאניים במאה ה־16. הוא מדגים תשתית דרכים ומסחר בין ערים.\",\"topic\":\"mamluk-ottoman\",\"source\":\"חומר הקורס — התקופה העות׳מאנית — יחידה A — חנה טור בית קשת הר תבור\"},{\"id\":65,\"question\":\"איזו מורשת ממלוכית השפיעה על מצב ערי החוף בראשית התקופה העות׳מאנית?\",\"category\":\"סולימאן והמורשת הבנויה\",\"answers\":[{\"text\":\"הריסת ביצורים וערי נמל\",\"correct\":true},{\"text\":\"הקמת שרשרת ערי בירה חדשות\",\"correct\":false},{\"text\":\"ביטול כל המסחר בים התיכון\",\"correct\":false},{\"text\":\"סלילת מסילות בין נמלי הארץ\",\"correct\":false}],\"explanation\":\"מדיניות ההרס הממלוכית, שנועדה למנוע התבססות צלבנית מחודשת, השאירה חותם בחוף. התפתחות הערים לאחר מכן הייתה הדרגתית ושונה ממקום למקום.\",\"topic\":\"mamluk-ottoman\",\"source\":\"חומר הקורס — התקופה העות׳מאנית — יחידה A — הרי החוף ממלוכית נטישה והריסה\"},{\"id\":66,\"question\":\"מהי אדמת ג׳יפטליק לפי החלוקה שנלמדה?\",\"category\":\"כיבוש, מנהל וצבא\",\"answers\":[{\"text\":\"נכס מוקדש לצורכי ציבור\",\"correct\":false},{\"text\":\"נחלה פרטית של הסולטאן\",\"correct\":true},{\"text\":\"קרקע בבעלות פרטית רגילה\",\"correct\":false},{\"text\":\"קרקע המיועדת רק למרעה\",\"correct\":false}],\"explanation\":\"ג'יפטליק היא אדמה המוגדרת כנחלה פרטית השייכת לסולטאן העות'מאני.\",\"topic\":\"mamluk-ottoman\",\"source\":\"חומר הקורס — התקופה העות׳מאנית — יחידה A — גפטליק נחלה פרטית הסולטן\"},{\"id\":67,\"question\":\"באיזה הקשר בוטל חיל היניצ׳רים ב־1826?\",\"category\":\"כיבוש, מנהל וצבא\",\"answers\":[{\"text\":\"הקמת נציגויות זרות בירושלים\",\"correct\":false},{\"text\":\"מעבר מגביית מס לרישום טאבו\",\"correct\":false},{\"text\":\"רפורמה בצבא והתנגדות החיל\",\"correct\":true},{\"text\":\"קביעת גבול מצרים–ארץ ישראל\",\"correct\":false}],\"explanation\":\"חיל ה העות׳מאנית — יחידה A — הארי תלמידיו קברי צדיקים גליל\"},{\"id\":71,\"question\":\"מה הרקע לשם ״החורבה״ של חצר האשכנזים בירושלים?\",\"category\":\"התיישבות והיציאה מן החומות\",\"answers\":[{\"text\":\"הפגזה בריטית במלחמת קרים\",\"correct\":false},{\"text\":\"רעידת האדמה שפגעה בצפת\",\"correct\":false},{\"text\":\"הריסת החצר בעקבות חובות לנושים\",\"correct\":true},{\"text\":\"הרס בפקודת נפוליאון בונפרטה\",\"correct\":false}],\"explanation\":\"לאחר עליית יהודה החסיד נקלעה הקהילה לחובות, וב־1720 הוחרבה החצר. זהו שלב מוקדם בתולדות האתר, לפני בנייתו מחדש במאה ה־19.\",\"topic\":\"modern-yishuv\",\"source\":\"חומר הקורס — התקופה העות׳מאנית — יחידה B — 1720 חצר האשכנזים החורבה\"},{\"id\":72,\"question\":\"מה היה תפקיד ועד פקידי וגבירי קושטא?\",\"category\":\"רפורמות ומעורבות המעצמות\",\"answers\":[{\"text\":\"רישום אדמות הסולטאן בגליל\",\"correct\":false},{\"text\":\"גיוס חיילים יהודים לצבא\",\"correct\":false},{\"text\":\"ניהול הקונסוליות בירושלים\",\"correct\":false},{\"text\":\"ארגון סיוע כספי ליישוב בארץ\",\"correct\":true}],\"explanation\":\"הוועד בקושטא פעל לגיוס משאבים ולסיוע לקהילה היהודית בארץ. הוא מדגים את הקשרים בין קהילות האימפריה לבין היישוב המקומי.\",\"topic\":\"mamluk-ottoman\",\"source\":\"חומר הקורס — התקופה העות׳מאנית — יחידה B — 1726 ועד פקידי קושטא חובות\"},{\"id\":73,\"question\":\"איזה צירוף מצודות קשור לבנייה ולשיקום של דאהר אל־עומר?\",\"category\":\"שליטי הגליל ועכו\",\"answers\":[{\"text\":\"צפת, יחיעם ושפרעם\",\"correct\":true},{\"text\":\"אנטיפטריס, ערד ומצדה\",\"correct\":false},{\"text\":\"הרודיון, מכוור וסרטבה\",\"correct\":false},{\"text\":\"אשקלון, ערוער ועבדת\",\"correct\":false}],\"explanation\":\"השליט המקומי חיזק מוקדים מבוצרים בגליל, לעיתים על יסודות קודמים. לדוגמה, במבצר יחיעם יש להבחין בין השכבות הצלבניות לבין הבנייה העות׳מאנית.\",\"topic\":\"mamluk-ottoman\",\"source\":\"חומר הקורס — התקופה העות׳מאנית — יחידה B — צפת יחיעם גדין שפרעם דהר\"},{\"id\":74,\"question\":\"אילו גורמים תמכו בדאהר אל־עומר במאבקו בשלטון המרכזי?\",\"category\":\"שליטי הגליל ועכו\",\"answers\":[{\"text\":\"נפוליאון וצרפת\",\"correct\":false},{\"text\":\"עלי ביי ממצרים ורוסיה\",\"correct\":true},{\"text\":\"הקיסר הגרמני ובריטניה\",\"correct\":false},{\"text\":\"הפטריארך הלטיני וּונציה\",\"correct\":false}],\"explanation\":\"דאהר אל-עומר נשען על ברית עם עלי ביי מורד מצרים ועל סיוע צבאי וימי מן האימפריה הרוסית.\",\"topic\":\"mamluk-ottoman\",\"source\":\"חומר הקורס — התקופה העות׳מאנית — יחידה B — עלי ביי רוסים דהר אל עומר\"},{\"id\":75,\"question\":\"באיזו עיר התבססו חסידים בראשות מנחם מנדל מוויטבסק לאחר צפת?\",\"category\":\"התיישבות והיציאה מן החומות\",\"answers\":[{\"text\":\"ירושלים\",\"correct\":false},{\"text\":\"חברון\",\"correct\":false},{\"text\":\"טבריה\",\"correct\":true},{\"text\":\"עכו\",\"correct\":false}],\"explanation\":\"עליית החסידים במאה ה־18 קדמה לעליות הציוניות. ההרצאה מתארת את מעברם מצפת לטבריה, כחלק מתמורות היישוב היהודי בגליל.\",\"topic\":\"modern-yishuv\",\"source\":\"חומר הקורס — התקופה העות׳מאנית — יחידה B — 1777 חסידים מנחם מנדל מויטבסק טבריה\"},{\"id\":76,\"question\":\"איזה אירוע פגע בצי נפוליאון במצרים ב־1798?\",\"category\":\"מסע נפוליאון\",\"answers\":[{\"text\":\"טביעה מול חומות עכו\",\"correct\":false},{\"text\":\"כניעה בנמל יפו\",\"correct\":false},{\"text\":\"פיצוץ בתעלת סואץ\",\"correct\":false},{\"text\":\"תבוסה בקרב אבוקיר\",\"correct\":true}],\"explanation\":\"הצי הבריטי בפיקוד נלסון הביס את הצי הצרפתי באבוקיר. הפגיעה בקשר הימי היא רקע להבנת מצבו של הצבא הצרפתי במסעו לארץ.\",\"topic\":\"mamluk-ottoman\",\"source\":\"חומר הקורס — התקופה העות׳מאנית — יחידה C — 1798 אבוקיר נלסון השמדת הצי\"},{\"id\":77,\"question\":\"איזה אירוע התרחש לאחר כיבוש יפו בידי נפוליאון?\",\"category\":\"מסע נפוליאון\",\"answers\":[{\"text\":\"טבח בשבויים\",\"correct\":true},{\"text\":\"כניעת אל־ג׳זאר\",\"correct\":false},{\"text\":\"מרד הפלאחים\",\"correct\":false},{\"text\":\"חנוכת בריכת הקשתות\",\"correct\":false}],\"explanation\":\"כיבוש יפו ב־1799 לווה בטבח בשבויים. יש להבחין בין האירוע לבין סיפור ביקור נפוליאון אצל חולי הדבר, שגם הוא קשור ליפו.\",\"topic\":\"mamluk-ottoman\",\"source\":\"חומר הקורס — התקופה העות׳מאנית — יחידה C — יפו טבח שבועים מגפת הדבר\"},{\"id\":78,\"question\":\"מה הייתה חשיבות אבן רוזטה שנמצאה במצרים בימי משלחת נפוליאון?\",\"category\":\"מסע נפוליאון\",\"answers\":[{\"text\":\"תיעוד ראשון של גבולות יהודה\",\"correct\":false},{\"text\":\"סיוע לפענוח הכתב המצרי\",\"correct\":true},{\"text\":\"זיהוי תוואי הרכבת לירושלים\",\"correct\":false},{\"text\":\"אישור עות׳מאני לחפירת קברים\",\"correct\":false}],\"explanation\":\"ההשוואה בין אותו תוכן ביוונית ובשני כתבים מצריים סייעה לפענוח. אלה שלוש שיטות כתב ושתי לשונות, ולא שלוש לשונות שונות.\",\"topic\":\"mamluk-ottoman\",\"source\":\"חומר הקורס — התקופה העות׳מאנית — יחידה C — אבן הרוזטה שמפוליו הכתב המצרי\"},{\"id\":79,\"question\":\"איזה בית כנסת אשכנזי נחנך במתחם החורבה בימי השלטון המצרי?\",\"category\":\"השלטון המצרי והשינויים בגליל\",\"answers\":[{\"text\":\"תפארת ישראל\",\"correct\":false},{\"text\":\"האר״י האשכנזי\",\"correct\":false},{\"text\":\"מנחם ציון\",\"correct\":true},{\"text\":\"בית אל\",\"correct\":false}],\"explanation\":\"אברהם שלמה זלמן צורף פעל להשגת רישיון לשיקום מוסדות הקהילה. בית הכנסת מנחם ציון קדם לבניית בית הכנסת החורבה הגדול במאה ה־19.\",\"topic\":\"mamluk-ottoman\",\"source\":\"חומר הקורס — התקופה העות׳מאנית — יחידה C — צורף מנחם ציון פירמן\"},{\"id\":80,\"question\":\"איזה חוקר אמריקאי היה מחלוצי הגאוגרפיה ההיסטורית של הארץ?\",\"category\":\"רפורמות ומעורבות המעצמות\",\"answers\":[{\"text\":\"צ׳רלס וורן\",\"correct\":false},{\"text\":\"צ׳רלס וילסון\",\"correct\":false},{\"text\":\"ז׳אן־פרנסואה שמפוליון\",\"correct\":false},{\"text\":\"אדוארד רובינסון\",\"correct\":true}],\"explanation\":\"רובינסון זיהה אתרים מקראיים באמצעות סיורים, מקורות ושמות מקומות. פעילותו מדגימה את התפתחות המחקר במאה ה־19.\",\"topic\":\"mamluk-ottoman\",\"source\":\"חומר הקורס — התקופה העות׳מאנית — יחידה C — אדואד רובינסון הגאוגרפיה ההיסטורית\"},{\"id\":81,\"question\":\"לאיזה ביקור נקשר שיפור דרך הכרכרות מיפו לירושלים ב־1869?\",\"category\":\"תחבורה, מורשת וסיום התקופה\",\"answers\":[{\"text\":\"הקיסר פרנץ יוזף\",\"correct\":true},{\"text\":\"הקיסר וילהלם השני\",\"correct\":false},{\"text\":\"נפוליאון בונפרטה\",\"correct\":false},{\"text\":\"הקיסר הראקליוס\",\"correct\":false}],\"explanation\":\"הכשרת הדרך נקשרה לביקור פרנץ יוזף בתקופת פתיחת תעלת סואץ. מדובר בשיפור דרך עתיקה, ולא בפתיחת מסילת יפו–ירושלים.\",\"topic\":\"modern-yishuv\",\"source\":\"חומר הקורס — התקופה העות׳מאנית — יחידה C — פרנס יוזף 1869 כביש יפו ירושלים\"},{\"id\":82,\"question\":\"איזה עיתון עברי החל להופיע בירושלים ב־1863 ונחשב לראשון בארץ?\",\"category\":\"תחבורה, מורשת וסיום התקופה\",\"answers\":[{\"text\":\"הצבי\",\"correct\":false},{\"text\":\"הלבנון\",\"correct\":true},{\"text\":\"האור\",\"correct\":false},{\"text\":\"דבר\",\"correct\":false}],\"explanation\":\"הופעת הלבנון היא חלק מהתפתחות העיתונות והתקשורת בעברית בארץ. אין לבלבל בין ראשית העיתונות בארץ לבין עיתונים עבריים שהופיעו קודם באירופה.\",\"topic\":\"modern-yishuv\",\"source\":\"חומר הקורס — התקופה העות׳מאנית — יחידה C — 1863 הלבנון חבצלת עיתונות\"},{\"id\":83,\"question\":\"איזה יעד מדיני מרכזי ביטא ביקור וילהלם השני ב־1898?\",\"category\":\"תחבורה, מורשת וסיום התקופה\",\"answers\":[{\"text\":\"מימוש צ׳ארטר מדיני להרצל\",\"correct\":false},{\"text\":\"כיבוש ירושלים מידי העות׳מאנים\",\"correct\":false},{\"text\":\"חיזוק הקשרים עם הסולטאן\",\"correct\":true},{\"text\":\"ביטול הנציגות הגרמנית בארץ\",\"correct\":false}],\"explanation\":\"ביקור הקיסר ביטא את התחזקות הקשרים הגרמניים־עות׳מאניים, לצד חנוכת כנסיית הגואל. אין להסיק שפגישתו עם הרצל הניבה צ׳ארטר.\",\"topic\":\"modern-yishuv\",\"source\":\"חומר הקורס — התקופה העות׳מאנית — יחידה C — 1898 וילהלם השני עבד חמיד הברית\"}]}}]\n21:I[27201,[\"/moreh-derech/_next/static/chunks/2uv3ff-pa-p5j.js\",\"/moreh-derech/_next/static/chunks/2xolb0oqmgico.js\",\"/moreh-derech/_next/static/chunks/36tgn1766h98n.js\"],\"IconMark\"]\n1d:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"
