הקשתות רמלה הארון אל-ראשיד\"},{\"id\":25,\"question\":\"מה מעיד הממצא ברמלה על תכנון העיר הקדומה?\",\"category\":\"רמלה וטבריה\",\"answers\":[{\"text\":\"רשת רחובות מתוכננת\",\"correct\":true},{\"text\":\"צמיחה ללא מתווה רחובות\",\"correct\":false},{\"text\":\"תכנון מעגלי סביב ארמון\",\"correct\":false},{\"text\":\"העתקה מלאה של עיר קודמת\",\"correct\":false}],\"explanation\":\"הממצא ברמלה מעיד על תכנון עירוני מסודר. אין להשליך עליה דימוי של עיר שהתפתחה בלי תכנון.\",\"topic\":\"early-islam\",\"source\":\"חומר הקורס — התקופה המוסלמית הקדומה — יחידה R — מתווה רמלה רשת רחובות כיוון תפילה\"},{\"id\":26,\"question\":\"איזה ח׳ליף מזוהה עם קביעת הנוסח האחיד של הקוראן?\",\"category\":\"ראשית האסלאם והח׳ליפות\",\"answers\":[{\"text\":\"אבו בכר\",\"correct\":false},{\"text\":\"עות׳מאן\",\"correct\":true},{\"text\":\"מועאויה\",\"correct\":false},{\"text\":\"עבד אל־מלכ\",\"correct\":false}],\"explanation\":\"השיעור מייחס לעות׳מאן את קביעת הנוסח האחיד של הקוראן במסגרת ביסוס הקהילה והשלטון.\",\"topic\":\"early-islam\",\"source\":\"חומר הקורס — התקופה המוסלמית הקדומה — יחידה A — עות׳מאן — נוסח הקוראן\"},{\"id\":27,\"question\":\"מה הייתה בירת ג׳ונד אל־אורדון בתקופה המוסלמית הקדומה?\",\"category\":\"רמלה וטבריה\",\"answers\":[{\"text\":\"בית שאן\",\"correct\":false},{\"text\":\"ג'רש\",\"correct\":false},{\"text\":\"טבריה\",\"correct\":true},{\"text\":\"צפת\",\"correct\":false}],\"explanation\":\"טבריה החליפה את בית שאן (סקיטופוליס) כבירת מחוז ג'ונד אל-אורדון ושיגשגה מאוד.\",\"topic\":\"early-islam\",\"source\":\"חומר הקורס — התקופה המוסלמית הקדומה — יחידה U — בירת ג'ונד אל-אורדון טבריה\"},{\"id\":28,\"question\":\"מה מעידים הממצאים הארכאולוגיים בטבריה על מעמדה בתקופה העבאסית?\",\"category\":\"רמלה וטבריה\",\"answers\":[{\"text\":\"תפקוד כמצודת ספר בלבד\",\"correct\":false},{\"text\":\"התכווצות רציפה ללא בנייה\",\"correct\":false},{\"text\":\"אובדן מעמד של בירת מחוז\",\"correct\":false},{\"text\":\"שגשוג ובנייה ברובעי מגורים\",\"correct\":true}],\"explanation\":\"החפירות בטבריה מעיד \":\"ירושלים והר הבית\",\"answers\":[{\"text\":\"אל־מנצור\",\"correct\":false},{\"text\":\"הארון א־רשיד\",\"correct\":false},{\"text\":\"אל־מועתצם\",\"correct\":false},{\"text\":\"אל־מאמון\",\"correct\":true}],\"explanation\":\"אל־מאמון הכניס לכתובת את שמו, בעוד התאריך המקורי נותר. הפער חושף את השינוי בייחוס הבנייה.\",\"topic\":\"early-islam\",\"source\":\"חומר הקורס — התקופה המוסלמית הקדומה — יחידה L — כתובת כיפת הסלע אל-מאמון זיוף\"},{\"id\":33,\"question\":\"לאיזה ח׳ליף מייחס השיעור את השלמת מפעל מסגד אל־אקצא בראשית המאה השמינית?\",\"category\":\"ירושלים והר הבית\",\"answers\":[{\"text\":\"אל-ווליד הראשון\",\"correct\":true},{\"text\":\"עומר בן אל-ח'טאב\",\"correct\":false},{\"text\":\"עבד אל-מלכ\",\"correct\":false},{\"text\":\"הישאם אבן עבד אל־מלכ\",\"correct\":false}],\"explanation\":\"אל־וליד הראשון קשור להשלמת מפעל אל־אקצא. יש להבחין בינו לבין כיפת הסלע שבנה אביו עבד אל־מלכ.\",\"topic\":\"early-islam\",\"source\":\"חומר הקורס — התקופה המוסלמית הקדומה — יחידה U — מסגד אל-אקצא אל-ווליד הראשון\"},{\"id\":34,\"question\":\"לפי הזיהוי המוצג בשיעור, לאיזה שער נקשר ״בית כנסת המערה״?\",\"category\":\"ירושלים והר הבית\",\"answers\":[{\"text\":\"שער ברקלי\",\"correct\":false},{\"text\":\"שער וורן\",\"correct\":true},{\"text\":\"השער הכפול\",\"correct\":false},{\"text\":\"השער המשולש\",\"correct\":false}],\"explanation\":\"השיעור מציג זיהוי של בית כנסת המערה עם החלל שמאחורי שער וורן. זהו זיהוי מחקרי ולא כתובת זיהוי באתר.\",\"topic\":\"early-islam\",\"source\":\"חומר הקורס — התקופה המוסלמית הקדומה — יחידה L — בית כנסת המערה שער וורן\"},{\"id\":35,\"question\":\"מה קרה לתוואי חומת ירושלים בעקבות הרעשים והמשברים של המאה ה-11 בתקופה הפאטימית?\",\"category\":\"ירושלים והר הבית\",\"answers\":[{\"text\":\"הר הזיתים נכלל בתחום החומה\",\"correct\":false},{\"text\":\"הוחזר תוואי החומה ההרודיאנית\",\"correct\":false},{\"text\":\"עיר דוד נותרה מחוץ לחומה\",\"correct\":true},{\"text\":\"החומה פורקה ללא הקמת חלופה\",\"correct\":false}],\"explanation\":\"במאה ה-11 התכווצה ירושלים, והחומה שוקמה בתוואי מצומצם שהותיר את עיר דוד מחוץ לעיר.\",\"topic\":\"early-islam\",\"source\":\"חומר הקורס — התקופה המוסלמית הקדומה — יחידה L — התכווצות חומת ירושלים המאה ה-11\"},{\"id\":36,\"question\":\"היכן נחשף מכלול מבני השלטון האומאיים הסמוך להר הבית?\",\"category\":\"ארמונות וממצאים\",\"answers\":[{\"text\":\"מצפון לשער שכם\",\"correct\":false},{\"text\":\"ממערב לחומת העיר העתיקה\",\"correct\":false},{\"text\":\"במורדות המזרחיים של הר הזיתים\",\"correct\":false},{\"text\":\"מדרום ומדרום־מערב להר הבית\",\"correct\":true}],\"explanation\":\"המכלול האומאי שבגן הארכאולוגי מדרום להר הבית מעיד על מפעל הבנייה השלטוני הגדול באזור.\",\"topic\":\"early-islam\",\"source\":\"חומר הקורס — התקופה המוסלמית הקדומה — יחידה U — ארמונות בית אומיה הכותל הדרומי\"},{\"id\":37,\"question\":\"איזה ארמון אומאי מפואר נבנה ליד יריחו ונודע בעושר הפסיפסים והפיסול הפיגורטיבי שבו?\",\"category\":\"ארמונות וממצאים\",\"answers\":[{\"text\":\"ח׳רבת אל־מפג׳ר\",\"correct\":true},{\"text\":\"ח'רבת אל-מיניה\",\"correct\":false},{\"text\":\"מצודת אל-עריש\",\"correct\":false},{\"text\":\"קצר עמרה\",\"correct\":false}],\"explanation\":\"ח׳רבת אל־מפג׳ר שליד יריחו מכונה גם ארמון הישאם, ונודעת בפסיפסים ובפיסול שלה.\",\"topic\":\"early-islam\",\"source\":\"חומר הקורס — התקופה המוסלמית הקדומה — יחידה U — ח'רבת אל-מפג'ר ארמון הישאם יריחו\"},{\"id\":38,\"question\":\"איפה נבנה הארמון האומאי המוכר בשם ח'רבת מיניה (מינים)?\",\"category\":\"ארמונות וממצאים\",\"answers\":[{\"text\":\"בבקעת בית שאן סמוך לירדן\",\"correct\":false},{\"text\":\"בחוף הצפון־מערבי של הכנרת\",\"correct\":true},{\"text\":\"במורדות הרי חברון\",\"correct\":false},{\"text\":\"בחוף קיסריה מדרום לנמל\",\"correct\":false}],\"explanation\":\"ח׳רבת מיניה שוכנת ליד החוף הצפון־מערבי של הכנרת, באזור כרי דשא.\",\"topic\":\"early-islam\",\"source\":\"חומר הקורס — התקופה המוסלמית הקדומה — יחידה U — ח'רבת מיניה כנרת כרי דשא\"},{\"id\":39,\"question\":\"איזה רצף משקף את סדר שלטון השושלות המרכזיות בארץ בתקופה המוסלמית הקדומה?\",\"category\":\"שושלות ושל
