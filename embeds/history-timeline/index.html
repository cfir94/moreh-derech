function renderQuiz(key) {
  quizState = { key, mcAnswers: {}, fillRatings: {} };
  mode = "quiz";
  const quiz = QUIZZES[key];
  app.innerHTML = "";

  const h = document.createElement("div");
  h.className = "section-title";
  h.textContent = quiz.title;
  app.appendChild(h);

  quiz.items.forEach((item, i) => {
    const card = document.createElement("div");
    card.className = "qcard";
    card.innerHTML = '<div class="qtopic">' + item.topic + '</div><div class="qtext">' + (i + 1) + '. ' + item.q + '</div>';

    if (item.type === "mc") {
      const optWrap = document.createElement("div");
      const letters = ["א", "ב", "ג", "ד"];
      item.options.forEach((opt, oi) => {
        const b = document.createElement("button");
        b.className = "opt";
        b.textContent = letters[oi] + ". " + opt;
        b.onclick = () => {
          if (quizState.mcAnswers[i] !== undefined) return;
          quizState.mcAnswers[i] = oi;
          const btns = optWrap.querySelectorAll(".opt");
          btns.forEach((bb, bi) => {
            bb.classList.add("locked");
            if (bi === item.correct) bb.classList.add("correct");
            else if (bi === oi) bb.classList.add("incorrect");
          });
          card.querySelector(".explain").style.display = "block";
          updateScorebar();
        };
        optWrap.appendChild(b);
      });
      card.appendChild(optWrap);
      const exp = document.createElement("div");
      exp.className = "explain";
      exp.textContent = item.exp;
      card.appendChild(exp);
    } else {
      const inp = document.createElement("input");
      inp.type = "text";
      inp.className = "fill-input";
      inp.placeholder = "הקלידו את תשובתכם (רשות)...";
      card.appendChild(inp);

      const revealBtn = document.createElement("button");
      revealBtn.className = "reveal-btn";
      revealBtn.textContent = "בדוק תשובה";
      const answerDiv = document.createElement("div");
      answerDiv.className = "model-answer";
      answerDiv.innerHTML = "<strong>תשובה נכונה:</strong> " + item.answer + "<br>" + item.exp;
      const rateRow = document.createElement("div");
      rateRow.className = "rate-row";
      rateRow.style.display = "none";
      const ratings = [["ידעתי (2)", 2], ["לא ידעתי (0)", 0]];
      ratings.forEach(([label, val]) => {
        const rb = document.createElement("button");
        rb.className = "rate-btn";
        rb.textContent = label;
        rb.onclick = () => {
          quizState.fillRatings[i] = val;
          rateRow.querySelectorAll(".rate-btn").forEach((x) => { x.className = "rate-btn"; });
          rb.classList.add("active-" + val);
          updateScorebar();
        };
        rateRow.appendChild(rb);
      });
      revealBtn.onclick = () => {
        answerDiv.style.display = "block";
        rateRow.style.display = "flex";
        revealBtn.style.display = "none";
      };
      card.appendChild(revealBtn);
      card.appendChild(answerDiv);
      card.appendChild(rateRow);
    }
    app.appendChild(card);
  });

  const finishWrap = document.createElement("div");
  finishWrap.className = "finish-wrap";
  const finishBtn = document.createElement("button");
  finishBtn.className = "finish-btn";
  finishBtn.textContent = "סיים שאלון והצג ציון סופי";
  finishBtn.onclick = () => renderQuizResults(key);
  finishWrap.appendChild(finishBtn);
  app.appendChild(finishWrap);

  updateScorebar();
  window.scrollTo(0, 0);
}

function renderQuizResults(key) {
  const quiz = QUIZZES[key];
  const { earned, possible } = computeQuizScore(key);
  const pct = Math.round((earned / possible) * 100);
  const correctItems = quiz.items.filter((item, i) =>
    item.type === "mc"
      ? quizState.mcAnswers[i] === item.correct
      : quizState.fillRatings[i] === 2
  ).length;

  reportAttempt({
    quiz: "timeline-dating-" + key,
    quizLabel: "שאלוני תיארוך — " + quiz.title,
    category: quiz.title,
    correct: correctItems,
    total: quiz.items.length,
  });

  const topics = {};
  quiz.items.forEach((item, i) => {
    const bucket = topicBucket(item.topic);
    topics[bucket] = topics[bucket] || { earned: 0, possible: 0 };
    topics[bucket].possible += 2;
    if (item.type === "mc") {
      if (quizState.mcAnswers[i] === item.correct) topics[bucket].earned += 2;
    } else {
      topics[bucket].earned += quizState.fillRatings[i] || 0;
    }
  });

  app.innerHTML = "";
  const box = document.createElement("div");
  box.className = "results-box";
  let rows = "";
  Object.keys(topics).forEach((t) => {
    rows += '<div class="breakdown-row"><span>' + t + '</span><span>' + topics[t].earned + ' / ' + topics[t].possible + '</span></div>';
  });
  box.innerHTML =
    '<div>סיימתם את ' + quiz.title + '</div>' +
    '<div class="big-score">' + earned + ' / ' + possible + '</div>' +
    '<div class="pct">' + pct + '% הצלחה</div>' +
    '<div class="breakdown">' + rows + '</div>';
  app.appendChild(box);

  const restart = document.createElement("button");
  restart.className = "restart-btn";
  restart.textContent = "חזרה לבחירת שאלון";
  restart.onclick = renderQuizSelect;
  const centerWrap = document.createElement("div");
  centerWrap.style.textAlign = "center";
  centerWrap.appendChild(restart);
  app.appendChild(centerWrap);
  window.scrollTo(0, 0);
}

/* ============================= Timeline (tap-to-place) engine ============================= */

function renderTimelineSelect() {
  mode = "timeline";
  updateScorebar();
  app.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.className = "select-screen";
  wrap.innerHTML = "<h2>ציר זמן גרירה</h2><div class=\"lede\">בחרו ציר זמן — הקישו על פריט ואז על מקומו הכרונולוגי, ובדקו את הסדר</div>";
  Object.keys(TIMELINES).forEach((key, idx) => {
    const t = TIMELINES[key];
    const btn = document.createElement("button");
    btn.className = "topic-btn";
    btn.innerHTML = '<span class="tb-badge">' + (idx + 1) + '</span><span class="tb-text"><span class="tb-title">' + t.title + '</span><span class="tb-sub">' + t.nodes.length + ' פריטים לסידור</span></span>';
    btn.onclick = () => renderTimeline(key);
    wrap.appendChild(btn);
  });
  const back = document.createElement("div");
  back.className = "backlink";
  back.textContent = "⟵ חזרה למסך הראשי";
  back.onclick = returnFromView;
  const centerWrap = document.createElement("div");
  centerWrap.style.textAlign = "center";
  centerWrap.appendChild(back);
  wrap.appendChild(centerWrap);
  app.appendChild(wrap);
}

function renderTimeline(key) {
  mode = "timeline";
  const t = TIMELINES[key];
  const bank = t.nodes.map((_, i) => i);
  shuffleArray(bank);
  timelineState = { key, slots: new Array(t.nodes.length).fill(null), bank, selected: null, checked: false };
  updateScorebar();
  drawTimeline();
}

function placeInSlot(idx, slotIndex) {
  if (timelineState.checked) return;
  if (timelineState.slots[slotIndex] !== null) return;
  timelineState.bank = timelineState.bank.filter((v) => v !== idx);
  timelineState.slots[slotIndex] = idx;
  timelineState.selected = null;
  drawTimeline();
}

function returnToBank(slotIndex) {
  if (timelineState.checked) return;
  const idx = timelineState.slots[slotIndex];
  if (idx === null) return;
  timelineState.slots[slotIndex] = null;
  timelineState.bank.push(idx);
  timelineState.selected = null;
  drawTimeline();
}

/* ---------------- גרירה אמיתית: עכבר, מגע ועט דרך Pointer Events ----------------
   הקשה קצרה ממשיכה לעבוד כמו קודם (בחירה והצבה), כדי לא לשבור את מי
   שכבר רגיל לזה ואת הניווט במקלדת. גרירה מתחילה רק אחרי תזוזה של 8 פיקסלים. */

const TL_DRAG_THRESHOLD = 8;
let tlDrag = null;
let tlJustDragged = false;

function tlClearDropHints() {
  document.querySelectorAll(".tl-slot.drop-over").forEach(function (el) { el.classList.remove("drop-over"); });
  document.querySelectorAll(".tl-bank.drop-over").forEach(function (el) { el.classList.remove("drop-over"); });
}

function tlEndDragVisuals() {
  if (tlDrag && tlDrag.ghost && tlDrag.ghost.parentNode) tlDrag.ghost.parentNode.removeChild(tlDrag.ghost);
  if (tlDrag && tlDrag.card) tlDrag.card.classList.remove("tl-dragging");
  document.body.classList.remove("tl-drag-on");
  tlClearDropHints();
}

/* מעביר פריט אל משבצת. משבצת תפוסה — מחליפים ביניהם, וכך אפשר
   לסדר מחדש בחופשיות בלי להחזיר קודם למאגר. */
function tlDropOnSlot(idx, from, toSlot) {
  if (timelineState.checked) return;
  const occupant = timelineState.slots[toSlot];
  if (from.type === "slot") {
    if (from.slot === toSlot) { drawTimeline(); return; }
    timelineState.slots[from.slot] = occupant;
    timelineState.slots[toSlot] = idx;
  } else {
    timelineState.bank = timelineState.bank.filter(function (v) { return v !== idx; });
    if (occupant !== null && occupant !== undefined) timelineState.bank.push(occupant);
    timelineState.slots[toSlot] = idx;
  }
  timelineState.selected = null;
  drawTimeline();
}

function tlPointerDown(e, card, idx, slotIndex) {
  if (timelineState.checked) return;
  if (e.pointerType === "mouse" && e.button !== 0) return;
  if (e.target.closest && e.target.closest(".tl-remove")) return;
  tlDrag = {
    idx: idx,
    from: slotIndex === null ? { type: "bank" } : { type: "slot", slot: slotIndex },
    x0: e.clientX, y0: e.clientY,
    card: card, ghost: null, active: false, over: null,
    pointerId: e.pointerId,
  };
  try { card.setPointerCapture(e.pointerId); } catch (err) {}
}

function tlBeginGhost() {
  const card = tlDrag.card;
  const r = card.getBoundingClientRect();
  const g = card.cloneNode(true);
  g.classList.add("tl-ghost");
  g.classList.remove("selected");
  g.style.width = r.width + "px";
  g.style.height = r.height + "px";
  tlDrag.offX = tlDrag.x0 - r.left;
  tlDrag.offY = tlDrag.y0 - r.top;
  document.body.appendChild(g);
  tlDrag.ghost = g;
  tlDrag.active = true;
  card.classList.add("tl-dragging");
  document.body.classList.add("tl-drag-on");
  const sel = window.getSelection && window.getSelection();
  if (sel && sel.removeAllRanges) sel.removeAllRanges();
}

function tlPointerMove(e) {
  if (!tlDrag || e.pointerId !== tlDrag.pointerId) return;
  const dx = e.clientX - tlDrag.x0, dy = e.clientY - tlDrag.y0;
  if (!tlDrag.active) {
    if (Math.sqrt(dx * dx + dy * dy) < TL_DRAG_THRESHOLD) return;
    tlBeginGhost();
  }
  e.preventDefault();
  tlDrag.ghost.style.transform =
    "translate(" + (e.clientX - tlDrag.offX) + "px," + (e.clientY - tlDrag.offY) + "px)";

  tlClearDropHints();
  tlDrag.over = null;
  const under = document.elementFromPoint(e.clientX, e.clientY);
  if (!under || !under.closest) return;
  const slot = under.closest(".tl-slot");
  if (slot && slot.dataset.slot !== undefined) {
    slot.classList.add("drop-over");
    tlDrag.over = { type: "slot", slot: +slot.dataset.slot };
    return;
  }
  const bank = under.closest(".tl-bank");
  if (bank && tlDrag.from.type === "slot") {
    bank.classList.add("drop-over");
    tlDrag.over = { type: "bank" };
  }
}

function tlPointerUp(e) {
  if (!tlDrag || e.pointerId !== tlDrag.pointerId) return;
  const st = tlDrag;
  tlEndDragVisuals();
  tlDrag = null;
  if (!st.active) return;                 // הקשה בלבד — ה-click הרגיל יטפל
  tlJustDragged = true;                   // ולכן צריך לבטל את ה-click שיגיע אחרי גרירה
  setTimeout(function () { tlJustDragged = false; }, 0);
  if (!st.over) { drawTimeline(); return; }
  if (st.over.type === "bank") {
    if (st.from.type === "slot") returnToBank(st.from.slot);
    else drawTimeline();
    return;
  }
  tlDropOnSlot(st.idx, st.from, st.over.slot);
}

function tlPointerCancel(e) {
  if (!tlDrag || e.pointerId !== tlDrag.pointerId) return;
  const wasActive = tlDrag.active;
  tlEndDragVisuals();
  tlDrag = null;
  if (wasActive) drawTimeline();
}

function buildTlCard(idx, slotIndex) {
  const card = document.createElement("div");
  card.className = "tl-card";
  if (timelineState.selected === idx) card.classList.add("selected");
  if (timelineState.checked && slotIndex !== null) {
    card.classList.add(idx === slotIndex ? "correct" : "incorrect");
  }
  const t = TIMELINES[timelineState.key];
  const node = t.nodes[idx];
  const label = document.createElement("div");
  label.className = "tl-card-label";
  label.textContent = node.label;
  card.appendChild(label);
  if (timelineState.checked) {
    const dates = document.createElement("div");
    dates.className = "tl-card-dates";
    dates.innerHTML = ltrNums(node.dates);
    card.appendChild(dates);
  }
  if (slotIndex !== null && !timelineState.checked) {
    const rm = document.createElement("div");
    rm.className = "tl-remove";
    rm.textContent = "✕";
    rm.title = "החזירו לרשימה";
    rm.onclick = (e) => { e.stopPropagation(); returnToBank(slotIndex); };
    card.appendChild(rm);
  }
  if (!timelineState.checked) {
    card.setAttribute("draggable", "false");   // הגרירה שלנו, לא של הדפדפן
    card.addEventListener("pointerdown", (e) => tlPointerDown(e, card, idx, slotIndex));
    card.addEventListener("pointermove", tlPointerMove);
    card.addEventListener("pointerup", tlPointerUp);
    card.addEventListener("pointercancel", tlPointerCancel);
    card.addEventListener("dragstart", (e) => e.preventDefault());
  }
  card.onclick = (e) => {
    e.stopPropagation();
    if (timelineState.checked) return;
    if (tlJustDragged) return;                 // זו הייתה גרירה, לא הקשה
    if (slotIndex !== null) {
      returnToBank(slotIndex);
    } else {
      timelineState.selected = timelineState.selected === idx ? null : idx;
      drawTimeline();
    }
  };
  return card;
}

function drawTimeline() {
  const t = TIMELINES[timelineState.key];
  app.innerHTML = "";

  const h = document.createElement("div");
  h.className = "section-title";
  h.textContent = t.title;
  app.appendChild(h);

  const total = t.nodes.length;
  const placed = total - timelineState.bank.length;
  const remaining = timelineState.bank.length;

  if (!timelineState.checked) {
    const steps = document.createElement("div");
    steps.className = "tl-steps";
    steps.innerHTML =
      '<div class="tl-step' + (timelineState.selected === null ? " now" : "") + '">' +
        '<span class="tl-step-num">1</span>' +
        '<span>גררו פריט מהרשימה שלמטה אל משבצת בציר — או הקישו עליו והוא ייצבע בזהב</span></div>' +
      '<div class="tl-step' + (timelineState.selected !== null ? " now" : "") + '">' +
        '<span class="tl-step-num">2</span>' +
        '<span>סדרו לפי הזמן (1 = המוקדם ביותר). אפשר לגרור בין משבצות — גרירה על משבצת תפוסה מחליפה ביניהן</span></div>' +
      '<div class="tl-step"><span class="tl-step-num">3</span>' +
        '<span>אחרי שכל המשבצות מלאות — לחצו "בדוק סדר"</span></div>';
    app.appendChild(steps);
  }

  const dirHint = document.createElement("div");
  dirHint.className = "tl-dir-hint";
  dirHint.innerHTML = "<span>המוקדם ביותר</span><span>המאוחר ביותר</span>";
  app.appendChild(dirHint);

  // המשבצות נשברות לשורות במקום גלילה אופקית — אחרת משבצות ריקות
  // נחתכות מחוץ למסך והמשתמש לא יודע שנשאר לו למלא
  const slotsWrap = document.createElement("div");
  slotsWrap.className = "tl-slots";
  timelineState.slots.forEach((val, i) => {
    const slot = document.createElement("div");
    slot.className = "tl-slot" + (val === null ? " empty" : " filled");
    slot.dataset.slot = String(i);
    const num = document.createElement("span");
    num.className = "tl-slot-num";
    num.textContent = String(i + 1);
    slot.appendChild(num);
    if (val === null) {
      if (timelineState.selected !== null) slot.classList.add("can-drop");
      const ph = document.createElement("span");
      ph.className = "tl-slot-ph";
      ph.textContent = timelineState.selected !== null ? "הקישו כאן" : "ריק";
      slot.appendChild(ph);
    } else {
      slot.appendChild(buildTlCard(val, i));
    }
    slot.onclick = () => {
      if (timelineState.checked) return;
      if (val === null && timelineState.selected !== null) {
        placeInSlot(timelineState.selected, i);
      }
    };
    slotsWrap.appendChild(slot);
  });
  app.appendChild(slotsWrap);

  if (!timelineState.checked) {
    const prog = document.createElement("div");
    prog.className = "tl-progress" + (remaining === 0 ? " done" : "");
    prog.innerHTML =
      '<div class="tl-progress-bar"><i style="width:' + Math.round((placed / total) * 100) + '%"></i></div>' +
      '<div class="tl-progress-txt">' +
        (remaining === 0
          ? "כל " + total + " הפריטים הוצבו — אפשר לבדוק סדר"
          : "הוצבו " + placed + " מתוך " + total + " · נותרו " + remaining + " פריטים למטה") +
      '</div>';
    app.appendChild(prog);
  }

  const bankWrap = document.createElement("div");
  bankWrap.className = "tl-bank";
  if (timelineState.bank.length === 0) {
    if (!timelineState.checked) {
      const done = document.createElement("div");
      done.className = "tl-bank-empty";
      done.textContent = "אין פריטים שנותרו להצבה.";
      bankWrap.appendChild(done);
    }
  } else {
    timelineState.bank.forEach((idx) => {
      bankWrap.appendChild(buildTlCard(idx, null));
    });
  }
  if (!timelineState.checked) {
    const bankLabel = document.createElement("div");
    bankLabel.className = "tl-bank-label";
    bankLabel.textContent = remaining ? "פריטים להצבה (" + remaining + ")" : "פריטים להצבה";
    app.appendChild(bankLabel);
  }
  app.appendChild(bankWrap);

  const controls = document.createElement("div");
  controls.className = "tl-controls";
  if (!timelineState.checked) {
    const checkBtn = document.createElement("button");
    checkBtn.className = "finish-btn";
    checkBtn.textContent = remaining === 0 ? "בדוק סדר" : "בדוק סדר · נותרו " + remaining;
    checkBtn.disabled = remaining > 0;
    checkBtn.title = remaining > 0 ? "יש להציב את כל הפריטים לפני הבדיקה" : "";
    checkBtn.onclick = () => {
      if (timelineState.bank.length > 0) return;
      timelineState.checked = true;
      reportAttempt({
        quiz: "timeline-drag-" + timelineState.key,
        quizLabel: "תרגול ציר זמן — " + t.title,
        category: t.title,
        correct: timelineState.slots.filter((value, index) => value === index).length,
        total: t.nodes.length,
      });
      drawTimeline();
    };
    controls.appendChild(checkBtn);
  }
  const resetBtn = document.createElement("button");
  resetBtn.className = "restart-btn";
  resetBtn.textContent = "התחל מחדש";
  resetBtn.onclick = () => renderTimeline(timelineState.key);
  controls.appendChild(resetBtn);
  const backBtn = document.createElement("button");
  backBtn.className = "restart-btn";
  backBtn.textContent = "חזרה לבחירת ציר זמן";
  backBtn.onclick = renderTimelineSelect;
  controls.appendChild(backBtn);
  app.appendChild(controls);

  if (timelineState.checked) {
    const correctCount = timelineState.slots.filter((v, i) => v === i).length;
    const resultMsg = document.createElement("div");
    resultMsg.className = "tl-result";
    resultMsg.textContent = correctCount + " מתוך " + t.nodes.length + " במקום הכרונולוגי הנכון";
    app.appendChild(resultMsg);
  }
  window.scrollTo(0, 0);
}

/* ============================= Kings Gantt chart ============================= */

// מי מלך בשנה נתונה (לפנה"ס), לפי טבלת המלכים — משמש לתיאור אירועים וממצאים
function kingAtYear(kings, year) {
  return kings.filter((k) => !k.isEvent && !k.row && k.end < year && year <= k.start)[0] || null;
}

function rulersText(year) {
  const j = kingAtYear(KINGS_GANTT.judah, year);
  const i = kingAtYear(KINGS_GANTT.israel, year);
  const parts = [];
  if (j) parts.push("ביהודה: " + j.name);
  if (i) parts.push("בישראל: " + i.name);
  else if (year < 722 && year >= 586) parts.push("בישראל: לאחר נפילת שומרון");
  return parts.join(" · ");
}

function rulersLine(year) {
  const t = rulersText(year);
  return t ? ' <span class="kd-rulers">· ' + t + "</span>" : "";
}

/* ---- כרטיס פרטים נשלף (sheet) — נפתח מיד מעל התוכן, גם באמצע גרף ארוך ---- */

let sheetEl = null;

function ensureSheet() {
  if (sheetEl) return sheetEl;
  sheetEl = document.createElement("div");
  sheetEl.className = "sheet";
  sheetEl.innerHTML =
    '<div class="sheet-card" role="dialog" aria-modal="true">' +
      '<div class="sheet-grab"></div>' +
      '<button type="button" class="sheet-close" aria-label="סגירה">✕</button>' +
      '<div class="sheet-body"></div>' +
    '</div>';
  sheetEl.onclick = (e) => { if (e.target === sheetEl) closeSheet(); };
  sheetEl.querySelector(".sheet-close").onclick = closeSheet;
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });
  document.body.appendChild(sheetEl);
  return sheetEl;
}

function closeSheet() {
  if (sheetEl) sheetEl.classList.remove("on");
}

function openSheet(html) {
  const s = ensureSheet();
  const bodyEl = s.querySelector(".sheet-body");
  bodyEl.innerHTML = html;
  s.classList.add("on");
  bodyEl.scrollTop = 0;
  bodyEl.querySelectorAll("[data-prophet]").forEach((el) => {
    el.onclick = () => openProphetSheet(el.getAttribute("data-prophet"));
  });
  bodyEl.querySelectorAll("[data-king]").forEach((el) => {
    el.onclick = () => {
      const nm = el.getAttribute("data-king");
      const lane = el.getAttribute("data-lane");
      const k = KINGS_GANTT[lane].filter((x) => x.name === nm)[0];
      if (k) openKingSheet(k, lane === "judah" ? "יהודה" : "ישראל");
    };
  });
  bodyEl.querySelectorAll("[data-event]").forEach((el) => {
    const ev = ARCHAEOLOGY.items[+el.getAttribute("data-event")];
    if (ev) el.onclick = () => openEventSheet(ev);
  });
  bodyEl.querySelectorAll("[data-jd]").forEach((el) => {
    el.onclick = () => openJudaismSheet(+el.getAttribute("data-jd"));
  });
}

function prophetChips(prophetStr) {
  return prophetStr.split(",").map((p) => p.trim()).filter(Boolean)
    .map((p) => '<button type="button" class="chip-link" data-prophet="' + p + '">' + p + '</button>')
    .join("");
}

function eventsInRange(startYear, endYear) {
  return ARCHAEOLOGY.items
    .map((it, idx) => ({ it, idx }))
    .filter((o) => o.it.year <= startYear && o.it.year >= endYear);
}

// שנת המיקום על הציר היא לצורכי פריסה בלבד; להצגה משתמשים תמיד בתיארוך האמיתי
function shortYear(ev) {
  return ev.yearLabel.replace(/\s*לפנה"ס\s*$/, "");
}

function openKingSheet(k, kingdom) {
  const yearCount = k.start - k.end;
  const yearWord = yearCount === 0 ? "פחות משנה" : yearCount === 1 ? "שנה אחת" : yearCount === 2 ? "שנתיים" : yearCount + " שנים";
  const years = k.start === k.end ? (k.start + ' לפנה"ס') : (k.start + '–' + k.end + ' לפנה"ס');
  const evs = eventsInRange(k.start, k.end);
  const kindOf = (o) => ARCHAEOLOGY.kinds[o.it.kind];
  openSheet(
    '<div class="sheet-eyebrow">' + (kingdom === "יהודה" ? "ממלכת יהודה" : "ממלכת ישראל") + '</div>' +
    '<h3 class="sheet-title">' + k.name + (k.important ? ' <span class="kd-important">מלך מרכזי</span>' : '') + '</h3>' +
    '<div class="sheet-years">' + years + ' · ' + yearWord + '</div>' +
    (k.note ? '<p class="sheet-note">' + k.note + '</p>' : '') +
    (k.prophet
      ? '<div class="sheet-block"><div class="sheet-label">נביאים בני התקופה</div><div class="chip-row">' + prophetChips(k.prophet) + '</div></div>'
      : '<div class="sheet-block"><div class="sheet-label">נביאים בני התקופה</div><div class="sheet-empty">לא מצוינים נביאים לתקופה זו בטבלה.</div></div>') +
    '<div class="sheet-block"><div class="sheet-label">מה קרה בימיו</div>' +
      (evs.length
        ? '<div class="sheet-events">' + evs.map((o) =>
            '<button type="button" class="sheet-ev" style="--ec:' + kindOf(o).color + '" data-event="' + o.idx + '">' +
              '<span class="sheet-ev-year">' + shortYear(o.it) + '</span>' +
              '<span class="sheet-ev-title">' + o.it.title + '</span>' +
            '</button>').join("") + '</div>'
        : '<div class="sheet-empty">אין בטבלה ממצא או אירוע מתוארך לשנות מלכותו.</div>') +
    '</div>'
  );
}

function openProphetSheet(name) {
  const p = PROPHETS[name];
  const served = [];
  ["judah", "israel"].forEach((lane) => {
    KINGS_GANTT[lane].forEach((k) => {
      if ((k.prophet || "").split(",").map((x) => x.trim()).indexOf(name) !== -1) {
        served.push({ k, lane });
      }
    });
  });
  openSheet(
    '<div class="sheet-eyebrow">נביא' + (p ? " · " + p.kingdom : "") + '</div>' +
    '<h3 class="sheet-title">' + name + '</h3>' +
    (p ? '<div class="sheet-years">' + p.era + '</div><p class="sheet-note">' + p.known + '</p>' : '') +
    '<div class="sheet-block"><div class="sheet-label">מלכים שבימיהם ניבא, לפי הטבלה</div>' +
      (served.length
        ? '<div class="chip-row">' + served.map((s) =>
            '<button type="button" class="chip-link" data-king="' + s.k.name + '" data-lane="' + s.lane + '">' +
            s.k.name + ' <span class="chip-sub">' + s.k.start + '–' + s.k.end + '</span></button>').join("") + '</div>'
        : '<div class="sheet-empty">אינו מופיע בטבלת המלכים.</div>') +
    '</div>'
  );
}

// תמונת הממצא + שורת קרדיט ורישיון, כנדרש ברישיונות ויקישיתוף
function findImage(ev, cls) {
  if (!ev.image) return "";
  const im = ev.image;
  return '<figure class="find-img ' + (cls || "") + '">' +
    '<img src="' + im.file + '" alt="' + (im.caption || ev.title) + '" loading="lazy" decoding="async">' +
    '<figcaption>' +
      (im.caption ? '<span class="fi-cap">' + im.caption + '</span>' : '') +
      '<span class="fi-credit">' + im.credit + ' · ' + im.license + ' · ' +
      '<a href="' + im.source + '" target="_blank" rel="noopener noreferrer">ויקישיתוף</a></span>' +
    '</figcaption></figure>';
}

function openEventSheet(ev) {
  const kind = ARCHAEOLOGY.kinds[ev.kind];
  const rulers = rulersText(ev.year);
  openSheet(
    '<div class="sheet-eyebrow" style="color:' + kind.color + '">' + kind.label + '</div>' +
    '<h3 class="sheet-title">' + ev.title + '</h3>' +
    '<div class="sheet-years">' + ltrNums(ev.yearLabel) + '</div>' +
    (rulers ? '<div class="sheet-rulers">' + rulers + '</div>' : '') +
    findImage(ev, "in-sheet") +
    '<p class="sheet-note">' + ltrNums(ev.desc) + '</p>' +
    (ev.where ? '<div class="sheet-block"><div class="sheet-label">היכן היום</div><div class="sheet-where">' + ev.where + '</div></div>' : '')
  );
}

function openMilestoneSheet(m) {
  openSheet(
    '<div class="sheet-eyebrow">אבן דרך</div>' +
    '<h3 class="sheet-title">' + m.title + '</h3>' +
    '<div class="sheet-years">' + m.year + ' לפנה"ס</div>' +
    '<p class="sheet-note">' + m.desc + '</p>'
  );
}

function renderKingsTable() {
  mode = "kings";
  updateScorebar();
  app.innerHTML = "";

  const h = document.createElement("div");
  h.className = "section-title";
  h.style.textAlign = "center";
  h.textContent = "מלכי ישראל ויהודה";
  app.appendChild(h);
  const sub = document.createElement("div");
  sub.className = "section-sub";
  sub.style.textAlign = "center";
  sub.textContent = "כל השנים לפני הספירה — הקישו על מלך לפרטים";
  app.appendChild(sub);

  const strip = document.createElement("div");
  strip.className = "united-strip";
  KINGS_GANTT.united.forEach((k) => {
    const item = document.createElement("div");
    item.className = "united-item";
    item.innerHTML = '<div class="u-name">' + k.name + '</div><div class="u-years">' + k.start + '–' + k.end + ' לפנה"ס</div>';
    strip.appendChild(item);
  });
  app.appendChild(strip);

  const legend = document.createElement("div");
  legend.className = "kg-legend";
  legend.innerHTML =
    '<span><span class="dot" style="background:var(--judah)"></span>מלכי יהודה</span>' +
    '<span><span class="dot" style="background:var(--israel)"></span>מלכי ישראל</span>' +
    '<span><span class="dot" style="background:transparent;border-radius:50%;box-shadow:0 0 0 2px var(--gold) inset"></span>מלך מרכזי</span>' +
    '<span><span class="kg-prophet-pill-legend">נביא</span>נביא בן התקופה</span>';
  app.appendChild(legend);

  const evLegend = document.createElement("div");
  evLegend.className = "kg-legend kg-legend-ev";
  evLegend.innerHTML = Object.keys(ARCHAEOLOGY.kinds).map((key) => {
    const k = ARCHAEOLOGY.kinds[key];
    return '<span><span class="dot" style="background:' + k.color + '"></span>' + k.label + '</span>';
  }).join("");
  app.appendChild(evLegend);

  const allEntries = KINGS_GANTT.judah.concat(KINGS_GANTT.israel);
  const AXIS_START = Math.max(...allEntries.map((k) => k.start));
  const AXIS_END = KINGS_GANTT.axisEnd;
  // במסך צר נותנים לכל שנה יותר גובה, כדי שגם מלכים שמלכו שנים ספורות
  // יקבלו מקום לשם ולנביא בתוך הבלוק עצמו במקום תווית דחוסה בצד
  const narrow = window.matchMedia("(max-width: 760px)").matches;
  const SCALE_V = narrow ? 4.4 : 2.6;
  const totalYears = AXIS_START - AXIS_END;
  const chartHeight = Math.round(totalYears * SCALE_V);
  const INLINE_MIN = narrow ? 30 : 26;
  const NAME_MIN = narrow ? 20 : 18;

  function yTop(year) { return Math.round((AXIS_START - year) * SCALE_V); }

  const vwrap = document.createElement("div");
  vwrap.className = "kg-vwrap";

  const heads = document.createElement("div");
  heads.className = "kg-vheads";
  heads.innerHTML =
    '<div class="kg-vhead" style="--kc:var(--judah)"><span class="dot"></span>יהודה</div>' +
    '<div></div>' +
    '<div class="kg-vhead" style="--kc:var(--israel)"><span class="dot"></span>ישראל</div>' +
    '<div class="kg-vhead kg-vhead-ev">אירועים וממצאים</div>';
  vwrap.appendChild(heads);

  const body = document.createElement("div");
  body.className = "kg-vbody";
  body.style.height = chartHeight + "px";

  const tickStep = 20;
  for (let y = Math.floor(AXIS_START / tickStep) * tickStep; y >= AXIS_END; y -= tickStep) {
    if (y > AXIS_START) continue;
    const line = document.createElement("div");
    line.className = "kg-vgridline";
    line.style.top = yTop(y) + "px";
    body.appendChild(line);
  }

  // אבני הדרך: פילוג הממלכה ונפילת כל אחת מהממלכות — פסים לרוחב כל הגרף
  MILESTONES.forEach((m) => {
    if (m.year > AXIS_START || m.year < AXIS_END) return;
    const y = yTop(m.year);
    const band = document.createElement("button");
    band.type = "button";
    // הקו נשאר בשנה המדויקת; רק תווית הקצה נדחפת פנימה כדי לא לחפוף לכותרות
    band.className = "kg-milestone" + (y < 14 ? " at-top" : y > chartHeight - 14 ? " at-bottom" : "");
    band.style.top = y + "px";
    band.innerHTML = '<span class="ms-label">' + m.title + ' · ' + m.year + '</span>';
    band.title = m.title + " (" + m.year + " לפנה\"ס)";
    band.onclick = () => openMilestoneSheet(m);
    body.appendChild(band);
  });

  function computeProphetRuns(kings) {
    const seq = kings.filter((k) => !k.row && !k.isEvent);
    const runs = [];
    let cur = null;
    seq.forEach((k) => {
      if (!k.prophet) { cur = null; return; }
      if (cur && cur.text === k.prophet) {
        cur.endYear = k.end;
        cur.members.push(k);
      } else {
        cur = { text: k.prophet, startYear: k.start, endYear: k.end, members: [k] };
        runs.push(cur);
      }
    });
    runs.forEach((run) => {
      const soleHeight = run.members.length === 1 ? (run.members[0].start - run.members[0].end) * SCALE_V : 0;
      run.external = !(run.members.length === 1 && soleHeight >= 26);
      if (run.external) run.members.forEach((m) => { m._extProphet = true; });
    });
    return runs;
  }

  const judahRuns = computeProphetRuns(KINGS_GANTT.judah);
  const israelRuns = computeProphetRuns(KINGS_GANTT.israel);

  function buildCol(className, colorVar, kings, title) {
    const col = document.createElement("div");
    col.className = "kg-vcol " + className;
    kings.forEach((k) => {
      const bar = document.createElement("button");
      bar.type = "button";
      const isCoRegent = !!k.row;
      const hasProphet = !!k.prophet;
      bar.className = "kg-vbar" +
        (k.isEvent ? " event-marker" : "") +
        (isCoRegent ? " co-regent" : "") +
        (k.important ? " important" : "");
      const trueHeight = (k.start - k.end) * SCALE_V;
      const height = Math.max(trueHeight, k.isEvent ? 8 : 4);
      bar.style.height = height + "px";
      bar.style.top = yTop(k.start) + "px";
      bar.style.zIndex = isCoRegent ? 10 : (height < 16 ? 4 : 1);
      if (!k.isEvent) bar.style.background = colorVar;
      if (height < NAME_MIN && !k.isEvent) {
        bar.classList.add("thin");
      } else {
        const nameSpan = document.createElement("span");
        nameSpan.className = "kv-name";
        nameSpan.textContent = k.name;
        bar.appendChild(nameSpan);
        if (hasProphet && height >= INLINE_MIN && !k._extProphet) {
          const propSpan = document.createElement("span");
          propSpan.className = "kv-prophet";
          propSpan.textContent = k.prophet;
          bar.appendChild(propSpan);
        }
      }
      bar.title = k.name + " (" + (k.start === k.end ? k.start : k.start + "–" + k.end) + " לפנה\"ס)" + (k.prophet ? " — נביא: " + k.prophet : "") + (k.important ? " — מלך מרכזי" : "");
      bar.onclick = () => {
        body.querySelectorAll(".kg-vbar.active, .kg-ev-label.active, .kg-prophet-pill.active").forEach((b) => b.classList.remove("active"));
        bar.classList.add("active");
        openKingSheet(k, title);
      };
      col.appendChild(bar);
    });
    return col;
  }

  function renderProphetPills(runs, side, host) {
    runs.filter((r) => r.external).forEach((run) => {
      const topPx = yTop(run.startYear);
      const botPx = yTop(run.endYear);
      const names = run.text.split(",").map((x) => x.trim()).filter(Boolean);
      const pill = document.createElement("button");
      pill.type = "button";
      pill.className = "kg-prophet-pill kg-prophet-pill-" + side;
      pill.style.top = Math.round((topPx + botPx) / 2) + "px";
      pill.textContent = run.text;
      pill.title = "נביא: " + run.text + " — בימי " + run.members.map((m) => m.name).join(", ");
      pill.onclick = () => {
        body.querySelectorAll(".kg-vbar.active, .kg-ev-label.active, .kg-prophet-pill.active").forEach((b) => b.classList.remove("active"));
        pill.classList.add("active");
        if (names.length === 1) openProphetSheet(names[0]);
        else openSheet(
          '<div class="sheet-eyebrow">נביאים בני התקופה</div>' +
          '<h3 class="sheet-title">' + run.text + '</h3>' +
          '<div class="sheet-years">בימי ' + run.members.map((m) => m.name).join(", ") + '</div>' +
          '<div class="sheet-block"><div class="sheet-label">בחרו נביא לפרטים</div>' +
          '<div class="chip-row">' + prophetChips(run.text) + '</div></div>'
        );
      };
      host.appendChild(pill);
    });
  }

  // עמודת האירועים: סימון על מסילה במיקום השנה המדויק, ותווית שנדחקת מטה כדי לא לחפוף לקודמתה
  function buildEventsCol() {
    const col = document.createElement("div");
    col.className = "kg-vcol kg-vcol-events";
    const rail = document.createElement("div");
    rail.className = "kg-ev-rail";
    col.appendChild(rail);

    const LABEL_H = 22;
    const GAP = 4;
    let prevBottom = -Infinity;

    ARCHAEOLOGY.items.filter((it) => it.chart && it.year <= AXIS_START && it.year >= AXIS_END).forEach((ev) => {
      const y = yTop(ev.year);
      const kind = ARCHAEOLOGY.kinds[ev.kind];

      const dot = document.createElement("div");
      dot.className = "kg-ev-dot";
      dot.style.top = y + "px";
      dot.style.background = kind.color;
      col.appendChild(dot);

      const label = document.createElement("button");
      label.type = "button";
      label.className = "kg-ev-label";
      label.style.setProperty("--ec", kind.color);
      let top = y - LABEL_H / 2;
      if (top < prevBottom + GAP) top = prevBottom + GAP;
      prevBottom = top + LABEL_H;
      label.style.top = top + "px";
      label.innerHTML =
        '<span class="ev-year">' + ev.year + '</span>' +
        '<span class="ev-title">' + ev.short + '</span>';
      label.title = ev.yearLabel + " — " + ev.title;
      label.onclick = () => {
        body.querySelectorAll(".kg-vbar.active, .kg-ev-label.active, .kg-prophet-pill.active").forEach((b) => b.classList.remove("active"));
        label.classList.add("active");
        openEventSheet(ev);
      };
      col.appendChild(label);
    });
    return col;
  }

  const axisCol = document.createElement("div");
  axisCol.className = "kg-vaxis";
  for (let y = Math.floor(AXIS_START / tickStep) * tickStep; y >= AXIS_END; y -= tickStep) {
    if (y > AXIS_START) continue;
    const tick = document.createElement("div");
    tick.className = "kg-vtick";
    tick.style.top = yTop(y) + "px";
    tick.textContent = y;
    axisCol.appendChild(tick);
  }
  renderProphetPills(judahRuns, "judah", axisCol);
  renderProphetPills(israelRuns, "israel", axisCol);

  // סדר ה-DOM ב-RTL: הפריט הראשון הוא הימני ביותר
  body.appendChild(buildCol("kg-vcol-judah", "var(--judah)", KINGS_GANTT.judah, "יהודה"));
  body.appendChild(axisCol);
  body.appendChild(buildCol("kg-vcol-israel", "var(--israel)", KINGS_GANTT.israel, "ישראל"));
  body.appendChild(buildEventsCol());

  vwrap.appendChild(body);
  app.appendChild(vwrap);

  const src = document.createElement("div");
  src.className = "kg-source";
  src.textContent = KINGS_GANTT.source;
  app.appendChild(src);

  const back = document.createElement("div");
  back.className = "backlink";
  back.textContent = "⟵ חזרה למסך הראשי";
  back.onclick = returnFromView;
  const centerWrap = document.createElement("div");
  centerWrap.style.textAlign = "center";
  centerWrap.appendChild(back);
  app.appendChild(centerWrap);
  window.scrollTo(0, 0);
}

/* ============================= Archaeology section ============================= */

let archFilter = "all";

function renderArchSection() {
  mode = "arch";
  updateScorebar();
  app.innerHTML = "";

  const h = document.createElement("div");
  h.className = "section-title";
  h.style.textAlign = "center";
  h.textContent = "ממצאים, מצורים וביצורים — הברזל";
  app.appendChild(h);
  const sub = document.createElement("div");
  sub.className = "section-sub";
  sub.style.textAlign = "center";
  sub.textContent = "תקופת המלכים, 928–586 לפנה\"ס — מסודר מהמוקדם למאוחר, עם ציון מי מלך באותה שנה";
  app.appendChild(sub);

  const chips = document.createElement("div");
  chips.className = "arch-chips";
  const list = document.createElement("div");
  list.className = "arch-list";

  const options = [["all", "הכול", "var(--sub)"]].concat(
    Object.keys(ARCHAEOLOGY.kinds).map((key) => [key, ARCHAEOLOGY.kinds[key].label, ARCHAEOLOGY.kinds[key].color])
  );

  function drawList() {
    list.innerHTML = "";
    const items = ARCHAEOLOGY.items.filter((it) => archFilter === "all" || it.kind === archFilter);
    items.forEach((it) => {
      const kind = ARCHAEOLOGY.kinds[it.kind];
      const card = document.createElement("div");
      card.className = "arch-card";
      card.style.setProperty("--ec", kind.color);
      const rulers = rulersText(it.year);
      card.innerHTML =
        (it.image ? '<div class="arch-media">' + findImage(it) + '</div>' : '') +
        '<div class="arch-body">' +
          '<div class="arch-head">' +
            '<span class="arch-year">' + ltrNums(it.yearLabel) + '</span>' +
            '<span class="arch-kind">' + kind.label + '</span>' +
          '</div>' +
          '<h3>' + it.title + '</h3>' +
          (rulers ? '<div class="arch-rulers">' + rulers + '</div>' : '') +
          '<p class="arch-desc">' + ltrNums(it.desc) + '</p>' +
          (it.where ? '<div class="arch-where">היכן היום: ' + it.where + '</div>' : '') +
        '</div>';
      list.appendChild(card);
    });
    const count = document.createElement("div");
    count.className = "arch-count";
    count.textContent = items.length + " פריטים";
    list.appendChild(count);
  }

  options.forEach(([key, label, color]) => {
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "arch-chip" + (archFilter === key ? " on" : "");
    chip.style.setProperty("--ec", color);
    chip.textContent = label;
    chip.onclick = () => {
      archFilter = key;
      chips.querySelectorAll(".arch-chip").forEach((c) => c.classList.remove("on"));
      chip.classList.add("on");
      drawList();
    };
    chips.appendChild(chip);
  });

  app.appendChild(chips);
  drawList();
  app.appendChild(list);

  const back = document.createElement("div");
  back.className = "backlink";
  back.textContent = "⟵ חזרה למסך הראשי";
  back.onclick = returnFromView;
  const centerWrap = document.createElement("div");
  centerWrap.style.textAlign = "center";
  centerWrap.appendChild(back);
  app.appendChild(centerWrap);
  window.scrollTo(0, 0);
}

/* ============================= יהדות ============================= */

let judView = "chain";        // chain | centers | foundations
let judFocus = true;          // ברירת מחדל: רק מה שחייבים לדעת
let judClosed = {};           // תקופות מקופלות

const JD_ICONS = {
  star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3.5 2.6 5.6 6 .8-4.4 4.2 1.1 6.1L12 17.3 6.7 20.2l1.1-6.1L3.4 9.9l6-.8Z"/></svg>',
  chev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
  fold: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 15 5-5 5 5M7 9l5-5 5 5"/></svg>',
  unfold: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 9 5 5 5-5M7 15l5 5 5-5"/></svg>',
};

function openJudaismSheet(idx) {
  const it = JUDAISM.chain[idx];
  const era = JUDAISM.eras[it.era];
  const prev = JUDAISM.chain[idx - 1];
  const next = JUDAISM.chain[idx + 1];

  function fact(label, value) {
    return value ? "<dt>" + label + "</dt><dd>" + ltrNums(value) + "</dd>" : "";
  }

  openSheet(
    '<div class="sheet-eyebrow" style="color:' + era.color + '">' + era.label + '</div>' +
    '<h3 class="sheet-title">' + it.title + '</h3>' +
    '<div class="sheet-years">' + ltrNums(it.yearLabel) + '</div>' +
    '<dl class="jd-facts">' +
      fact("מי", it.author) +
      fact("מתי", it.when) +
      fact("היכן", it.where) +
    '</dl>' +
    '<p class="sheet-note">' + ltrNums(it.role) + '</p>' +
    (it.site
      ? '<div class="sheet-block"><div class="sheet-label">היכן בארץ</div><div class="sheet-where">' + it.site + '</div></div>'
      : '') +
    '<div class="jd-nav">' +
      (prev ? '<button type="button" class="chip-link" data-jd="' + (idx - 1) + '">הקודם: ' + prev.short + '</button>' : '') +
      (next ? '<button type="button" class="chip-link" data-jd="' + (idx + 1) + '">הבא: ' + next.short + '</button>' : '') +
    '</div>'
  );
}

function judKeyCount() {
  return JUDAISM.chain.filter(function (it) { return it.important; }).length;
}

function renderJudaismSection() {
  mode = "judaism";
  updateScorebar();
  app.innerHTML = "";

  const h = document.createElement("div");
  h.className = "section-title";
  h.style.textAlign = "center";
  h.textContent = "יהדות — ספרים, חכמים ומרכזים";
  app.appendChild(h);
  const sub = document.createElement("div");
  sub.className = "section-sub";
  sub.style.textAlign = "center";
  sub.textContent = "שרשרת אחת מחתימת התנ\"ך ועד ימינו: מה נכתב, בידי מי, מתי, איפה — והיכן בארץ אפשר לעמוד על זה";
  app.appendChild(sub);

  /* ---------- מתג תצוגות ---------- */
  const views = document.createElement("div");
  views.className = "jd-views";
  views.setAttribute("role", "tablist");
  const body = document.createElement("div");

  const VIEWS = [
    ["chain", "שרשרת הספרים"],
    ["centers", "מרכזי התורה"],
    ["foundations", "יסודות"],
  ];
  VIEWS.forEach(function (v) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "jd-view" + (judView === v[0] ? " on" : "");
    b.textContent = v[1];
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", judView === v[0] ? "true" : "false");
    b.onclick = function () {
      judView = v[0];
      views.querySelectorAll(".jd-view").forEach(function (x, i) {
        const on = VIEWS[i][0] === judView;
        x.classList.toggle("on", on);
        x.setAttribute("aria-selected", on ? "true" : "false");
      });
      drawBody();
    };
    views.appendChild(b);
  });
  app.appendChild(views);
  app.appendChild(body);

  /* ---------- תצוגת השרשרת ---------- */
  function drawChain() {
    const toolbar = document.createElement("div");
    toolbar.className = "jd-toolbar";

    const focusBtn = document.createElement("button");
    focusBtn.type = "button";
    focusBtn.className = "jd-focus" + (judFocus ? " on" : "");
    focusBtn.setAttribute("aria-pressed", judFocus ? "true" : "false");
    const nKey = judKeyCount(), nAll = JUDAISM.chain.length;
    focusBtn.innerHTML = JD_ICONS.star + "רק מה שחייבים לדעת" +
      '<span class="jd-tally">' + (judFocus ? nKey : nAll) + " / " + nAll + "</span>";

    const foldBtn = document.createElement("button");
    foldBtn.type = "button";
    foldBtn.className = "jd-allbtn";

    const chain = document.createElement("div");
    chain.className = "jd-chain";

    function anyOpen() {
      return Object.keys(JUDAISM.eras).some(function (k) { return !judClosed[k]; });
    }
    function syncFold() {
      const open = anyOpen();
      foldBtn.innerHTML = (open ? JD_ICONS.fold : JD_ICONS.unfold) + (open ? "כווץ הכול" : "פתח הכול");
    }

    function drawChainList() {
      chain.innerHTML = "";
      let shown = 0;

      Object.keys(JUDAISM.eras).forEach(function (eraKey) {
        const era = JUDAISM.eras[eraKey];
        const items = JUDAISM.chain
          .map(function (it, idx) { return { it: it, idx: idx }; })
          .filter(function (o) {
            return o.it.era === eraKey && (!judFocus || o.it.important);
          });
        if (!items.length) return;

        const group = document.createElement("section");
        group.className = "jd-eragroup" + (judClosed[eraKey] ? " closed" : "");
        group.style.setProperty("--ec", era.color);

        const head = document.createElement("button");
        head.type = "button";
        head.className = "jd-era";
        head.setAttribute("aria-expanded", judClosed[eraKey] ? "false" : "true");
        head.innerHTML =
          '<span class="jd-chev">' + JD_ICONS.chev + '</span>' +
          '<span class="jd-era-txt">' +
            '<span class="jd-era-name">' + era.label + '</span>' +
            '<span class="jd-era-range">' + ltrNums(era.range) + '</span>' +
          '</span>' +
          '<span class="jd-era-count">' + items.length + '</span>';
        head.onclick = function () {
          judClosed[eraKey] = !judClosed[eraKey];
          group.classList.toggle("closed", judClosed[eraKey]);
          head.setAttribute("aria-expanded", judClosed[eraKey] ? "false" : "true");
          syncFold();
        };
        group.appendChild(head);

        const bodyWrap = document.createElement("div");
        bodyWrap.className = "jd-erabody";
        const inner = document.createElement("div");
        inner.className = "jd-erabody-inner";

        items.forEach(function (o) {
          const it = o.it;
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "jd-item" + (it.important ? "" : " slim");
          btn.innerHTML =
            '<span class="jd-year">' + ltrNums(it.yearLabel) + '</span>' +
            '<span class="jd-name">' + it.title +
              (it.important ? '<span class="jd-flag">לזכור</span>' : '') +
            '</span>' +
            '<span class="jd-meta">' + ltrNums(it.author + (it.where ? " · " + it.where : "")) + '</span>';
          btn.onclick = function () { openJudaismSheet(o.idx); };
          inner.appendChild(btn);
          shown++;
        });

        bodyWrap.appendChild(inner);
        group.appendChild(bodyWrap);
        chain.appendChild(group);
      });

      const count = document.createElement("div");
      count.className = "jd-count";
      count.textContent = judFocus
        ? shown + " פריטי ליבה — לחצו על הכפתור למעלה כדי לראות את כל " + JUDAISM.chain.length
        : shown + " פריטים בשרשרת";
      chain.appendChild(count);
      syncFold();
    }

    focusBtn.onclick = function () {
      judFocus = !judFocus;
      focusBtn.classList.toggle("on", judFocus);
      focusBtn.setAttribute("aria-pressed", judFocus ? "true" : "false");
      focusBtn.innerHTML = JD_ICONS.star + "רק מה שחייבים לדעת" +
        '<span class="jd-tally">' + (judFocus ? nKey : nAll) + " / " + nAll + "</span>";
      drawChainList();
    };
    foldBtn.onclick = function () {
      const close = anyOpen();
      Object.keys(JUDAISM.eras).forEach(function (k) { judClosed[k] = close; });
      chain.querySelectorAll(".jd-eragroup").forEach(function (g) { g.classList.toggle("closed", close); });
      chain.querySelectorAll(".jd-era").forEach(function (b) { b.setAttribute("aria-expanded", close ? "false" : "true"); });
      syncFold();
    };

    toolbar.appendChild(focusBtn);
    toolbar.appendChild(foldBtn);
    body.appendChild(toolbar);
    drawChainList();
    body.appendChild(chain);
  }

  /* ---------- מרכזי התורה ---------- */
  function drawCenters() {
    const ch = document.createElement("div");
    ch.className = "jd-blockhead";
    ch.innerHTML = "<h3>לאן נדד מרכז התורה</h3><p>אותה שרשרת, הפעם לפי מפה: כל תחנה ומה נוצר בה</p>";
    body.appendChild(ch);

    const centers = document.createElement("div");
    centers.className = "jd-centers";
    JUDAISM.centers.forEach(function (c, i) {
      const card = document.createElement("div");
      card.className = "jd-center";
      card.innerHTML =
        '<div class="jd-center-step">תחנה ' + (i + 1) + '</div>' +
        '<h4>' + c.place + '</h4>' +
        '<div class="jd-center-when">' + ltrNums(c.when) + '</div>' +
        '<div class="jd-center-what">' + ltrNums(c.what) + '</div>';
      centers.appendChild(card);
    });
    body.appendChild(centers);
  }

  /* ---------- יסודות ---------- */
  function drawFoundations() {
    const fh = document.createElement("div");
    fh.className = "jd-blockhead";
    fh.innerHTML = "<h3>יסודות שחייבים לדעת</h3><p>העובדות שנשאלות ישירות, ולצדן המלכודת שנלווית לכל אחת</p>";
    body.appendChild(fh);

    const found = document.createElement("div");
    found.className = "jd-found";
    JUDAISM.foundations.forEach(function (f) {
      const card = document.createElement("div");
      card.className = "jd-fcard";
      card.innerHTML =
        '<h4>' + f.q + '</h4>' +
        '<p>' + ltrNums(f.a) + '</p>' +
        (f.note ? '<p class="jd-fnote">' + ltrNums(f.note) + '</p>' : '');
      found.appendChild(card);
    });
    body.appendChild(found);
  }

  function drawBody() {
    body.innerHTML = "";
    if (judView === "chain") drawChain();
    else if (judView === "centers") drawCenters();
    else drawFoundations();
  }
  drawBody();

  const back = document.createElement("div");
  back.className = "backlink";
  back.textContent = "⟵ חזרה למסך הראשי";
  back.onclick = returnFromView;
  const centerWrap = document.createElement("div");
  centerWrap.style.textAlign = "center";
  centerWrap.appendChild(back);
  app.appendChild(centerWrap);
  window.scrollTo(0, 0);
}

/* ============================= Home ============================= */

function renderHome() {
  activeEntryView = null;
  document.body.removeAttribute("data-view");
  appTitle.textContent = "ציר הזמן ההיסטורי — קורס מורי דרך";
  appSubtitle.textContent = "תיארוך, אירועים ודמויות: להבין מה קדם למה";
  mode = "home";
  updateScorebar();
  app.innerHTML = "";
  const wrap = document.createElement("div");

  const intro = document.createElement("div");
  intro.className = "home-hero";
  const stripColors = ["var(--line)", "var(--line)", "var(--judah-soft)", "var(--judah)", "var(--judah)", "var(--gold)", "var(--gold)", "var(--israel-soft)", "var(--israel)", "var(--israel)", "var(--ink)", "var(--gold)", "var(--judah)", "var(--israel)", "var(--gold)", "var(--ink)"];
  let stripHtml = '<div class="hero-strip">' + stripColors.map((c) => '<span style="background:' + c + '"></span>').join("") + '</div>';
  intro.innerHTML = stripHtml + "<h2>מה קדם למה?</h2><p>חמישה כלי תרגול שמתמקדים אך ורק בציר הזמן ההיסטורי — תיארוך תקופות ואירועים, סדר כרונולוגי, תקופות מקבילות, והממצאים שמתארכים אותן.</p>";
  wrap.appendChild(intro);

  const grid = document.createElement("div");
  grid.className = "mode-grid";

  const ICONS = {
    calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M16 2.5v4M8 2.5v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 17.5h.01M12 17.5h.01"/></svg>',
    compass: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><polygon points="15.5 8.5 13.3 13.3 8.5 15.5 10.7 10.7 15.5 8.5"/></svg>',
    crown: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 18h17M4.5 18 3 8.2l5.2 3.8L12 5.5l3.8 6.5L21 8.2 19.5 18"/></svg>',
    stele: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 21V6.5a5 5 0 0 1 10 0V21"/><path d="M4.5 21h15"/><path d="M10 10h4M10 13.5h4M10 17h2"/></svg>',
    scroll: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h12a2 2 0 0 1 2 2V18a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 18V5.5a2 2 0 0 1 2-2Z"/><path d="M8 8h8M8 11.5h8M8 15h5"/></svg>',
  };
  const cards = [
    { key: "dating", icon: ICONS.calendar, accent: "var(--gold)", title: "שאלוני תיארוך", desc: "מתי הייתה כל תקופה, מה קרה קודם, ואיזו תקופה מקבילה לאיזו — לפי נושא." },
    { key: "drag", icon: ICONS.compass, accent: "var(--israel)", title: "ציר זמן גרירה", desc: "הציבו תקופות, אירועים ודמויות במקומם הכרונולוגי הנכון על ציר הזמן." },
    { key: "kings", icon: ICONS.crown, accent: "var(--judah)", title: "מלכי ישראל ויהודה", desc: "גרף זמן מלא: כל המלכים על ציר משותף, לפי שנות מלכותם, הנביאים בני זמנם והאירועים שבתקופתם." },
    { key: "archaeology", icon: ICONS.stele, accent: "var(--ev-camp)", title: "ממצאים, מצורים וביצורים", desc: "מסעות וקרבות, כתובות וחרסים, תבליטים וחומות — מה נמצא, מתי, ובימי איזה מלך." },
    { key: "judaism", icon: ICONS.scroll, accent: "var(--ev-fort)", title: "יהדות — ספרים, חכמים ומרכזים", desc: "שרשרת אחת מחתימת התנ\"ך ועד ימינו: מה נכתב, בידי מי, מתי, איפה — ולאן נדד מרכז התורה." },
  ];
  cards.forEach((c) => {
    const card = document.createElement("div");
    card.className = "mode-card";
    card.style.setProperty("--mc", c.accent);
    card.innerHTML = '<div class="icon-badge">' + c.icon + '</div><h3>' + c.title + '</h3><p>' + c.desc + '</p>';
    card.onclick = () => showEntryView(c.key, true);
    grid.appendChild(card);
  });
  wrap.appendChild(grid);
  app.appendChild(wrap);
}

if (ENTRY_VIEWS[activeEntryView]) showEntryView(activeEntryView, false);
else renderHome();

</script>
</body>
</html>
