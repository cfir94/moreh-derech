<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ציר הזמן ההיסטורי — מורי דרך</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@600;700;800;900&family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f2ede1;
    --bg-glow-1: rgba(168,105,15,.14);
    --bg-glow-2: rgba(31,122,103,.10);
    --surface: #fffdf8;
    --card: rgba(32,26,17,.035);
    --card-2: rgba(32,26,17,.065);
    --line: rgba(32,26,17,.13);
    --line-soft: rgba(32,26,17,.09);
    --ink: #211a10;
    --sub: #6d6252;
    --title-1: #201a10;
    --title-2: #a8690f;
    --judah: #b5541c;
    --judah-soft: rgba(181,84,28,.13);
    --israel: #1f7a67;
    --israel-soft: rgba(31,122,103,.13);
    --gold: #a8690f;
    --gold-soft: rgba(168,105,15,.14);
    --ev-camp: #8c2f39;
    --ev-siege: #2f2a24;
    --ev-find: #a8690f;
    --ev-fort: #4a6572;
    --good: #1f8a4c;
    --good-soft: rgba(31,138,76,.13);
    --bad: #c23b2e;
    --bad-soft: rgba(194,59,46,.12);
    --on-accent: #fffaf0;
    --shadow: 0 6px 18px -10px rgba(32,26,17,.28);
    --shadow-lift: 0 18px 36px -16px rgba(32,26,17,.4);
    --r-lg: 24px;
    --r-md: 16px;
    --r-sm: 11px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Heebo", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    margin: 0;
    padding: 0 0 90px;
    line-height: 1.6;
  }
  h1, h2, h3, .display { font-family: "Heebo", Arial, sans-serif; font-weight: 800; text-wrap: balance; letter-spacing: -0.01em; }
  button, input { font-family: "Heebo", Arial, sans-serif; }
  :focus-visible { outline: 2.5px solid var(--gold); outline-offset: 2px; }

  header {
    position: relative;
    background: var(--ink);
    color: var(--on-accent);
    overflow: hidden;
  }
  header::before, header::after {
    content: "";
    position: absolute;
    width: 280px; height: 280px;
    border-radius: 50%;
    filter: blur(50px);
    pointer-events: none;
  }
  header::before { top: -140px; inset-inline-end: -60px; background: rgba(168,105,15,.35); }
  header::after { bottom: -160px; inset-inline-start: 10%; background: rgba(31,122,103,.28); }
  .header-inner { position: relative; max-width: 900px; margin: 0 auto; padding: 22px 24px 20px; }
  .header-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
  header h1 { margin: 0 0 5px; font-size: 21px; font-weight: 800; }
  header .sub { font-size: 13px; opacity: 0.7; font-weight: 500; }
  .home-btn {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,250,240,0.1);
    border: 1.5px solid rgba(255,250,240,0.26);
    color: var(--on-accent);
    border-radius: 999px;
    padding: 9px 16px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.12s;
    white-space: nowrap;
  }
  .home-btn svg { width: 16px; height: 16px; flex: 0 0 auto; }
  .home-btn:hover { background: rgba(255,250,240,0.2); border-color: rgba(255,250,240,0.5); }
  .home-btn:active { transform: scale(0.96); }
  #scorebar {
    display: none;
    margin-top: 12px;
    font-size: 13.5px;
    font-weight: 700;
    background: rgba(255,250,240,0.12);
    border: 1px solid rgba(255,250,240,0.18);
    border-radius: 999px;
    padding: 7px 16px;
    width: fit-content;
    font-variant-numeric: tabular-nums;
  }
  .header-band {
    position: relative;
    height: 4px;
    background: linear-gradient(90deg, var(--judah), var(--gold), var(--israel));
  }
  main { max-width: 900px; margin: 0 auto; padding: 36px 18px; }

  /* ===== Buttons (shared) ===== */
  .btn-primary, .finish-btn, .reveal-btn {
    background: linear-gradient(135deg, var(--judah), var(--gold));
    color: var(--on-accent);
    border: none;
    border-radius: 999px;
    padding: 13px 26px;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 10px 22px -12px var(--judah);
    transition: transform 0.14s, box-shadow 0.14s, filter 0.14s;
  }
  .btn-primary:hover, .finish-btn:hover, .reveal-btn:hover { filter: brightness(1.05); box-shadow: 0 12px 26px -10px var(--judah); }
  .btn-primary:active, .finish-btn:active, .reveal-btn:active { transform: scale(0.96); }
  .finish-btn:disabled { background: var(--card-2); color: var(--sub); box-shadow: none; cursor: not-allowed; filter: none; }
  .restart-btn {
    background: var(--surface);
    color: var(--ink);
    border: 1.5px solid var(--line);
    border-radius: 999px;
    padding: 13px 24px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: border-color 0.14s, background 0.14s, transform 0.12s;
  }
  .restart-btn:hover { border-color: var(--gold); background: var(--gold-soft); }
  .restart-btn:active { transform: scale(0.96); }

  /* ===== Home ===== */
  .home-hero { position: relative; text-align: center; margin-bottom: 40px; padding-top: 6px; }
  .home-hero::before {
    content: "";
    position: absolute;
    top: -30px; left: 50%; transform: translateX(-50%);
    width: 420px; height: 220px;
    background: radial-gradient(closest-side, var(--bg-glow-1), transparent 70%);
    pointer-events: none;
    z-index: -1;
  }
  .hero-strip {
    display: flex;
    justify-content: center;
    gap: 4px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .hero-strip span {
    display: inline-block;
    width: 26px; height: 7px;
    border-radius: 99px;
  }
  .home-hero h2 {
    font-size: 32px; margin: 0 0 12px; font-weight: 800;
    background: linear-gradient(100deg, var(--title-1), var(--title-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .home-hero p { color: var(--sub); font-size: 15.5px; max-width: 540px; margin: 0 auto; }
  .mode-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 640px) {
    .mode-grid { grid-template-columns: 1fr 1fr; }
    /* מספר אי-זוגי של כרטיסים: האחרון נפרס על השורה במקום להישאר תלוי */
    .mode-grid > .mode-card:last-child:nth-child(odd) { grid-column: 1 / -1; }
  }
  .mode-card {
    position: relative;
    overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 24px 22px;
    text-align: right;
    cursor: pointer;
    transition: transform 0.16s, box-shadow 0.16s, border-color 0.16s;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: var(--shadow);
  }
  .mode-card::after {
    content: "";
    position: absolute;
    inset-inline-end: -34px; top: -34px;
    width: 110px; height: 110px;
    border-radius: 50%;
    background: var(--mc, var(--gold));
    opacity: 0.16;
    filter: blur(4px);
  }
  .mode-card:hover { box-shadow: var(--shadow-lift); transform: translateY(-4px); border-color: var(--mc, var(--gold)); }
  .mode-card .icon-badge {
    width: 48px; height: 48px;
    border-radius: 15px;
    display: flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--mc, var(--gold)) 16%, transparent);
    border: 1px solid color-mix(in srgb, var(--mc, var(--gold)) 32%, transparent);
    color: var(--mc, var(--gold));
  }
  .mode-card .icon-badge svg { width: 24px; height: 24px; }
  .mode-card h3 { margin: 0; font-size: 17.5px; color: var(--ink); font-weight: 700; }
  .mode-card p { margin: 0; font-size: 13.5px; color: var(--sub); line-height: 1.5; }

  /* ===== Section select screens ===== */
  .select-screen { text-align: center; padding: 4px 16px; }
  .select-screen h2 { font-size: 25px; margin: 0 0 8px; color: var(--ink); font-weight: 800; }
  .select-screen .lede { color: var(--sub); font-size: 14.5px; margin-bottom: 30px; max-width: 520px; margin-inline: auto; }
  .topic-btn {
    display: flex;
    align-items: center;
    gap: 15px;
    width: 100%;
    max-width: 480px;
    margin: 0 auto 12px;
    padding: 15px 20px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    cursor: pointer;
    color: var(--ink);
    transition: all 0.15s;
    text-align: right;
    box-shadow: var(--shadow);
  }
  .topic-btn:hover { border-color: var(--gold); box-shadow: var(--shadow-lift); transform: translateY(-2px); }
  .topic-btn .tb-badge {
    flex: 0 0 40px;
    width: 40px; height: 40px;
    border-radius: 12px;
    background: var(--gold-soft);
    color: var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 15px;
    font-variant-numeric: tabular-nums;
  }
  .topic-btn .tb-text { flex: 1; min-width: 0; }
  .topic-btn .tb-title { display: block; font-size: 16.5px; font-weight: 700; color: var(--ink); }
  .topic-btn .tb-sub { display: block; font-size: 12.5px; color: var(--sub); font-weight: 400; margin-top: 4px; }

  /* ===== Quiz cards ===== */
  .section-title { font-size: 22px; font-weight: 800; margin: 30px 0 4px; color: var(--ink); }
  .section-sub { font-size: 13.5px; color: var(--sub); margin: 0 0 24px; }
  .qcard {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 20px 22px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }
  .qtopic {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--gold);
    background: var(--gold-soft);
    border-radius: 999px;
    padding: 4px 12px;
    margin-bottom: 10px;
  }
  .qtext { font-size: 15.5px; font-weight: 700; margin-bottom: 14px; }
  .opt {
    display: block;
    width: 100%;
    text-align: right;
    padding: 12px 16px;
    margin-bottom: 8px;
    border: 1.5px solid var(--line);
    border-radius: var(--r-md);
    background: var(--surface);
    font-size: 14.5px;
    cursor: pointer;
    color: var(--ink);
    transition: all 0.12s;
  }
  .opt:hover:not(.locked) { border-color: var(--gold); background: var(--gold-soft); }
  .opt.correct { background: var(--good-soft); border-color: var(--good); color: var(--good); font-weight: 700; }
  .opt.incorrect { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); font-weight: 700; }
  .opt.locked { cursor: default; }
  .explain {
    margin-top: 12px;
    font-size: 13px;
    color: var(--sub);
    background: var(--card);
    border-radius: var(--r-sm);
    padding: 12px 14px;
    display: none;
    border-inline-start: 3px solid var(--gold);
  }
  .fill-input {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid var(--line);
    border-radius: var(--r-md);
    font-size: 14.5px;
    margin-bottom: 10px;
    font-family: inherit;
    background: var(--surface);
    color: var(--ink);
  }
  .fill-input:focus { border-color: var(--gold); outline: none; }
  .model-answer {
    display: none;
    margin-top: 12px;
    background: var(--gold-soft);
    border-radius: var(--r-sm);
    padding: 13px 15px;
    font-size: 14px;
    color: #6B4E0C;
    border-inline-start: 3px solid var(--gold);
  }
  .rate-row { display: none; margin-top: 12px; gap: 8px; flex-wrap: wrap; }
  .rate-btn {
    padding: 9px 16px;
    border-radius: 999px;
    border: 1.5px solid var(--line);
    background: var(--surface);
    cursor: pointer;
    font-size: 13px;
    font-weight: 700;
    transition: all 0.12s;
  }
  .rate-btn.active-2 { background: var(--good-soft); border-color: var(--good); color: var(--good); }
  .rate-btn.active-0 { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
  .finish-wrap { text-align: center; margin: 34px 0; }
  .results-box {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 32px 24px;
    text-align: center;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
  }
  .results-box .big-score { font-size: 44px; font-weight: 800; color: var(--ink); margin: 8px 0; font-variant-numeric: tabular-nums; }
  .results-box .pct { font-size: 16px; color: var(--sub); margin-bottom: 4px; }
  .breakdown { text-align: right; margin-top: 22px; }
  .breakdown-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 6px;
    border-bottom: 1px solid var(--line-soft);
    font-size: 14px;
    font-variant-numeric: tabular-nums;
  }
  .backlink { display: inline-block; margin-top: 20px; color: var(--sub); cursor: pointer; font-size: 13.5px; }
  .backlink:hover { color: var(--ink); text-decoration: underline; }

  /* ===== Timeline (tap-to-place) ===== */
  .tl-instructions {
    background: var(--card);
    border-inline-start: 3px solid var(--gold);
    border-radius: var(--r-sm);
    padding: 11px 15px;
    font-size: 13px;
    color: var(--sub);
    margin-bottom: 18px;
  }
  .tl-dir-hint {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--sub);
    font-weight: 700;
    padding: 0 4px;
    margin-bottom: 7px;
  }
  .tl-dir-hint span:first-child::before { content: "◄ "; }
  .tl-dir-hint span:last-child::after { content: " ►"; }
  /* ---- הדרכה בשלושה שלבים ---- */
  .tl-steps {
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--card);
    border-radius: var(--r-md);
    padding: 14px 16px;
    margin-bottom: 18px;
    border: 1px solid var(--line-soft);
  }
  .tl-step {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13.5px;
    color: var(--sub);
    transition: color 0.15s;
  }
  .tl-step-num {
    flex: 0 0 22px;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--card-2);
    color: var(--sub);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 800;
  }
  .tl-step.now { color: var(--ink); font-weight: 700; }
  .tl-step.now .tl-step-num { background: var(--gold); color: var(--on-accent); }

  .tl-slots, .tl-bank { display: flex; gap: 10px; flex-wrap: wrap; }
  .tl-slots { padding: 12px; background: var(--card); border-radius: var(--r-md); margin-bottom: 14px; border: 1px solid var(--line-soft); }
  .tl-bank { padding: 4px 4px 10px; }
  .tl-slot {
    position: relative;
    flex: 0 0 132px;
    min-height: 80px;
    border: 2px dashed var(--line);
    border-radius: var(--r-md);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--sub);
    font-size: 13px;
    font-weight: 700;
    background: var(--surface);
    transition: border-color 0.12s, background 0.12s;
  }
  .tl-slot-num {
    position: absolute;
    top: -9px;
    inset-inline-start: -7px;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--surface);
    border: 1.5px solid var(--line);
    color: var(--sub);
    font-size: 11.5px;
    font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    font-variant-numeric: tabular-nums;
    z-index: 3;
  }
  .tl-slot.filled .tl-slot-num { border-color: var(--gold); color: var(--gold); }
  .tl-slot-ph { font-size: 12px; font-weight: 600; opacity: 0.65; }
  .tl-slot.empty.can-drop {
    border-color: var(--gold);
    background: var(--gold-soft);
    cursor: pointer;
    animation: slotPulse 1.6s ease-in-out infinite;
  }
  .tl-slot.empty.can-drop .tl-slot-ph { opacity: 1; color: var(--gold); font-weight: 800; }
  @keyframes slotPulse { 50% { box-shadow: 0 0 0 4px var(--gold-soft); } }
  @media (prefers-reduced-motion: reduce) { .tl-slot.empty.can-drop { animation: none; } }
  .tl-slot.filled { border-style: solid; border-color: var(--line-soft); padding: 0; background: transparent; }


  /* ---- גרירה בציר הזמן ---- */
  /* touch-action: none נדרש כדי שמגע על כרטיס יגרור ולא יגלול את הדף.
     הגלילה נשמרת דרך כל השטח שמסביב — הרווחים, הכותרות ומסגרת המשבצות. */
  .tl-card { touch-action: none; cursor: grab; -webkit-user-select: none; user-select: none; }
  .tl-card:active { cursor: grabbing; }
  body.tl-drag-on { cursor: grabbing; -webkit-user-select: none; user-select: none; }
  body.tl-drag-on .tl-card { cursor: grabbing; }

  .tl-card.tl-dragging { opacity: 0.3; }
  .tl-card.tl-ghost {
    position: fixed;
    left: 0; top: 0; margin: 0;
    transition: none;
    pointer-events: none;
    z-index: 900;
    box-shadow: var(--shadow-lift);
    transform-origin: 50% 50%;
    rotate: -1.5deg;
    opacity: 0.97;
  }

  /* יעד הנחיתה — חזק יותר מ-can-drop, ועובד גם על משבצת תפוסה */
  .tl-slot.drop-over {
    border-color: var(--gold) !important;
    border-style: solid !important;
    background: var(--gold-soft) !important;
    box-shadow: 0 0 0 3px var(--gold-soft);
    animation: none !important;
  }
  .tl-slot.drop-over .tl-slot-ph { color: var(--gold); font-weight: 800; opacity: 1; }
  .tl-slot.filled.drop-over .tl-card { outline: 2px dashed var(--gold); outline-offset: 2px; }
  .tl-bank.drop-over {
    background: var(--gold-soft);
    border-radius: var(--r-md);
    box-shadow: inset 0 0 0 2px var(--gold);
  }
  @media (prefers-reduced-motion: reduce) { .tl-card.tl-ghost { rotate: none; } }
  /* ---- מד התקדמות ---- */
  .tl-progress { margin-bottom: 20px; }
  .tl-progress-bar {
    height: 7px;
    border-radius: 99px;
    background: var(--card-2);
    overflow: hidden;
    margin-bottom: 7px;
  }
  .tl-progress-bar i {
    display: block;
    height: 100%;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--judah), var(--gold));
    transition: width 0.3s cubic-bezier(.22,1,.36,1);
  }
  .tl-progress-txt { font-size: 13px; font-weight: 700; color: var(--sub); text-align: center; }
  .tl-progress.done .tl-progress-txt { color: var(--good); }
  .tl-progress.done .tl-progress-bar i { background: var(--good); }
  .tl-bank-label { font-size: 12.5px; font-weight: 800; color: var(--sub); margin-bottom: 8px; }
  .tl-bank-empty { font-size: 13px; color: var(--sub); padding: 6px 2px; }
  .tl-card {
    flex: 0 0 132px;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: var(--r-md);
    padding: 11px 11px 10px;
    cursor: pointer;
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    user-select: none;
    transition: all 0.12s;
    position: relative;
    box-shadow: var(--shadow);
  }
  .tl-card:hover { border-color: var(--gold); box-shadow: var(--shadow-lift); }
  .tl-card.selected { border-color: var(--gold); background: var(--gold-soft); box-shadow: 0 0 0 3px var(--gold-soft), var(--shadow-lift); }
  .tl-card.correct { border-color: var(--good); background: var(--good-soft); }
  .tl-card.incorrect { border-color: var(--bad); background: var(--bad-soft); }
  .tl-card-label { line-height: 1.35; }
  .tl-card-dates { margin-top: 5px; font-size: 11.5px; font-weight: 500; color: var(--sub); font-variant-numeric: tabular-nums; }
  .tl-card.correct .tl-card-dates, .tl-card.incorrect .tl-card-dates { color: inherit; }
  .tl-remove {
    position: absolute;
    top: -8px;
    inset-inline-start: -8px;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--ink);
    color: var(--on-accent);
    font-size: 12px;
    line-height: 20px;
    text-align: center;
    font-weight: 700;
  }
  .tl-remove:hover { background: var(--bad); }
  .tl-controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 24px; }
  .tl-result { text-align: center; margin-top: 18px; font-size: 17px; font-weight: 800; color: var(--ink); }

  /* ===== Kings Gantt (vertical) ===== */
  .kg-legend { display: flex; justify-content: center; gap: 22px; margin-bottom: 6px; font-size: 13px; font-weight: 700; flex-wrap: wrap; }
  .kg-legend .dot { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-inline-end: 6px; vertical-align: -1px; }
  .kg-source { text-align: center; font-size: 12.5px; color: var(--sub); margin: 8px 0 22px; }
  .kg-vwrap {
    --kg-axis-w: 116px;
    --kg-ev-w: 150px;
    max-width: 860px;
    margin: 0 auto;
  }
  .kg-vheads {
    display: grid;
    grid-template-columns: 1fr var(--kg-axis-w) 1fr var(--kg-ev-w);
    align-items: center;
    margin-bottom: 10px;
  }
  .kg-vhead {
    display: inline-flex;
    justify-self: center;
    align-items: center;
    gap: 7px;
    font-size: 14.5px;
    font-weight: 800;
    padding: 6px 16px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--kc) 14%, transparent);
    border: 1px solid color-mix(in srgb, var(--kc) 30%, transparent);
    color: var(--kc);
  }
  .kg-vhead .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--kc); }
  .kg-vbody {
    position: relative;
    display: grid;
    grid-template-columns: 1fr var(--kg-axis-w) 1fr var(--kg-ev-w);
  }
  .kg-vgridline {
    position: absolute;
    left: 0; right: 0;
    border-top: 1px dashed var(--line-soft);
  }
  .kg-vtick {
    position: absolute;
    left: 0; right: 0;
    transform: translateY(-50%);
    text-align: center;
    font-size: 10.5px;
    color: var(--sub);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    background: var(--bg);
    z-index: 2;
  }
  .kg-vcol, .kg-vaxis { position: relative; height: 100%; }
  .kg-vbar {
    position: absolute;
    right: 0; left: 0;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 11.5px;
    font-weight: 700;
    line-height: 1.2;
    color: var(--on-accent);
    overflow: hidden;
    padding: 1px 7px;
    border: 1px solid rgba(0,0,0,0.1);
    box-shadow: 0 2px 6px -3px rgba(32,26,17,.35);
    transition: filter 0.1s, box-shadow 0.1s;
  }
  .kg-vbar:hover, .kg-vbar.active { filter: brightness(1.08); box-shadow: var(--shadow-lift); z-index: 8 !important; }
  .kg-vbar.thin { padding: 0; border-radius: 4px; }
  .kg-vbar.event-marker { background: var(--ink) !important; }
  .kg-vbar.co-regent {
    width: 46%;
    right: auto;
    left: 0;
    border-style: dashed;
    box-shadow: -2px 0 0 var(--bg);
  }
  .kg-vbar.important {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
    box-shadow: inset 0 0 0 2.5px var(--gold), 0 3px 9px -3px rgba(32,26,17,.45);
  }
  .kg-vbar.important .kv-name { font-weight: 900; }
  .kg-vbar.important .kv-name::before {
    content: "★";
    color: var(--gold);
    margin-inline-end: 5px;
    font-size: 10px;
    vertical-align: 1px;
  }

  /* ---- אבני דרך: פילוג הממלכה ונפילת הממלכות ---- */
  .kg-milestone {
    position: absolute;
    left: 0; right: 0;
    height: 20px;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    border: 0;
    background: none;
    padding: 0;
    cursor: pointer;
    z-index: 7;
    /* הפס חוצה את כל רוחב הגרף — רק התווית עצמה לוכדת קליקים,
       אחרת הוא חוסם תוויות אירועים ובלוקים שנמצאים באותו גובה */
    pointer-events: none;
  }
  .ms-label { pointer-events: auto; }
  .kg-milestone::before {
    content: "";
    position: absolute;
    left: 0; right: 0; top: 50%;
    border-top: 2px dashed var(--ink);
    opacity: 0.4;
  }
  .ms-label {
    position: relative;
    background: var(--ink);
    color: var(--on-accent);
    font-family: inherit;
    font-size: 10px;
    font-weight: 800;
    padding: 3px 13px;
    border-radius: 999px;
    white-space: nowrap;
    box-shadow: var(--shadow);
    transition: transform 0.12s;
  }
  .kg-milestone:hover .ms-label { transform: scale(1.05); }
  .kg-milestone:active .ms-label { transform: scale(0.96); }
  .kg-milestone.at-top .ms-label { transform: translateY(15px); }
  .kg-milestone.at-top:hover .ms-label { transform: translateY(15px) scale(1.05); }
  .kg-milestone.at-bottom .ms-label { transform: translateY(-15px); }
  .kg-milestone.at-bottom:hover .ms-label { transform: translateY(-15px) scale(1.05); }
  .kv-name { font-size: 11.5px; font-weight: 700; }
  .kv-prophet { font-size: 9.5px; font-weight: 500; opacity: 0.88; margin-top: 1px; }
  .kg-prophet-pill {
    position: absolute;
    transform: translateY(-50%);
    font-size: 9px;
    font-weight: 700;
    color: var(--gold);
    background: var(--gold-soft);
    border: 1px solid color-mix(in srgb, var(--gold) 38%, transparent);
    border-radius: 999px;
    padding: 2.5px 8px;
    max-width: 50px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    z-index: 6;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.12s, transform 0.12s, max-width 0.18s;
  }
  .kg-prophet-pill:hover { background: color-mix(in srgb, var(--gold) 26%, transparent); max-width: 130px; z-index: 9; }
  .kg-prophet-pill:active { transform: translateY(-50%) scale(0.94); }
  .kg-prophet-pill.active { background: var(--gold); color: var(--on-accent); border-color: var(--gold); max-width: 130px; z-index: 9; }
  .kg-prophet-pill-judah { right: 3px; }
  .kg-prophet-pill-israel { left: 3px; }
  .kg-prophet-pill-legend {
    display: inline-block;
    font-size: 9.5px;
    font-weight: 700;
    color: var(--gold);
    background: var(--gold-soft);
    border: 1px solid color-mix(in srgb, var(--gold) 38%, transparent);
    border-radius: 999px;
    padding: 2px 8px;
    margin-inline-end: 6px;
    vertical-align: 1px;
  }
  /* ---- עמודת אירועים וממצאים ---- */
  .kg-vhead-ev { --kc: var(--sub); }
  .kg-ev-rail {
    position: absolute;
    top: 0; bottom: 0;
    inset-inline-start: 0;
    width: 2px;
    background: var(--line);
    border-radius: 2px;
  }
  .kg-ev-dot {
    position: absolute;
    inset-inline-start: -3px;
    width: 8px; height: 8px;
    border-radius: 50%;
    transform: translateY(-50%);
    box-shadow: 0 0 0 2px var(--bg);
    z-index: 3;
  }
  .kg-ev-label {
    position: absolute;
    inset-inline-start: 12px;
    inset-inline-end: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    height: 22px;
    padding: 0 9px;
    border: 1px solid var(--line);
    border-inline-start: 3px solid var(--ec);
    border-radius: 999px;
    background: var(--surface);
    font-family: inherit;
    font-size: 10px;
    font-weight: 700;
    color: var(--ink);
    text-align: start;
    cursor: pointer;
    overflow: hidden;
    white-space: nowrap;
    transition: transform 0.12s, box-shadow 0.12s, border-color 0.12s;
  }
  .kg-ev-label:hover { box-shadow: var(--shadow); border-color: var(--ec); }
  .kg-ev-label:active { transform: scale(0.97); }
  .kg-ev-label.active { background: var(--card); border-color: var(--ec); box-shadow: var(--shadow); }
  .kg-ev-label .ev-year { color: var(--ec); font-variant-numeric: tabular-nums; flex: 0 0 auto; }
  .kg-ev-label .ev-title { overflow: hidden; text-overflow: ellipsis; }
  .kd-important {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    color: var(--gold);
    background: var(--gold-soft);
    border-radius: 999px;
    padding: 2px 10px;
    margin-inline-start: 6px;
    vertical-align: middle;
  }

  /* ===== Detail sheet ===== */
  .sheet {
    position: fixed;
    inset: 0;
    z-index: 60;
    display: none;
    align-items: flex-end;
    justify-content: center;
    background: rgba(32,26,17,0.42);
    backdrop-filter: blur(3px);
  }
  .sheet.on { display: flex; animation: sheetFade 0.18s ease-out; }
  @keyframes sheetFade { from { opacity: 0; } }
  @keyframes sheetUp { from { transform: translateY(100%); } }
  .sheet-card {
    position: relative;
    width: 100%;
    max-width: 560px;
    max-height: 86dvh;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--line);
    border-bottom: 0;
    border-radius: 26px 26px 0 0;
    padding: 12px 24px 26px;
    box-shadow: 0 -18px 44px -20px rgba(32,26,17,.5);
    animation: sheetUp 0.3s cubic-bezier(.22,1,.36,1);
  }
  @media (min-width: 640px) {
    .sheet { align-items: center; }
    .sheet-card { border-radius: 26px; border-bottom: 1px solid var(--line); max-height: 82vh; animation: sheetFade 0.2s ease-out; }
  }
  @media (prefers-reduced-motion: reduce) {
    .sheet.on, .sheet-card { animation: none; }
  }
  .sheet-grab { width: 42px; height: 4px; border-radius: 9px; background: var(--line); margin: 0 auto 10px; flex: 0 0 auto; }
  .sheet-close {
    position: absolute;
    top: 14px; inset-inline-start: 16px;
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--sub);
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    transition: background 0.12s, transform 0.12s;
  }
  .sheet-close:hover { background: var(--card-2); color: var(--ink); }
  .sheet-close:active { transform: scale(0.92); }
  .sheet-body { overflow-y: auto; padding-top: 6px; }
  .sheet-eyebrow { font-size: 11.5px; font-weight: 800; letter-spacing: 0.05em; color: var(--sub); margin-bottom: 4px; }
  .sheet-title { margin: 0 0 4px; font-size: 22px; font-weight: 800; }
  .sheet-years { font-size: 13.5px; color: var(--sub); font-weight: 600; font-variant-numeric: tabular-nums; }
  .sheet-rulers { font-size: 12.5px; color: var(--sub); font-weight: 600; margin-top: 3px; }
  .sheet-note { margin: 13px 0 0; font-size: 14.5px; line-height: 1.65; }
  .sheet-block { margin-top: 20px; }
  .sheet-label { font-size: 11.5px; font-weight: 800; letter-spacing: 0.04em; color: var(--sub); margin-bottom: 9px; }
  .sheet-empty { font-size: 13.5px; color: var(--sub); }
  .sheet-where { font-size: 13.5px; font-weight: 600; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    border: 1.5px solid var(--gold);
    background: var(--gold-soft);
    color: var(--gold);
    border-radius: 999px;
    padding: 8px 15px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.12s, transform 0.12s;
  }
  .chip-link:hover { background: color-mix(in srgb, var(--gold) 24%, transparent); }
  .chip-link:active { transform: scale(0.96); }
  .chip-sub { font-weight: 600; opacity: 0.75; font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .sheet-events { display: flex; flex-direction: column; gap: 8px; }
  .sheet-ev {
    display: flex;
    align-items: center;
    gap: 11px;
    text-align: start;
    border: 1px solid var(--line);
    border-inline-start: 3px solid var(--ec);
    background: var(--surface);
    border-radius: var(--r-md);
    padding: 11px 15px;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--ink);
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s, transform 0.12s;
  }
  .sheet-ev:hover { border-color: var(--ec); background: var(--card); }
  .sheet-ev:active { transform: scale(0.985); }
  .sheet-ev-year { color: var(--ec); font-variant-numeric: tabular-nums; flex: 0 0 auto; font-weight: 800; }
  .sheet-ev-title { font-weight: 600; }
  @media (max-width: 760px) {
    .kg-vwrap { --kg-axis-w: 86px; --kg-ev-w: 100px; }
    .kg-vheads { font-size: 12px; }
    .kg-vhead { font-size: 12px; padding: 5px 10px; gap: 5px; }
    .kg-prophet-pill { max-width: 40px; font-size: 8.5px; padding: 2px 6px; }
    .kg-prophet-pill:hover, .kg-prophet-pill.active { max-width: 110px; }
    .ms-label { font-size: 9px; padding: 3px 10px; }
    .kg-ev-label { font-size: 9px; padding: 0 6px; gap: 4px; inset-inline-start: 9px; }
    .kv-name { font-size: 10.5px; }
    .kv-prophet { font-size: 9px; }
  }

  /* ===== Archaeology section ===== */
  .arch-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 26px;
  }
  .arch-chip {
    border: 1.5px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    border-radius: 999px;
    padding: 9px 17px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.14s;
  }
  .arch-chip:hover { border-color: var(--ec); }
  .arch-chip:active { transform: scale(0.96); }
  .arch-chip.on {
    background: color-mix(in srgb, var(--ec) 14%, transparent);
    border-color: var(--ec);
    color: var(--ec);
  }
  .arch-list { display: flex; flex-direction: column; gap: 14px; }
  .arch-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-inline-start: 4px solid var(--ec);
    border-radius: var(--r-lg);
    padding: 18px 22px;
    box-shadow: var(--shadow);
    display: flex;
    gap: 18px;
    align-items: flex-start;
  }
  .arch-body { flex: 1; min-width: 0; }
  .arch-media { flex: 0 0 190px; }
  @media (max-width: 620px) {
    .arch-card { flex-direction: column; gap: 14px; }
    .arch-media { flex: none; width: 100%; }
  }

  /* ---- תמונת ממצא + קרדיט ---- */
  .find-img { margin: 0; }
  .find-img img {
    display: block;
    width: 100%;
    border-radius: var(--r-md);
    border: 1px solid var(--line);
    background: var(--card);
    aspect-ratio: 4 / 3;
    object-fit: cover;
  }
  .find-img figcaption {
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin-top: 6px;
    font-size: 10.5px;
    line-height: 1.45;
    color: var(--sub);
  }
  .find-img .fi-cap { font-weight: 700; font-size: 11.5px; color: var(--ink); }
  .find-img .fi-credit a { color: var(--sub); }
  .find-img.in-sheet { margin: 16px 0 0; }
  .find-img.in-sheet img { aspect-ratio: 16 / 10; }
  .arch-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .arch-year {
    font-size: 13px;
    font-weight: 800;
    color: var(--ec);
    font-variant-numeric: tabular-nums;
  }
  .arch-kind {
    font-size: 11px;
    font-weight: 700;
    color: var(--ec);
    background: color-mix(in srgb, var(--ec) 12%, transparent);
    border-radius: 999px;
    padding: 3px 11px;
  }
  .arch-card h3 { margin: 0 0 5px; font-size: 17px; font-weight: 800; }
  .arch-rulers { font-size: 12.5px; color: var(--sub); font-weight: 600; margin-bottom: 9px; }
  .arch-desc { margin: 0; font-size: 14px; line-height: 1.65; }
  .arch-where {
    margin-top: 10px;
    font-size: 12.5px;
    color: var(--sub);
    font-weight: 600;
    border-top: 1px solid var(--line-soft);
    padding-top: 9px;
  }
  .arch-count { text-align: center; font-size: 12.5px; color: var(--sub); margin-top: 6px; }

  .united-strip { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin-bottom: 30px; }
  .united-item { background: var(--ink); color: var(--on-accent); border-radius: var(--r-md); padding: 12px 22px; text-align: center; min-width: 112px; }
  .united-item .u-name { font-size: 15px; font-weight: 700; }
  .united-item .u-years { font-size: 12.5px; opacity: 0.75; margin-top: 2px; font-variant-numeric: tabular-nums; }

  .ltr-num { direction: ltr; unicode-bidi: isolate; }
  /* ============================ סקציית יהדות ============================ */

  /* --- מתג תצוגות --- */
  .jd-views {
    display: flex; gap: 4px; padding: 4px;
    background: var(--card); border: 1px solid var(--line-soft);
    border-radius: 999px; margin: 0 auto 22px; width: fit-content; max-width: 100%;
    flex-wrap: wrap; justify-content: center;
  }
  .jd-view {
    border: 0; background: transparent; color: var(--sub);
    font-family: inherit; font-size: 13.5px; font-weight: 700;
    padding: 10px 18px; min-height: 44px; border-radius: 999px;
    cursor: pointer; transition: background .16s, color .16s;
  }
  .jd-view:hover { color: var(--ink); }
  .jd-view.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

  /* --- סרגל כלים --- */
  .jd-toolbar {
    display: flex; flex-wrap: wrap; gap: 9px; align-items: center;
    justify-content: space-between; margin-bottom: 18px;
  }
  .jd-focus, .jd-allbtn {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1.5px solid var(--line); background: var(--surface); color: var(--sub);
    font-family: inherit; font-size: 13px; font-weight: 700;
    padding: 9px 15px; min-height: 44px; border-radius: 999px; cursor: pointer;
    transition: border-color .16s, background .16s, color .16s;
  }
  .jd-focus svg, .jd-allbtn svg { width: 15px; height: 15px; flex: 0 0 auto; }
  .jd-focus:hover, .jd-allbtn:hover { border-color: var(--gold); color: var(--ink); }
  .jd-focus.on {
    background: color-mix(in srgb, var(--gold) 13%, transparent);
    border-color: var(--gold); color: var(--gold);
  }
  .jd-tally {
    font-size: 11.5px; font-weight: 800; padding: 2px 8px; border-radius: 999px;
    background: color-mix(in srgb, var(--ink) 8%, transparent); color: var(--sub);
  }
  .jd-focus.on .jd-tally { background: color-mix(in srgb, var(--gold) 20%, transparent); color: var(--gold); }

  /* --- השרשרת --- */
  .jd-chain { position: relative; padding-inline-start: 26px; }
  .jd-chain::before {
    content: ""; position: absolute; inset-block: 10px 6px; inset-inline-start: 7px;
    width: 2px; background: linear-gradient(var(--line), var(--line-soft));
  }

  .jd-eragroup { margin-bottom: 6px; }
  .jd-era {
    position: relative; display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
    width: 100%; text-align: start; border: 0; background: var(--bg);
    font-family: inherit; color: inherit; cursor: pointer;
    padding: 13px 0 11px; min-height: 44px;
    position: sticky; top: 0; z-index: 3;
  }
  .jd-era::after {
    content: ""; position: absolute; inset-inline: -26px 0; bottom: 0;
    height: 1px; background: var(--line-soft);
  }
  .jd-era::before {
    content: ""; position: absolute; inset-inline-start: -26px; top: 16px;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--ec); border: 3px solid var(--bg); box-sizing: content-box;
  }
  .jd-era-txt { min-width: 0; }
  .jd-era-name { font-weight: 800; font-size: 16px; color: var(--ec); }
  .jd-era-range { display: block; font-size: 11.5px; color: var(--sub); font-weight: 600; }
  @media (min-width: 640px) {
    .jd-era-txt { display: flex; align-items: baseline; gap: 9px; }
    .jd-era-range { display: inline; font-size: 12px; }
  }
  .jd-era-count {
    margin-inline-start: auto; font-size: 11.5px; font-weight: 800;
    padding: 2px 9px; border-radius: 999px;
    background: color-mix(in srgb, var(--ec) 13%, transparent); color: var(--ec);
  }
  .jd-chev {
    flex: 0 0 auto; width: 16px; height: 16px; color: var(--sub);
    transition: transform .2s ease;
  }
  /* RTL: מקופל מצביע שמאלה, לכיוון קריאת הטקסט */
  .jd-eragroup.closed .jd-chev { transform: rotate(90deg); }
  .jd-era:hover .jd-era-name { text-decoration: underline; text-underline-offset: 3px; }

  .jd-erabody { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .24s ease; }
  .jd-eragroup.closed .jd-erabody { grid-template-rows: 0fr; }
  .jd-erabody-inner { overflow: hidden; min-height: 0; padding-top: 11px; }
  .jd-eragroup.closed .jd-erabody-inner { padding-top: 0; }

  /* פריט מרכזי — כרטיס מלא */
  .jd-item {
    position: relative; display: block; width: 100%; text-align: start;
    background: var(--surface); border: 1px solid var(--line);
    border-inline-start: 4px solid var(--ec);

function showEntryView(view, updateUrl) {
  const entry = ENTRY_VIEWS[view];
  if (!entry) return renderHome();
  activeEntryView = view;
  document.body.dataset.view = view;
  appTitle.textContent = entry.title;
  appSubtitle.textContent = entry.subtitle;
  if (updateUrl) {
    const url = new URL(window.location.href);
    url.searchParams.set("view", view);
    window.history.replaceState({}, "", url);
  }
  entry.render();
}

function returnFromView() {
  if (activeEntryView && window.parent !== window) {
    const section = ENTRY_VIEWS[activeEntryView].section;
    window.parent.location.href = "/moreh-derech/" + section + "/";
    return;
  }
  activeEntryView = null;
  document.body.removeAttribute("data-view");
  appTitle.textContent = "ציר הזמן ההיסטורי — קורס מורי דרך";
  appSubtitle.textContent = "תיארוך, אירועים ודמויות: להבין מה קדם למה";
  const url = new URL(window.location.href);
  url.searchParams.delete("view");
  window.history.replaceState({}, "", url);
  renderHome();
}

function reportAttempt(detail) {
  if (window.parent === window) return;
  window.parent.postMessage({
    type: "even-derech:historical-attempt",
    quiz: detail.quiz,
    quizLabel: detail.quizLabel,
    category: detail.category,
    correct: detail.correct,
    total: detail.total,
  }, "*");
}

function topicBucket(t) {
  const i = t.indexOf(" — ");
  return i === -1 ? t : t.slice(0, i);
}

/* טווח מספרים בתוך טקסט עברי מתהפך ויזואלית (1522–1542 נראה 1542–1522).
   עוטף כל טווח בבועת LTR מבודדת כדי לשמור על סדר הקריאה הנכון. */
function ltrNums(s) {
  return String(s).replace(/\d[\d,]*\s*[\u2013\u2014\u2212-]\s*\d[\d,]*/g,
    function (m) { return '<span class="ltr-num">' + m + '</span>'; });
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}

/* ============================= Quiz engine ============================= */

function computeQuizScore(key) {
  const quiz = QUIZZES[key];
  let earned = 0, possible = quiz.items.length * 2;
  quiz.items.forEach((item, i) => {
    if (item.type === "mc") {
      if (quizState.mcAnswers[i] !== undefined && quizState.mcAnswers[i] === item.correct) earned += 2;
    } else {
      if (quizState.fillRatings[i] !== undefined) earned += quizState.fillRatings[i];
    }
  });
  return { earned, possible };
}

function updateScorebar() {
  if (mode === "quiz" && quizState.key !== null) {
    const { earned, possible } = computeQuizScore(quizState.key);
    scorebar.style.display = "block";
    scorebar.textContent = "ציון נוכחי: " + earned + " / " + possible + " נקודות";
  } else {
    scorebar.style.display = "none";
  }
}

function renderQuizSelect() {
  mode = "quiz";
  updateScorebar();
  app.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.className = "select-screen";
  wrap.innerHTML = "<h2>שאלוני תיארוך</h2><div class=\"lede\">בחרו נושא — כל שאלון משלב שאלות אמריקאיות והשלמת מקום על תאריכים, סדר אירועים ותקופות מקבילות</div>";
  Object.keys(QUIZZES).forEach((key, idx) => {
    const q = QUIZZES[key];

    btn.className = "topic-btn";
    const mcN = q.items.filter((i) => i.type === "mc").length;
    const fillN = q.items.length - mcN;
    btn.innerHTML = '<span class="tb-badge">' + (idx + 1) + '</span><span class="tb-text"><span class="tb-title">' + q.title + '</span><span class="tb-sub">' + q.items.length + ' שאלות (' + mcN + ' אמריקאיות + ' + fillN + ' השלמת מקום) — ' + (q.items.length * 2) + " נק'</span></span>";
    btn.onclick = () => renderQuiz(key);

  centerWrap.appendChild(back);
