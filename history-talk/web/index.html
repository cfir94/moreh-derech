<!doctype html>
<html lang="he" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>דבר עם ההיסטוריה</title>
    <meta name="description" content="שיחה קולית בעברית עם דמויות היסטוריות — שחזור מבוסס בינה מלאכותית, למטרות לימוד." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./src/ui/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1 class="grad-text">דבר עם ההיסטוריה</h1>
      <p class="sub">בחרו דמות ודברו איתה בקול, בעברית ובזמן אמת.</p>
    </header>
    <main class="index">
      <section class="consent card" aria-labelledby="consent-title">
        <h2 id="consent-title" class="visually-hidden">אישור לפני שמתחילים</h2>
        <label class="check">
          <input type="checkbox" id="consent" />
          <span>אני מעל גיל 18 ומבין/ה שזו דמות מבוססת בינה מלאכותית ושהשמע נשלח לעיבוד אצל Google.</span>
        </label>
      </section>
      <ul class="grid" id="characters" aria-label="דמויות"></ul>
      <p class="disclaimer">
        הדמויות הן שחזור מבוסס בינה מלאכותית שנשען על מקורות כתובים — לא ציטוט מדויק. השמע והטקסט נשלחים
        ל-Google Gemini לעיבוד; האתר לא שומר תמלולים.
      </p>
    </main>
    <script type="module" src="./src/main-index.ts"></script>
  </body>
</html>
