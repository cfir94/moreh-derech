<!doctype html>
<html lang="he" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>שיחה — דבר עם ההיסטוריה</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./src/ui/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="back" id="back" href="./">→ כל הדמויות</a>
      <p class="sub">דבר עם ההיסטוריה</p>
    </header>
    <main class="talk" id="talk" hidden>
      <section class="stage card" aria-labelledby="char-name">
        <div id="avatar-slot"></div>
        <h1 id="char-name"></h1>
        <p class="meta" id="char-meta"></p>
        <p class="status" id="status" role="status" aria-live="polite">מוכן לשיחה</p>
        <p class="timer" id="timer" hidden aria-live="off"></p>
        <p class="warning" id="warning" role="alert" hidden>נשארה דקה אחת לשיחה.</p>
        <div class="error" id="error" role="alert" hidden>
          <p id="error-text"></p>
          <div class="error-actions">
            <a class="btn ghost" id="open-window" target="_blank" rel="noopener" hidden>פתח בחלון חדש</a>
            <button type="button" class="btn ghost" id="text-only" hidden>המשך בכתיבה בלבד</button>
          </div>
        </div>

        <div class="prestart" id="prestart">
          <label class="check" id="consent-row">
            <input type="checkbox" id="consent" />
            <span>אני מעל גיל 18 ומבין/ה שזו דמות מבוססת בינה מלאכותית ושהשמע נשלח לעיבוד אצל Google.</span>
          </label>
          <div id="turnstile" class="turnstile"></div>
          <button type="button" class="btn primary big" id="start">התחל שיחה</button>
        </div>

        <div class="controls" id="controls" hidden>
          <button type="button" class="btn ghost" id="mute" aria-pressed="false">השתק מיקרופון</button>
          <button type="button" class="btn danger" id="end">סיים שיחה</button>
        </div>

        <div class="samples" id="samples" aria-label="שאלות לדוגמה"></div>

        <form class="type" id="type-form" hidden>
          <label for="type-input" class="visually-hidden">כתוב במקום לדבר</label>
          <input id="type-input" type="text" autocomplete="off" maxlength="500" placeholder="כתוב במקום לדבר…" />
          <button type="submit" class="btn primary">שלח</button>
        </form>
      </section>

      <aside class="side card" aria-label="תמלול ומקורות">
        <div class="side-head">
          <h2>תמלול</h2>
          <button type="button" class="btn ghost small" id="toggle-transcript" aria-expanded="true" aria-controls="transcript">
            הסתר
          </button>
        </div>
        <ol class="transcript" id="transcript" aria-live="polite"></ol>
        <section id="quiz-panel" hidden>
          <h2>שאלות הבוחן</h2>
          <p class="quiz-hint">כדי לראות שאלה כתובה — לפתוח אותה. התשובה לא מוצגת.</p>
          <ol class="quiz-cards" id="quiz-cards"></ol>
        </section>
        <h2>מקורות שהוזכרו</h2>
        <ul class="sources" id="sources"></ul>
        <details class="all-sources">
          <summary>כל המקורות של הדמות</summary>
          <ul id="all-sources"></ul>
        </details>
      </aside>
    </main>
    <p class="disclaimer">שחזור מבוסס בינה מלאכותית, לא ציטוט מדויק. האתר לא שומר תמלולים.</p>
    <script type="module" src="./src/main-talk.ts"></script>
  </body>
</html>
